<style>
:root{--bg:#f1f4fa;--panel:#fff;--ink:#1c2a42;--muted:#66748a;--line:#dce3ef;--accent:#4355d9;--soft:#edf0ff;--teal:#087f83;--orange:#ce741b;--red:#c53e57;--shadow:0 8px 32px #29376e0a;--node:#495bd6;--edge:#a3aec3;--green:#18875e}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}body.dark{--bg:#101625;--panel:#1a2336;--ink:#edf2ff;--muted:#a9b6cb;--line:#344059;--accent:#9bafff;--soft:#293452;--teal:#4dd5c7;--orange:#ffbb67;--red:#ff8ea4;--shadow:none;--node:#758cf7;--edge:#657590;--green:#60d9a3}button,input,select,textarea{font:inherit;color:inherit}button,select,input[type=number],input[type=text],textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}button{cursor:pointer;transition:background .15s,transform .15s}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}button.primary,button.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}body.dark button.primary,body.dark button.on{color:#101625}button.small{padding:5px 8px;font-size:12px}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}a{color:var(--accent)}input[type=range]{accent-color:var(--accent)}header{height:65px;padding:0 23px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--panel)}.logo{width:35px;height:35px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:23px}.brand b{display:block;font-size:16px;letter-spacing:-.3px}.brand small{color:var(--muted);font-size:11px}.spacer{flex:1}.headerActions{display:flex;gap:7px;align-items:center}.app{display:grid;grid-template-columns:225px minmax(0,1fr);height:calc(100vh - 65px)}aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:18px 12px}.navhead{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin:18px 9px 7px}.navhead:first-child{margin-top:0}.lessonbtn{display:flex;width:100%;text-align:left;align-items:center;gap:9px;border:0;background:transparent;padding:7px 9px;font-size:12px;margin:2px 0}.lessonbtn .num{font-size:10px;display:grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--bg);color:var(--muted)}.lessonbtn.active{background:var(--soft);color:var(--accent);font-weight:650}.lessonbtn.done .num{color:var(--green)}.progress{margin:14px 8px;font-size:11px;color:var(--muted)}.progressbar{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}.progressbar i{display:block;background:var(--teal);height:100%}main{overflow:auto;padding:17px 20px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}.introbar{display:flex;align-items:center;gap:12px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.8px;color:var(--teal);text-transform:uppercase}h1{font-size:23px;margin:2px 0 0;letter-spacing:-.65px;line-height:1.25}h2{font-size:16px;margin:0 0 9px}h3{font-size:13px;margin:12px 0 7px}p{margin:0 0 10px}.subtle{color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.lessontext{padding:14px 17px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px}.lessontext p{font-size:13px;margin-bottom:8px}.formula{background:var(--soft);padding:8px 12px;border-radius:8px;font-family:Georgia,serif;font-size:17px;color:var(--accent)}.challenge{border-left:3px solid var(--teal);padding-left:12px;font-size:12px}.challenge b{display:block;color:var(--teal);margin-bottom:4px}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolbar{padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar label{font-size:11px;color:var(--muted)}#example{max-width:225px}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(305px,1fr);gap:12px;flex:1;min-height:530px}.graphcard{display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:530px}.graphtop{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap}.chip{display:inline-block;border-radius:5px;padding:2px 6px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:650}.grapharea{position:relative;flex:1;min-height:340px;overflow:hidden;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 1px);background-size:20px 20px;touch-action:none}.grapharea svg{width:100%;height:100%;min-height:340px;position:absolute;inset:0}.edge{fill:none;stroke:var(--edge);stroke-width:2.4;cursor:pointer}.edge:hover{stroke:var(--orange);stroke-width:4}.edge.hit{stroke:var(--orange);stroke-width:5}.edge.blue{stroke:var(--accent);stroke-width:4}.edge.removed{stroke:var(--red);stroke-dasharray:7 5}.n{cursor:grab}.n circle{fill:var(--node);stroke:var(--panel);stroke-width:3;transition:fill .25s,r .25s}.n.selected circle{stroke:var(--orange);stroke-width:5}.n text{fill:#fff;text-anchor:middle;font-size:14px;font-weight:650;pointer-events:none}.n .nvalue{fill:var(--ink);font-size:11px;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.weight{fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;text-anchor:middle;font-size:12px;pointer-events:none}.corner{position:absolute;right:10px;top:10px;display:flex;gap:4px}.graphnote{position:absolute;left:12px;bottom:9px;right:12px;font-size:11px;color:var(--muted);pointer-events:none;background:var(--panel);border-radius:6px;padding:3px 7px;width:fit-content}.legend{display:flex;gap:13px;padding:7px 12px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);flex-wrap:wrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--node);margin-right:4px}.dot.orange{background:var(--orange)}.dot.teal{background:var(--teal)}.controls{padding:9px 12px;background:var(--bg);border-top:1px solid var(--line)}.status{font-size:12px;padding-top:7px;min-height:27px}.trace{color:var(--teal);font-family:ui-monospace,monospace;font-size:11px;max-height:38px;overflow:auto;margin-top:4px}.rightcard{display:flex;flex-direction:column;overflow:hidden;min-width:0}.tabs{display:flex;border-bottom:1px solid var(--line);padding:5px 7px;gap:2px;flex-wrap:wrap}.tabs button{font-size:11px;border:0;padding:7px 8px}.tabs button.active{color:var(--accent);background:var(--soft);font-weight:700}.panel{padding:14px;overflow:auto;flex:1;max-height:calc(100vh - 210px);min-height:330px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.stat{background:var(--bg);border-radius:9px;padding:8px}.stat strong{font-size:20px;display:block;font-weight:600;line-height:1.2}.stat small{font-size:10px;color:var(--muted)}.kv{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:5px 0;font-size:12px}.kv span:last-child{font-weight:600;text-align:right}.callout{background:var(--soft);border-radius:8px;padding:10px;font-size:12px;margin:10px 0}.tablewrap{overflow:auto;max-height:310px}table{border-collapse:collapse;font-size:11px;width:100%}th,td{padding:6px 7px;text-align:center;border:1px solid var(--line)}th{background:var(--soft);color:var(--accent);position:sticky;top:0}td.adj{background:var(--soft);font-weight:700}td.focus{background:var(--orange);color:var(--panel)}.checklist{font-size:12px;display:grid;gap:6px}.checklist span{padding:5px 7px;background:var(--bg);border-radius:5px}.walksequence{background:var(--bg);padding:10px;border-radius:8px;font-weight:650;min-height:44px;word-break:break-word}.result{padding:10px;border-radius:8px;margin:8px 0;background:var(--soft);font-size:12px}.good{color:var(--green)}.bad{color:var(--red)}.algo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.algo button{text-align:left;font-size:12px}.algo small{display:block;color:var(--muted);font-size:10px}.question{font-weight:650;font-size:14px;margin:10px 0}.answers{display:grid;gap:7px}.answers button{text-align:left;padding:10px 12px}.answers button.correct{border-color:var(--green);background:var(--soft)}.answers button.wrong{border-color:var(--red)}.hidden{display:none!important}.app.navhidden{grid-template-columns:1fr}.navhidden aside{display:none}.maxgraph .lessontext,.maxgraph .introbar{display:none}.maxgraph .workspace{min-height:calc(100vh - 175px)}footer{font-size:10px;color:var(--muted);text-align:right}.modalback{position:fixed;inset:0;background:#0b153477;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.modal{width:min(780px,100%);max-height:90vh;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:auto;padding:23px;box-shadow:0 20px 70px #0004}.modal .close{float:right}.modal .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.modal label{display:block;margin:9px 0 4px;font-size:12px}.modal textarea{width:100%;min-height:150px;font-family:monospace;font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:9px;background:var(--ink);color:var(--panel);z-index:50;box-shadow:var(--shadow);max-width:90vw}.barplot{width:100%;height:130px}.modelrow{display:grid;grid-template-columns:120px 1fr 35px;gap:7px;align-items:center;margin:9px 0;font-size:12px}.mini{font-size:11px}.glossary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.glossary div{background:var(--bg);padding:10px;border-radius:8px;font-size:12px}.glossary b{display:block;color:var(--accent)}details{margin:9px 0;font-size:12px}summary{cursor:pointer;font-weight:650}code{background:var(--bg);padding:1px 3px;border-radius:3px}#stepSlider{flex:1;min-width:90px}.tip{background:var(--bg);padding:7px 9px;border-radius:7px;font-size:11px;margin:9px 0}.switchlabel{font-size:12px;display:flex;align-items:center;gap:4px}.crumb{font-size:10px;color:var(--muted)}@media(min-width:1700px){main{padding:20px 32px}.workspace{grid-template-columns:minmax(0,2fr) minmax(340px,1fr)}}@media(max-width:1150px){.app{grid-template-columns:190px minmax(0,1fr)}main{padding:12px}.workspace{grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr)}.lessontext{gap:13px}header{padding:0 14px}.brand small{display:none}}@media(max-width:850px){.app{grid-template-columns:1fr;height:auto}.app aside{display:none}.app:not(.navhidden) aside{display:block;position:fixed;top:65px;bottom:0;width:230px;z-index:20;box-shadow:0 5px 40px #0003}.workspace{grid-template-columns:1fr}.graphcard{height:560px;min-height:560px}.panel{max-height:600px}.lessontext{grid-template-columns:1fr}.headerActions .desktop{display:none}h1{font-size:20px}.maxgraph .workspace{min-height:0}.modal .cols,.glossary{grid-template-columns:1fr}.rightcard{min-height:400px}.introbar{flex-wrap:wrap}.introbar>div:first-child{flex:1 0 100%}.introbar .spacer{display:none}header{gap:8px}.brand b{font-size:13px}.toolbar{gap:5px}}
</style></head><body>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors=['#5266d7','#119d95','#da8340','#af66c8','#d45778','#2d94bb','#7c9b3e','#8c7060'];
const lessons=[
{group:'1 · Lenguaje de los grafos',title:'Nodos, aristas y relaciones',ex:'friend',tab:'summary',text:'Un <b>grafo</b> es un modelo de relaciones: G = (V, E). V es el conjunto de vértices o nodos y E el de aristas. En este ejemplo, los nodos representan personas y una arista representa amistad. Dos nodos unidos son <b>adyacentes</b>; una arista es <b>incidente</b> en sus extremos. Un nodo puede quedar aislado.',formula:'Orden: n = |V| · Tamaño: m = |E|',task:'Haz clic en B y mira su vecindario. ¿Cuántas personas son amigas directas de B? Luego mueve B: las relaciones no cambian.',bridge:'Antes de calcular métricas, define qué representa cada nodo y qué significa una arista.'},
{group:'1 · Lenguaje de los grafos',title:'Dirigidos y no dirigidos',ex:'directed',tab:'summary',text:'Una amistad recíproca puede representarse con una arista no dirigida. “A sigue a B” requiere un arco <b>A → B</b>: no implica B → A. En un digrafo distinguimos <b>grado de entrada</b> (arcos que llegan) y <b>grado de salida</b> (arcos que salen). Los caminos dirigidos deben respetar las flechas.',formula:'Σ kᵢᶦⁿ = Σ kᵢᵒᵘᵗ = m',task:'Selecciona A y luego C. ¿Tienen los mismos grados de entrada y salida? En Caminos, intenta ir de E hacia A.',bridge:'Citas, correos, seguidores y flujos suelen requerir dirección.'},
{group:'1 · Lenguaje de los grafos',title:'Pesos, lazos y multigrafos',ex:'weighted',tab:'walk',text:'Un <b>peso</b> puede representar costo, distancia o intensidad. “Menos aristas” y “menor costo” son objetivos diferentes. Un <b>lazo</b> une un nodo consigo mismo. Un <b>multigrafo</b> permite varias aristas entre el mismo par; un grafo simple no tiene lazos ni aristas paralelas. La app admite ambos casos.',formula:'Longitud = número de aristas · Costo = Σ pesos',task:'Compara A → D con BFS y Dijkstra. Luego carga “Lazos y aristas paralelas”: el lazo aporta 2 al grado no dirigido.',bridge:'El peso de amistad es intensidad, no necesariamente distancia: no uses Dijkstra sin interpretar los pesos.'},
{group:'1 · Lenguaje de los grafos',title:'Grado y vecindario',ex:'star',tab:'summary',text:'El <b>grado</b> kᵢ cuenta aristas incidentes. El <b>vecindario</b> N(i) reúne vecinos distintos. En un grafo simple sin lazos, kᵢ = |N(i)|. En un multigrafo pueden diferir. Un nodo de grado cero es aislado y uno de grado uno es una hoja. En grafos no dirigidos, cada arista aporta 2 a la suma de grados.',formula:'Σ kᵢ = 2m · ⟨k⟩ = 2m/n',task:'En esta estrella selecciona A y una hoja. ¿Cuál es el grado promedio? Activa “Por grado” y “Valores”.',bridge:'El grado es el primer indicador de conectividad local; no describe por sí solo la posición en la red.'},
{group:'1 · Lenguaje de los grafos',title:'Matriz, listas e incidencia',ex:'friend',tab:'matrix',text:'La <b>matriz de adyacencia</b> registra conexiones: fila = origen, columna = destino. En un grafo simple no dirigido es simétrica. La <b>lista de adyacencia</b> enumera vecinos. La <b>matriz de incidencia</b> relaciona nodos con aristas. Estas representaciones contienen la misma estructura, aunque permiten operaciones diferentes.',formula:'Aᵢⱼ = 1 si i y j están conectados; 0 si no',task:'Pasa el puntero sobre una celda no nula. Identifica su arista. Activa los pesos y compara con el ejemplo dirigido.',bridge:'Muchos algoritmos de Network Science operan sobre matrices dispersas o listas de vecinos.'},
{group:'2 · Familias y estructura',title:'Grafos completos y regulares',ex:'complete',tab:'summary',text:'En el <b>grafo completo Kₙ</b>, todo par de nodos distintos está unido. Un grafo es <b>k-regular</b> cuando todos sus nodos tienen grado k. Todo Kₙ es (n−1)-regular, pero un grafo regular puede tener muchas menos aristas. Un ciclo Cₙ es 2-regular. Regular no significa necesariamente conectado.',formula:'Kₙ: m = n(n−1)/2 · kᵢ = n−1',task:'Compara K₅, ciclo C₈ y dos triángulos. Los dos triángulos son 2-regulares y desconectados.',bridge:'El completo es un extremo de máxima densidad; la regularidad ayuda a construir redes de referencia.'},
{group:'2 · Familias y estructura',title:'Bipartitos y proyecciones',ex:'bipartite',tab:'summary',text:'Un grafo es <b>bipartito</b> si sus nodos se separan en dos conjuntos y cada arista conecta conjuntos diferentes. Es bipartito exactamente cuando no contiene ciclos impares (en la estructura no dirigida). Personas–eventos y autores–artículos son ejemplos. La <b>proyección</b> conecta nodos del mismo conjunto si comparten un vecino.',formula:'V = U ∪ W · U ∩ W = ∅ · E ⊆ U × W',task:'Activa “Por bipartición”. Proyecta sobre U en el panel Explorar. ¿Por qué aparecen triángulos en la proyección?',bridge:'Una proyección pierde información sobre los eventos originales y puede aumentar la densidad.'},
{group:'2 · Familias y estructura',title:'Subgrafos y complemento',ex:'bridge',tab:'summary',text:'Un <b>subgrafo</b> usa parte de los nodos y aristas. El subgrafo <b>inducido</b> por S conserva todas las aristas originales cuyos extremos están en S. El <b>complemento</b> de un grafo simple no dirigido contiene precisamente los pares distintos que no estaban unidos. El complemento depende del mismo conjunto de nodos.',formula:'E(G) ∩ E(Ḡ) = ∅ · E(G) ∪ E(Ḡ) = E(Kₙ)',task:'Selecciona varios nodos con Mayús + clic y aplica “Subgrafo inducido”. Después restaura y mira el complemento.',bridge:'Filtrar nodos y filtrar aristas son decisiones distintas: pueden producir estructuras diferentes.'},
{group:'2 · Familias y estructura',title:'Árboles, bosques y DAG',ex:'tree',tab:'summary',text:'Un <b>árbol</b> es un grafo no dirigido conectado y sin ciclos. Entre dos nodos hay un único camino simple. Un <b>bosque</b> puede tener varios árboles. Un <b>DAG</b> es un grafo dirigido sin ciclos dirigidos; su estructura no dirigida sí puede tener ciclos. Los DAG admiten ordenamientos topológicos.',formula:'Árbol: m = n−1 · Bosque: m = n−c',task:'Ejecuta BFS: sus aristas forman un árbol de búsqueda. Compara “Árbol” y “DAG de prerrequisitos”. Ordena el DAG topológicamente.',bridge:'Árboles modelan jerarquías; DAG modelan dependencias, no relaciones simétricas.'},
{group:'2 · Familias y estructura',title:'Isomorfismo y dibujo',ex:'cycle',tab:'summary',text:'Dos grafos son <b>isomorfos</b> si existe una correspondencia entre nodos que preserva todas las adyacencias. Mover nodos, rotar el dibujo o cambiar sus etiquetas no cambia la estructura. Tener igual número de nodos, aristas y grados es necesario, pero no suficiente para ser isomorfos.',formula:'{u,v} ∈ E(G) ⇔ {f(u),f(v)} ∈ E(H)',task:'Cambia entre distribución circular, aleatoria y de fuerzas. ¿Cambió alguna métrica? Un C₆ y dos triángulos tienen igual secuencia de grados, pero no son isomorfos.',bridge:'Un layout ayuda a ver la red; no constituye evidencia suficiente de comunidades o importancia.'},
{group:'3 · Recorridos y conectividad',title:'Recorrido, sendero y camino',ex:'friend',tab:'walk',text:'Aquí usamos <b>recorrido</b> (walk): puede repetir nodos y aristas; <b>sendero</b> (trail): no repite aristas; <b>camino simple</b> (path): no repite nodos. Un recorrido es cerrado si vuelve al inicio. Un <b>ciclo simple</b> solo repite el nodo inicial al final y no repite aristas. La terminología cambia entre libros; consulta nuestras convenciones.',formula:'Camino simple ⇒ sendero ⇒ recorrido',task:'Activa “Construir recorrido”. Prueba A–B–C–B; luego A–B–C–D–B. Observa qué clasificación cambia.',bridge:'Cuando midas distancia, usa caminos más cortos; repetir aristas no mejora una distancia con pesos positivos.'},
{group:'3 · Recorridos y conectividad',title:'Distancia y caminos mínimos',ex:'weighted',tab:'algorithms',text:'La <b>distancia geodésica</b> en un grafo sin pesos es el mínimo número de aristas de un camino. BFS la encuentra. Si los pesos representan costos no negativos, Dijkstra encuentra el costo mínimo. Dos nodos sin camino tienen distancia infinita. Puede haber varios caminos mínimos con igual longitud o costo.',formula:'d(u,v) = min longitud de un camino de u a v',task:'Ejecuta BFS desde A hasta D y luego Dijkstra. Compara el número de saltos con el costo total del resultado.',bridge:'En redes dirigidas d(u,v) puede ser diferente de d(v,u). Esta app calcula distancias globales en saltos.'},
{group:'3 · Recorridos y conectividad',title:'Componentes y conectividad',ex:'disconnected',tab:'summary',text:'Un grafo no dirigido es <b>conectado</b> si todo par de nodos se une mediante un camino. Sus <b>componentes conexas</b> son los grupos máximos conectados. En grafos dirigidos hay conectividad <b>débil</b> (ignorando flechas) y <b>fuerte</b> (todo par se alcanza en ambos sentidos). Un aislado también es una componente.',formula:'Fuerte: ∀u,v, existe u ⇝ v y v ⇝ u',task:'Colorea por componentes. Con el editor agrega una arista entre dos grupos. Luego compara componentes débiles y fuertes en “Digrafo con componentes”.',bridge:'La componente mayor suele estudiarse aparte. La app muestra su fracción; en redes pequeñas “gigante” es solo una analogía.'},
{group:'3 · Recorridos y conectividad',title:'Puentes y articulaciones',ex:'bridge',tab:'summary',text:'Un <b>puente</b> es una arista cuya eliminación aumenta el número de componentes. Una <b>articulación</b> es un nodo cuya eliminación lo aumenta. No toda arista entre grupos es un puente: puede existir una ruta alternativa. En grafos dirigidos, este panel analiza la conectividad débil.',formula:'Puente: c(G−e) > c(G)',task:'Pulsa “Mostrar puentes y articulaciones”. Elimina D–E con el editor. Restaura y agrega C–F: ¿D–E sigue siendo puente?',bridge:'Estas estructuras permiten introducir vulnerabilidad y redundancia de una red.'},
{group:'3 · Recorridos y conectividad',title:'Diámetro, radio y excentricidad',ex:'path',tab:'summary',text:'La <b>excentricidad</b> de un nodo es su máxima distancia a los demás. El <b>diámetro</b> es la mayor excentricidad y el <b>radio</b> la menor. Los nodos con excentricidad igual al radio forman el centro. Si hay pares inalcanzables, las distancias globales son infinitas. El promedio de pares alcanzables debe identificarse como tal.',formula:'ε(v)=maxᵤ d(v,u) · D=max ε(v) · R=min ε(v)',task:'Selecciona nodos de los extremos y del centro de P₇. Agrega una arista entre A y G: compara radio y diámetro.',bridge:'La longitud media de caminos resume accesibilidad; siempre especifica qué pares incluye.'},
{group:'4 · Estructuras y algoritmos',title:'Euler y Hamilton',ex:'euler',tab:'algorithms',text:'Un recorrido <b>euleriano</b> usa cada arista exactamente una vez. Un camino <b>hamiltoniano</b> visita cada nodo una sola vez. Son requisitos diferentes. Para un grafo no dirigido, las aristas deben pertenecer a una misma componente: con cero grados impares hay circuito euleriano; con dos, sendero euleriano abierto.',formula:'Euler: todas las aristas · Hamilton: todos los nodos',task:'Busca Euler y Hamilton en “Dos triángulos unidos en un nodo”. Tiene circuito euleriano, pero no ciclo hamiltoniano.',bridge:'Cubrir enlaces y visitar entidades son problemas diferentes. Hamilton se busca aquí solo con hasta 12 nodos.'},
{group:'4 · Estructuras y algoritmos',title:'BFS, DFS y árbol generador',ex:'bridge',tab:'algorithms',text:'<b>BFS</b> explora por capas usando una cola; <b>DFS</b> profundiza y usa una pila o recursión. Sus aristas de descubrimiento forman un árbol sobre los nodos alcanzables. Un <b>árbol generador</b> de un grafo conectado contiene todos los nodos y n−1 aristas. Kruskal obtiene uno de costo mínimo; en un grafo desconectado obtiene un bosque.',formula:'BFS: cola FIFO · DFS: pila LIFO',task:'Usa el mismo origen en BFS y DFS. Avanza paso a paso y observa la cola o pila. Ejecuta Kruskal sobre el ejemplo ponderado.',bridge:'Estas búsquedas son la base de muchos algoritmos de conectividad y distancias.'},
{group:'4 · Estructuras y algoritmos',title:'Cliques, coloreo y planaridad',ex:'complete',tab:'algorithms',text:'Una <b>clique</b> es un conjunto de nodos adyacentes entre sí. Un <b>coloreo propio</b> asigna colores distintos a nodos unidos. El coloreo greedy produce una solución válida para grafos sin lazos, pero no garantiza el mínimo de colores. Un grafo es <b>planar</b> si admite un dibujo sin cruces: un dibujo con cruces no prueba que sea no planar.',formula:'Planar simple, n≥3: m≤3n−6 (condición necesaria)',task:'Compara K₅, K₃,₃ y el ciclo. Ejecuta coloreo greedy. La app no decide planaridad general; ambos K₅ y K₃,₃ son no planares.',bridge:'Cliques expresan cohesión muy estricta; no equivalen a comunidades.'},
{group:'5 · Puente a Network Science',title:'Densidad, grados y clustering',ex:'communities',tab:'summary',text:'La <b>densidad</b> mide qué fracción de conexiones posibles existe. La <b>distribución de grados</b> indica la fracción de nodos con grado k. El <b>clustering local</b> mide qué fracción de pares de vecinos está conectada. Su promedio y la transitividad global no son idénticos. Aquí el clustering usa la proyección simple no dirigida.',formula:'ρ = 2m/[n(n−1)] · Cᵢ = 2tᵢ/[kᵢ(kᵢ−1)]',task:'Selecciona un nodo dentro de un triángulo y un nodo puente. Compara grado y clustering. Observa la distribución de grados.',bridge:'Densidad global y clustering local describen escalas diferentes: una red dispersa puede tener grupos muy cohesionados.'},
{group:'5 · Puente a Network Science',title:'Centralidad y modelos de redes',ex:'hub',tab:'summary',text:'La centralidad por <b>grado</b> cuenta conexiones directas. La <b>intermediación</b> mide la fracción de caminos mínimos que pasan por un nodo. La <b>cercanía armónica</b> suma inversos de distancias; los nodos inalcanzables aportan cero. ER, Watts–Strogatz y Barabási–Albert generan redes con mecanismos diferentes; aquí puedes explorar muestras pequeñas.',formula:'H(v) = [Σᵤ≠ᵥ 1/d(v,u)]/(n−1)',task:'Compara “Por grado” y “Por intermediación” en dos grupos unidos. Genera ER, WS y BA con parámetros parecidos.',bridge:'Estas bases preparan el estudio de hubs, small-world, comunidades, difusión y vulnerabilidad. Las muestras pequeñas no prueban leyes de escala.'}

function summaryPanel(){let m=metrics,n=m.n,center=m.ns.filter(u=>m.ecc[u]===m.radius),html=`<div class="stats"><div class="stat"><strong>${n}</strong><small>Nodos · orden</small></div><div class="stat"><strong>${m.m}</strong><small>Aristas · tamaño</small></div><div class="stat"><strong>${fmt(m.density)}</strong><small>Densidad del soporte¹</small></div></div><div class="kv"><span>Grado medio ${graph.directed?'total':''}</span><span>${fmt(n?2*m.m/n:0)}</span></div>${graph.directed?`<div class="kv"><span>Entrada / salida media</span><span>${fmt(n?m.m/n:0)}</span></div>`:''}<div class="kv"><span>Componentes ${graph.directed?'débiles':'conexas'}</span><span>${m.cs.length}</span></div>${graph.directed?`<div class="kv"><span>Componentes fuertes</span><span>${m.strong.length}</span></div>`:''}<div class="kv"><span>Fracción componente mayor</span><span>${fmt(n?m.cs[0].length/n:0)}</span></div><div class="kv"><span>Diámetro / radio (saltos)</span><span>${fmt(m.diameter)} / ${fmt(m.radius)}</span></div><div class="kv"><span>Distancia media de pares alcanzables</span><span>${m.average===null?'—':fmt(m.average)}</span></div><div class="kv"><span>Pares alcanzables (ordenados)</span><span>${(100*m.coverage).toFixed(1)} %</span></div><div class="kv"><span>Clustering medio²</span><span>${fmt(m.clusterMean)}</span></div><div class="kv"><span>Triángulos / transitividad²</span><span>${m.triangles} / ${fmt(m.trans)}</span></div><div class="callout"><b>${selected?'Nodo '+esc(selected):'Haz clic en un nodo'}</b>${selected?`<div class="kv"><span>Grado ${graph.directed?'total':''}</span><span>${m.deg[selected]}</span></div>${graph.directed?`<div class="kv"><span>Entrada / salida</span><span>${m.kin[selected]} / ${m.kout[selected]}</span></div>`:''}<div class="kv"><span>Vecinos distintos (sin dirección)</span><span>${esc([...m.neighbors[selected]].join(', ')||'ninguno')}</span></div><div class="kv"><span>Excentricidad de salida</span><span>${fmt(m.ecc[selected])}</span></div><div class="k function degreePlot(){let counts={};Object.values(metrics.deg).forEach(d=>counts[d]=(counts[d]||0)+1);let ks=Object.keys(counts).map(Number).sort((a,b)=>a-b),w=300,h=110,p=22,bw=Math.min(45,(w-2*p)/Math.max(1,ks.length)),max=Math.max(...Object.values(counts),1);return `<svg class="barplot" viewBox="0 0 300 135" role="img" aria-label="Distribución de grados"><line x1="20" y1="108" x2="290" y2="108" stroke="var(--line)"/>${ks.map((k,i)=>{let x=p+i*(w-2*p)/ks.length,bh=75*counts[k]/max;return `<rect x="${x}" y="${108-bh}" width="${bw-5}" height="${bh}" fill="var(--accent)" rx="3"><title>k=${k}: ${counts[k]} nodos; p(k)=${fmt(counts[k]/metrics.n)}</title></rect><text x="${x+(bw-5)/2}" y="${103-bh}" text-anchor="middle" font-size="10" fill="var(--muted)">${counts[k]}</text><text x="${x+(bw-5)/2}" y="123" text-anchor="middle" font-size="10" fill="var(--ink)">${k}</text>`}).join('')}<text x="280" y="134" font-size="9" fill="var(--muted)">grado k</text></svg>`}
function matrixPanel(){let ns=metrics.ns;return `<h2>Representaciones del mismo grafo</h2><div class="row"><select id="matrixMode"><option value="binary">Adyacencia binaria</option><option value="count">Número de aristas</option><option value="weight">Suma de pesos</option><option value="distance">Distancias en saltos</option><option value="incidence">Incidencia</option></select></div><p class="subtle" id="matrixDescription" style="margin-top:8px"></p><div class="tablewrap" id="matrixTable"></div><h3>Lista de adyacencia ${graph.directed?'de salida':''}</h3><div class="checklist">${Object.entries(adj()).map(([u,vs])=>`<span><b>${esc(u)}</b> → ${vs.map(v=>esc(v.to)+(graph.weighted?' ('+v.e.w+')':'')).join(', ')||'∅'}</span>`).join('')}</div><div class="tip">En matrices de adyacencia pasa el puntero por una celda para resaltar el enlace. En multigrafos, un número mayor que 1 puede indicar multiplicidad o suma de pesos; depende del modo.</div>`}
function renderMatrix(){let mode=$('#matrixMode').value,ns=metrics.ns,a=ns.map(()=>ns.map(()=>0)),index=Object.fromEntries(ns.map((n,i)=>[n,i]));graph.edges.forEach(e=>{let val=mode==='weight'?e.w:1;a[index[e.s]][index[e.t]]+=val;if(!graph.directed&&e.s!==e.t)a[index[e.t]][index[e.s]]+=val});if(mode==='binary')a=a.map(r=>r.map(v=>v?1:0));if(mode==='distance')a=metrics.dist;let desc=mode==='distance'?'Distancias geodésicas (número mínimo de aristas). ∞ significa inalcanzable. Diagonal 0.':'Fila = origen; columna = destino. Diagonal no nula = lazo. Los lazos se registran una vez en adyacencia.';if(mode==='incidence'){desc=graph.directed?'Incidencia orientada: −1 origen, +1 destino. Un lazo tiene columna cero.':'Incidencia no dirigida: 1 en cada extremo; un lazo registra 2 en su nodo.';$('#matrixTable').innerHTML=`<table><thead><tr><th>Nodo</th>${graph.edges.map(e=>`<th title="${esc(e.s)}–${esc(e.t)}">${esc(e.id)}</th>`).join('')}</tr></thead><tbody>${ns.map(u=>`<tr><th>${esc(u)}</th>${graph.edges.map(e=>{let v=graph.directed?(e.t===u?1:0)-(e.s===u?1:0):(e.s===u?1:0)+(e.t===u?1:0);return `<td class="${v?'adj':''}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}else{$('#matrixTable').innerHTML=`<table><thead><tr><th>↓ / →</th>${ns.map(u=>`<th>${esc(u)}</th>`).join('')}</tr></thead><tbody>${ns.map((u,i)=>`<tr><th>${esc(u)}</th>${ns.map((v,j)=>`<td class="${a[i][j]&&Number.isFinite(a[i][j])?'adj':''}" data-cell="${i},${j}">${fmt(a[i][j])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;if(mode!=='distance')$$('[data-cell]').forEach(td=>{td.onmouseenter=()=>{let [i,j]=td.dataset.cell.split(',').map(Number);lastMatrixHover=[ns[i],ns[j]];td.classList.add('focus');renderGraph()};td.onmouseleave=()=>{lastMatrixHover=null;td.classList.remove('focus');renderGraph()}})}$('#matrixDescription').textContent=desc}
function walkPanel(){return `<h2>Construye y clasifica un recorrido</h2><p class="subtle">Haz clic en un nodo inicial y continúa por nodos vecinos. La dirección importa. Puedes repetir nodos y aristas.</p><div class="row"><button class="small ${walkMode?'on':''}" id="walkStart">${walkMode?'Terminar construcción':'Construir recorrido'}</button><button class="small" id="walkUndo">← Deshacer</button><button class="small" id="walkClear">Limpiar</button></div><div class="walksequence" style="margin-top:10px">${walk.length?walk.map(esc).join(' → '):'Selecciona el inicio en el dibujo'}</div>${classifyWalk()}<div class="row"><label class="mini" for="routeText">O escribe los nodos, separados por comas:</label><input id="routeText" type="text" placeholder="A,B,C,D" style="width:100%"><button class="small" id="routeApply">Comprobar</button><button class="small" id="walkAnimate">Animar recorrido</button></div><details open><summary>Convenciones</summary><p style="margin-top:7px">Recorrido: sucesión válida de nodos y aristas. Sendero: aristas diferentes. Camino simple: nodos diferentes. Circuito: sendero cerrado no vacío. Ciclo simple: circuito con solo el inicio repetido al final.</p><p>En grafos simples no dirigidos los ciclos tienen al menos 3 aristas. Admitimos también ciclos dirigidos de 2 arcos, lazos y ciclos de 2 aristas paralelas.</p><p class="subtle">Al hacer clic en un nodo se usa la primera arista compatible. Para elegir una paralela específica, haz clic sobre su línea desde el nodo actual.</p></details><h3>Camino mínimo entre dos nodos</h3>${endpoints()}<div class="row"><button class="small" id="walkBfs">BFS · menos saltos</button><button class="small" id="walkDijkstra">Dijkstra · menor costo</button></div>`}
function classifyWalk(){if(!walk.length)return '<div class="result">Un recorrido de longitud cero contiene un solo nodo. Construye uno para comparar las categorías.</div>';let len=walkEdges.length,closed=walk.length>1&&walk[0]===walk[walk.length-1],trail=new Set(walkEdges).size===len,path=new Set(walk).size===walk.length,cycle=closed&&trail&&new Set(walk.slice(0,-1)).size===walk.length-1,cost=walkEdges.reduce((s,id)=>s+(graph.edges.find(e=>e.id===id)?.w||0),0),ham=path&&walk.length===metrics.n,hamcycle=cycle&&walk.length-1===metrics.n,euler=trail&&len===metrics.m&&len>0;let checks=[['Recorrido válido',true],['Sendero (sin repetir aristas)',trail],['Camino simple (sin repetir nodos)',path],['Cerrado',closed],['Circuito (sendero cerrado)',closed&&trail&&len>0],['Ciclo simple',cycle],['Usa todas las aristas una vez (Euler)',euler],['Visita todos los nodos una vez (Hamilton)',ham||hamcycle]];return `<div class="result"><b>Longitud: ${len} · Costo: ${fmt(cost)}</b><div class="checklist" style="margin-top:8px">${checks.map(([s,b])=>`<span class="${b?'good':''}">${b?'✓':'—'} ${s}</span>`).join('')}</div></div>`}
function endpoints(){return `<div class="row" style="margin:10px 0"><label class="mini" for="startNode">Origen</label><select id="startNode">${metrics.ns.map(u=>`<option ${u===algoStart?'selected':''} value="${esc(u)}">${esc(u)}</option>`).join('')}</select><label class="mini" for="endNode">Destino</label><select id="endNode">${metrics.ns.map(u=>`<option ${u===algoEnd?'selected':''} value="${esc(u)}">${esc(u)}</option>`).join('')}</select></div>`}
function algorithmsPanel(){return `<h2>Algoritmos paso a paso</h2><p class="subtle">Elige origen y destino. Usa Play, Anterior y Siguiente debajo del grafo; puedes volver a cualquier estado.</p>${endpoints()}<div class="algo"><button data-algo="bfs">BFS<small>Cola · distancia en saltos</small></button><button data-algo="dfs">DFS<small>Pila · exploración profunda</small></button><button data-algo="dijkstra">Dijkstra<small>Pesos no negativos</small></button><button data-algo="kruskal">Kruskal<small>Bosque generador mínimo</small></button><button data-algo="euler">Euler<small>Usar todas las aristas</small></button><button data-algo="hamilton">Hamilton<small>Camino o ciclo · n ≤ 12</small></button><button data-algo="topo">Orden topológico<small>Para grafos dirigidos acíclicos</small></button><button data-algo="color">Coloreo greedy<small>Sin garantía de mínimo</small></button></div><div id="algoInfo" class="callout">En BFS y Dijkstra se explora desde el origen y se reconstruye un camino al destino. DFS muestra todo lo alcanzable. Las aristas resaltadas forman el árbol de descubrimiento.</div><details><summary>Qué significa cada estado</summary><p>En BFS se extrae el primer nodo de la cola. En DFS se extrae el último de la pila. Dijkstra fija el nodo pendiente con menor distancia y luego relaja sus aristas.</p><p>Kruskal considera las aristas por costo y rechaza las que formarían un ciclo. Euler consume aristas y reconstruye el recorrido con Hierholzer. Hamilton se busca con backtracking y se anima un testigo final.</p><p>Las búsquedas muestran una solución, no todos los caminos posibles. Los empates se resuelven en el orden de los datos.</p></details>`}
function renderPanel(){if(!metrics)return;$('#panel').innerHTML=activeTab==='summary'?summaryPanel():activeTab==='matrix'?matrixPanel():activeTab==='walk'?walkPanel():activeTab==='algorithms'?algorithmsPanel():quizPanel();bindPanel()}
function bindPanel(){if(activeTab==='summary'){$('#componentsBtn').onclick=()=>colorComponents();if($('#strongBtn'))$('#strongBtn').onclick=()=>colorComponents(true);$('#bridgesBtn').onclick=()=>{let co={};metrics.arts.forEach(u=>co[u]=2);beginFrames([{edges:metrics.bridges,colors:co,name:'Vulnerabilidad',text:`${metrics.bridges.length} puentes; ${metrics.arts.length} articulaciones. Se analiza conectividad ${graph.directed?'débil':'no dirigida'}.`}]);$('#structResult').classList.remove('hidden');$('#structResult').textContent='Puentes: '+(metrics.bridges.map(id=>{let e=graph.edges.find(e=>e.id===id);return e.s+'–'+e.t}).join(', ')||'ninguno')+'. Articulaciones: '+(metrics.arts.join(', ')||'ninguna')};$('#inducedBtn').onclick=()=>{if(!selection.size)return toast('Selecciona nodos con Mayús + clic.');transformGraph({...clone(graph),name:'Subgrafo inducido',nodes:graph.nodes.filter(n=>selection.has(n.id)),edges:graph.edges.filter(e=>selection.has(e.s)&&selection.has(e.t))})};$('#complementBtn').onclick=()=>{if(graph.directed||metrics.loops||metrics.parallel)return toast('El complemento de este laboratorio requiere un grafo simple no dirigido.');let ns=metrics.ns,es=[];for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++)if(!metrics.neighbors[ns[i]].has(ns[j]))es.push({id:'e'+es.length,s:ns[i],t:ns[j],w:1});transformGraph({...clone(graph),name:'Complemento · '+graph.name,edges:es,weighted:false})};$('#projectBtn').onclick=projectGraph}else if(activeTab==='matrix'){$('#matrixMode').onchange=renderMatrix;renderMatrix()}else if(activeTab==='walk'){$('#walkStart').onclick=()=>{pause();frames=[];step=0;walkMode=!walkMode;renderGraph();renderPanel()};$('#walkUndo').onclick=()=>{walk.pop();walkEdges.pop();renderGraph();renderPanel()};$('#walkClear').onclick=()=>{walk=[];walkEdges=[];frames=[];step=0;renderGraph();renderPanel()};$('#routeApply').onclick=()=>{let seq=$('#routeText').value.split(/[\s,;→]+/).filter(Boolean),es=[];if(!seq.length||seq.some(u=>!metrics.ns.includes(u)))return toast('Escribe etiquetas de nodos existentes, separadas por comas.');for(let i=1;i<seq.length;i++){let e=findEdge(seq[i-1],seq[i]);if(!e)return toast('No hay arista válida de '+seq[i-1]+' a '+seq[i]+'.');es.push(e.id)}frames=[];step=0;walk=seq;walkEdges=es;renderGraph();renderPanel()};$('#walkAnimate').onclick=()=>{if(!walk.length)return toast('Primero construye un recorrido.');let ws=[...walk],we=[...walkEdges];beginFrames(ws.map((u,i)=>({visited:ws.slice(0,i+1),current:u,edges:we.slice(0,i),text:`Paso ${i}: ${ws.slice(0,i+1).join(' → ')} · longitud ${i}`,trace:'Aristas: '+we.slice(0,i).join(', ')})),true)};$('#walkBfs').onclick=()=>runAlgo('bfs');$('#walkDijkstra').onclick=()=>runAlgo('dijkstra')}else if(activeTab==='algorithms'){$$('[data-algo]').forEach(b=>b.onclick=()=>runAlgo(b.dataset.algo))}else bindQuiz();if($('#startNode'))$('#startNode').onchange=e=>algoStart=e.target.value;if($('#endNode'))$('#endNode').onchange=e=>algoEnd=e.target.value}
function transformGraph(g){if(!customReset)customReset=clone(graph);pause();graph=clone(g);resetState();recalc();toast('Transformación aplicada. ↺ Restaurar recupera el ejemplo de partida.')}
function projectGraph(){if(!metrics.bip)return toast('No es bipartito; no se puede proyectar U.');let us=metrics.ns.filter(u=>metrics.bp[u]===0);if(!us.length)return;let es=[];for(let i=0;i<us.length;i++)for(let j=i+1;j<us.length;j++){let common=[...metrics.neighbors[us[i]]].filter(u=>metrics.neighbors[us[j]].has(u));if(common.length)es.push({id:'e'+es.length,s:us[i],t:us[j],w:common.length})}transformGraph({name:'Proyección sobre U · peso = vecinos compartidos',nodes:graph.nodes.filter(n=>us.includes(n.id)),edges:es,directed:false,weighted:true});$('#layout').value='circle';applyLayout('circle')}
function findEdge(u,v){return graph.edges.find(e=>e.s===u&&e.t===v||!graph.directed&&e.t===u&&e.s===v)}
function addWalkNode(id,edge=null){if(!walk.length){walk.push(id)}else{let u=walk[walk.length-1],e=edge||findEdge(u,id);if(!e)return toast('No existe una arista '+u+' → '+id+' respetando la dirección.');walk.push(id);walkEdges.push(e.id)}selected=id;renderGraph();renderPanel()}
function searchFrames(type){if(type==='dfs')return dfsFrames();let start=algoStart,end=algoEnd,a=adj(),fs=[],seen=new Set([start]),visited=[],front=[start],parents={},pes={},dist=Object.fromEntries(metrics.ns.map(u=>[u,Infinity]));dist[start]=0;fs.push({name:type.toUpperCase(),current:start,visited:[],dist:cloneDist(dist),text:`Inicio en ${start}. Distancia inicial 0.`,trace:(type==='bfs'?'Cola':'Pila')+': ['+front.join(', ')+']'});while(front.length){let u=type==='bfs'?front.shift():front.pop();visited.push(u);let vs=type==='dfs'?[...a[u]].reverse():a[u];for(let {to:v,e} of vs)if(!seen.has(v)){seen.add(v);parents[v]=u;pes[v]=e.id;dist[v]=dist[u]+1;front.push(v)}fs.push({name:type.toUpperCase(),current:u,visited:[...visited],edges:Object.values(pes),dist:cloneDist(dist),text:`${type==='bfs'?'Extraer de la cola':'Extraer de la pila'} ${u}; descubrir vecinos no visitados.`,trace:(type==='bfs'?'Cola':'Pila')+': ['+front.join(', ')+'] · procesados: '+visited.join(', ')})}let route=reconstruct(start,end,parents,pes);if(type==='bfs')fs.push(route?{name:'Camino mínimo · BFS',visited:route.nodes,edges:route.edges,text:`Camino mínimo: ${route.nodes.join(' → ')} · ${route.edges.length} saltos · costo ${fmt(route.edges.reduce((s,id)=>s+graph.edges.find(e=>e.id===id).w,0))}.`,trace:'BFS minimiza saltos, no la suma de pesos.'}:{text:`No existe camino dirigido válido de ${start} a ${end}.`,visited,edges:Object.values(pes)});else fs.push({name:'Árbol DFS',visited,edges:Object.values(pes),text:`DFS finaliza: ${visited.length} nodos alcanzados. Orden: ${visited.join(' → ')}.`,trace:'El orden de visita no es necesariamente un camino del grafo. Las aristas mostradas son de descubrimiento.'});return fs}

function dfsFrames(){let a=adj(),s=algoStart,seen=new Set([s]),processed=[s],stack=[{u:s,next:0}],tree=[],fs=[{name:'DFS',current:s,visited:[s],text:`Descubre ${s}; apílalo y profundiza por el primer vecino no visitado.`,trace:'Pila: '+s}];while(stack.length){let top=stack[stack.length-1],neighbors=a[top.u];if(top.next>=neighbors.length){stack.pop();fs.push({name:'DFS · retroceder',current:top.u,visited:[...processed],edges:[...tree],text:`${top.u} no tiene vecinos sin visitar. Desapila y retrocede.`,trace:'Pila: '+stack.map(x=>x.u).join(' → ')});continue}let link=neighbors[top.next++];if(seen.has(link.to))continue;seen.add(link.to);processed.push(link.to);tree.push(link.e.id);stack.push({u:link.to,next:0});fs.push({name:'DFS · profundizar',current:link.to,visited:[...processed],edges:[...tree],edge:link.e.id,text:`Desde ${top.u}, descubre ${link.to}; lo apila antes de explorar otros vecinos de ${top.u}.`,trace:'Pila: '+stack.map(x=>x.u).join(' → ')})}fs.push({name:'Árbol DFS',visited:processed,edges:tree,text:`DFS finaliza: ${processed.length} nodos alcanzados. Orden de descubrimiento: ${processed.join(' → ')}.`,trace:'El orden de visita no es necesariamente un camino; las aristas son del árbol de descubrimiento.'});return fs}

function cloneDist(d){return {...d}} // Preserve Infinity in live algorithm snapshots.
function reconstruct(s,t,p,pe){if(s===t)return {nodes:[s],edges:[]};if(p[t]===undefined)return null;let nodes=[t],edges=[],u=t,safety=0;while(u!==s&&safety++<=metrics.n){edges.unshift(pe[u]);u=p[u];nodes.unshift(u)}return u===s?{nodes,edges}:null}
function dijkstraFrames(){if(graph.edges.some(e=>e.w<0))return [{text:'Dijkstra requiere pesos no negativos.'}];let s=algoStart,t=algoEnd,a=adj(),d=Object.fromEntries(metrics.ns.map(u=>[u,Infinity])),done=new Set(),p={},pe={},fs=[];d[s]=0;fs.push({name:'Dijkstra',dist:cloneDist(d),current:s,text:`Inicializa d(${s})=0; las otras distancias son ∞.`,trace:'Peso interpretado como costo.'});while(done.size<metrics.n){let u=null;for(let v of metrics.ns)if(!done.has(v)&&(u===null||d[v]<d[u]))u=v;if(u===null||!Number.isFinite(d[u]))break;done.add(u);fs.push({name:'Dijkstra',current:u,visited:[...done],edges:Object.values(pe),dist:cloneDist(d),text:`Fija ${u}: es el pendiente con menor costo (${fmt(d[u])}).`,trace:'Fijados: '+[...done].join(', ')});for(let {to:v,e} of a[u])if(!done.has(v)){let alt=d[u]+e.w,old=d[v];if(alt<d[v]){d[v]=alt;p[v]=u;pe[v]=e.id;fs.push({name:'Relajación',current:u,edge:e.id,visited:[...done],edges:Object.values(pe),dist:cloneDist(d),text:`Relaja ${u} → ${v}: ${fmt(d[u])} + ${e.w} = ${fmt(alt)} < ${fmt(old)}. Actualiza d(${v}).`,trace:'Predecesor de '+v+': '+u})}}}let r=reconstruct(s,t,p,pe);fs.push(r?{name:'Camino de costo mínimo',visited:r.nodes,edges:r.edges,dist:cloneDist(d),text:`${r.nodes.join(' → ')} · costo mínimo ${fmt(d[t])} · ${r.edges.length} saltos.`,trace:'Los pesos representan costos no negativos. Los empates pueden tener otras soluciones.'}:{dist:cloneDist(d),text:`${t} es inalcanzable desde ${s}.`});return fs}
function kruskalFrames(){if(graph.directed)return [{text:'Kruskal en esta app requiere un grafo no dirigido.'}];let parent=Object.fromEntries(metrics.ns.map(u=>[u,u])),find=u=>{while(parent[u]!==u)u=parent[u];return u},chosen=[],cost=0,fs=[{name:'Kruskal',text:'Ordena aristas por peso. Inicialmente cada nodo es una componente.'}];for(let e of [...graph.edges].sort((a,b)=>a.w-b.w)){let u=find(e.s),v=find(e.t),accept=u!==v;if(accept){parent[v]=u;chosen.push(e.id);cost+=e.w}fs.push({name:'Kruskal',edge:e.id,edges:[...chosen],visited:[],text:`${accept?'Acepta':'Rechaza'} ${e.s}–${e.t} (peso ${e.w}): ${accept?'conecta componentes distintas':'crearía un ciclo'}. Costo acumulado ${fmt(cost)}.`,trace:'Aristas elegidas: '+chosen.join(', ')})}fs.push({name:'Bosque generador mínimo',edges:chosen,text:`Resultado: ${chosen.length} aristas; ${metrics.cs.length} componentes; costo mínimo ${fmt(cost)}.`,trace:metrics.cs.length===1?'Es un árbol generador mínimo.':'Es un bosque; el grafo original es desconectado.'});return fs}
function eulerFrames(){let ns=metrics.ns,degree=metrics.deg,active=ns.filter(u=>degree[u]>0);if(!graph.edges.length)return [{text:'No hay aristas que recorrer. Un nodo aislado admite el recorrido trivial de longitud 0.'}];let cs=components().filter(c=>c.some(u=>degree[u]>0));if(cs.length!==1)return [{text:'No existe recorrido euleriano: las aristas están en componentes distintas.'}];let start=active.includes(algoStart)?algoStart:active[0];if(graph.directed){let plus=ns.filter(u=>metrics.kout[u]-metrics.kin[u]===1),minus=ns.filter(u=>metrics.kin[u]-metrics.kout[u]===1),bad=ns.some(u=>Math.abs(metrics.kout[u]-metrics.kin[u])>1);if(bad||!((plus.length===0&&minus.length===0)||(plus.length===1&&minus.length===1)))return [{text:'No existe Euler: los balances de entrada y salida no cumplen las condiciones.'}];if(plus.length)start=plus[0]}else{let odd=ns.filter(u=>degree[u]%2);if(odd.length!==0&&odd.length!==2)return [{text:`No existe Euler: hay ${odd.length} nodos de grado impar (${odd.join(', ')}). Debe haber 0 o 2.`}];if(odd.length)start=odd.includes(start)?start:odd[0]}let a=adj(),used=new Set(),stack=[{node:start,via:null}],out=[],fs=[{name:'Hierholzer',current:start,text:`Comienza en ${start}. Consume cada arista una sola vez.`,trace:'Pila: '+start}];while(stack.length){let u=stack[stack.length-1].node,link=a[u].find(v=>!used.has(v.e.id));if(link){used.add(link.e.id);stack.push({node:link.to,via:link.e.id});fs.push({name:'Euler · consumir',current:link.to,edges:[...used],edge:link.e.id,text:`Consume ${link.e.id}: ${u} → ${link.to}.`,trace:'Pila: '+stack.map(x=>x.node).join(' → ')})}else{out.push(stack.pop());fs.push({name:'Euler · reconstruir',current:u,edges:[...used],text:`${u} no tiene aristas libres. Lo agrega al resultado en orden inverso.`,trace:'Resultado inverso: '+out.map(x=>x.node).join(' → ')})}}out.reverse();if(used.size!==graph.edges.length)return [{text:'No existe un recorrido que use todas las aristas con esa dirección.'}];let ws=out.map(x=>x.node),we=o function hamiltonFrames(){if(metrics.n>12)return [{text:'Hamilton usa búsqueda exhaustiva y está limitado a 12 nodos. Usa un ejemplo pequeño.'}];let a=adj(),budget=0,limit=1000000,cycle=null,path=null;function search(u,seen,ws,we,needCycle){if(++budget>limit)return false;if(ws.length===metrics.n){let closing=graph.edges.find(e=>!we.includes(e.id)&&(e.s===u&&e.t===ws[0]||!graph.directed&&e.t===u&&e.s===ws[0]));if(needCycle){if(closing){cycle={nodes:[...ws,ws[0]],edges:[...we,closing.id]};return true}return false}path={nodes:ws,edges:we};return true}for(let v of a[u])if(!seen.has(v.to)){let s=new Set(seen);s.add(v.to);if(search(v.to,s,[...ws,v.to],[...we,v.e.id],needCycle))return true}return false}for(let s of metrics.ns){if(search(s,new Set([s]),[s],[],true))break;if(budget>limit)break}if(!cycle){for(let s of metrics.ns){if(search(s,new Set([s]),[s],[],false))break;if(budget>limit)break}}let r=cycle||path;if(!r)return [{text:budget>limit?'La búsqueda alcanzó el límite de trabajo. Resultado indeterminado; no se concluye que Hamilton no exista.':'No existe camino ni ciclo hamiltoniano (búsqueda exhaustiva terminada).'}];let fs=[{name:'Hamilton · testigo',text:`Se encontró ${cycle?'un ciclo':'un camino'} hamiltoniano. ${cycle?'':'No se encontró ciclo'+(budget>limit?' antes del límite':' en la búsqueda completa')+'.'} Estados explorados: ${budget}.`}];r.nodes.forEach((u,i)=>fs.push({name:'Hamilton',current:u,visited:r.nodes.slice(0,i+1),edges:r.edges.slice(0,i),text:`${r.nodes.slice(0,i+1).join(' → ')} · visita ${new Set(r.nodes.slice(0,i+1)).size}/${metrics.n} nodos distintos.`,trace:cycle?'Se repite el inicio solo para cerrar el ciclo.':'Cada nodo se visita una sola vez.'}));return fs}
function topoFrames(){if(!graph.directed)return [{text:'El orden topológico requiere un grafo dirigido.'}];let a=adj(),ins={...metrics.kin},q=metrics.ns.filter(u=>ins[u]===0),order=[],fs=[{name:'Orden topológico',text:'Elige nodos sin arcos de entrada pendientes.',trace:'Disponibles: '+q.join(', ')}];while(q.length){let u=q.shift();order.push(u);for(let v of a[u])if(--ins[v.to]===0)q.push(v.to);fs.push({name:'Kahn',current:u,visited:[...order],text:`Agrega ${u} al orden y elimina sus arcos salientes del conteo.`,trace:'Orden: '+order.join(' → ')+' · disponibles: '+q.join(', ')})}fs.push({name:'Resultado topológico',visited:order,text:order.length===metrics.n?'Orden válido: '+order.join(' → ')+'. Puede haber otros órdenes válidos.':'Hay un ciclo dirigido: no existe un orden topológico completo.'});return fs}
function colorFrames(){if(metrics.loops)return [{text:'Un grafo con lazos no admite coloreo propio de vértices: el nodo sería adyacente a sí mismo.'}];let order=[...metrics.ns].sort((a,b)=>metrics.neighbors[b].size-metrics.neighbors[a].size),co={},fs=[{text:'Coloreo greedy: procesa por grado descendente en la proyección no dirigida.'}];for(let u of order){let forbidden=new Set([...metrics.neighbors[u]].map(v=>co[v]).filter(x=>x!==undefined)),c=0;while(forbidden.has(c))c++;co[u]=c;fs.push({name:'Coloreo greedy',current:u,colors:{...co},text:`Nodo ${u}: sus vecinos usan {${[...forbidden].map(x=>x+1).join(', ')}}. Asigna color ${c+1}.`,trace:'Orden: '+order.join(', ')})}fs.push({name:'Coloreo propio',colors:co,text:`Se usaron ${Math.max(...Object.values(co))+1} colores. Es un coloreo válido; no se afirma que sea mínimo.`});return fs}

{l:10,q:'En un grafo simple no dirigido, A–B–C–B es…',o:['Recorrido, pero no sendero ni camino simple','Camino simple','Ciclo simple'],a:0,why:'Repite la arista B–C y el nodo B. Es una sucesión válida, pero incumple las otras categorías.'},
{l:10,q:'A–B–C–A, con esas tres aristas distintas, es…',o:['Ciclo simple y circuito','Camino simple sin nodos repetidos','Recorrido abierto'],a:0,why:'Solo repite el inicio al final y no repite aristas; es ciclo simple. Aquí camino simple exige nodos distintos.'},
{l:11,q:'BFS encuentra caminos mínimos respecto de…',o:['Número de aristas','Suma de pesos arbitrarios','Mayor grado de los nodos'],a:0,why:'BFS explora por capas. Cada capa representa un salto adicional; ignora los costos.'},
{l:11,q:'Dos nodos sin camino entre ellos tienen distancia…',o:['Infinita','Cero','Igual al número de nodos'],a:0,why:'No hay camino finito. Cero corresponde a la distancia de un nodo consigo mismo.'},
{l:12,q:'Un digrafo débilmente conectado…',o:['Puede no ser fuertemente conectado','Siempre permite ir y volver entre cualquier par','No puede tener ciclos'],a:0,why:'A→B es débilmente conectado, pero no hay camino de B hacia A.'},
{l:13,q:'Si una arista pertenece a un ciclo no dirigido, ¿puede ser puente?',o:['No, queda otra ruta entre sus extremos','Sí, todas las aristas de un ciclo son puentes','Depende del layout'],a:0,why:'El resto del ciclo proporciona un camino alternativo, por lo que eliminar esa arista no desconecta.'},
{l:14,q:'En P₅ (cadena de 5 nodos), diámetro y radio son…',o:['4 y 2','5 y 1','2 y 4'],a:0,why:'Los extremos están a 4 saltos. Desde el nodo central la máxima distancia es 2.'},
{l:15,q:'Para un circuito euleriano no dirigido no vacío se exige…',o:['Todos los grados pares y aristas en una componente','Todos los nodos de grado 2','Visitar cada nodo una sola vez'],a:0,why:'Pueden existir grados 4, 6, etc. Los aislados no impiden un circuito que use todas las aristas.'},
{l:15,q:'Euler y Hamilton buscan respectivamente…',o:['Usar todas las aristas y visitar todos los nodos','Visitar todos los nodos y usar todas las aristas','El mismo recorrido mínimo'],a:0,why:'Euler impone la condición sobre aristas; Hamilton, sobre nodos.'},
{l:16,q:'¿Qué estructura administra la frontera en BFS?',o:['Cola FIFO','Pila LIFO','Siempre un árbol binario'],a:0,why:'BFS procesa primero lo descubierto antes; DFS profundiza con una pila o recursión.'},
{l:16,q:'Kruskal rechaza una arista cuando…',o:['Sus extremos ya están en la misma componente del bosque','Tiene peso positivo','Es la de menor peso'],a:0,why:'Agregarla en ese caso crearía un ciclo. Se aceptan conexiones entre componentes distintas.'},
{l:17,q:'Un dibujo con aristas cruzadas prueba que el grafo…',o:['Nada sobre su no planaridad: puede redibujarse','Es no planar','Es bipartito'],a:0,why:'Planaridad pregunta si existe algún dibujo sin cruces, no si el dibujo actual los tiene.'},
{l:17,q:'Un coloreo greedy con 4 colores demuestra que…',o:['Existe un coloreo con 4 colores, pero quizá haya uno con menos','El número cromático es exactamente 4','El grafo es completo'],a:0,why:'Greedy proporciona una cota superior; no calcula necesariamente el mínimo.'},
{l:18,q:'Un nodo tiene 3 vecinos y solo un enlace entre esos vecinos. Su clustering es…',o:['1/3','1','2/3'],a:0,why:'Entre tres vecinos hay 3 pares posibles. Uno está conectado: C=1/3.'},
{l:18,q:'¿Una red de baja densidad puede tener alto clustering?',o:['Sí, por ejemplo grupos densos con pocos enlaces entre ellos','No, son siempre la misma medida','Solo si todos los nodos están aislados'],a:0,why:'La densidad usa todos los pares de la red. Clustering examina pares dentro de cada vecindario.'},
{l:19,q:'Un nodo con grado moderado puede tener alta intermediación porque…',o:['Conecta grupos y canaliza muchos caminos mínimos','Su etiqueta aparece primero','El grado determina siempre su intermediación'],a:0,why:'La intermediación depende de la posición respecto de rutas geodésicas, no solo de vecinos directos.'},
{l:19,q:'Las conexiones preferenciales hacia nodos de alto grado son propias de…',o:['Barabási–Albert','ER con probabilidad fija','Un grafo vacío'],a:0,why:'BA crece incorporando nodos que eligen vecinos proporcionalmente a su grado; los otros modelos usan mecanismos distintos.'}
];

data-edit]').forEach(b=>{b.classList.toggle('on',b.dataset.edit===editMode);b.onclick=()=>{editMode=b.dataset.edit;walkMode=false;edgeStart=null;closeModal();renderGraph();toast(editMode==='inspect'?'Modo inspección':editMode==='add'?'Clic en el fondo: agregar nodo':editMode==='edge'?'Clic en dos nodos: agregar arista':'Clic en nodo o arista: eliminar')}});$('#undoEdit').onclick=()=>{if(!editHistory.length)return toast('No hay ediciones que deshacer.');pause();graph=editHistory.pop();resetState();recalc();editorModal()};$('#clearGraph').onclick=()=>{snapshot();graph={name:'Mi grafo vacío',nodes:[],edges:[],directed:false,weighted:false};resetState();recalc();closeModal();editMode='add';renderGraph();toast('Grafo vacío. Haz clic en el fondo para agregar nodos. Puedes deshacer en el editor.')};$('#isDirected').onchange=e=>{snapshot();graph.directed=e.target.checked;recalc()};$('#isWeighted').onchange=e=>{snapshot();graph.weighted=e.target.checked;recalc()};$('#edgeSelect').onchange=()=>$('#edgeWeight').value=graph.edges.find(e=>e.id===$('#edgeSelect').value)?.w??1;$('#applyWeight').onclick=()=>{let e=graph.edges.find(e=>e.id===$('#edgeSelect').value),w=Number($('#edgeWeight').value);if(!e)return toast('No hay arista seleccionada.');if(!Number.isFinite(w)||w<0||w>100000)return toast('Usa un peso entre 0 y 100000.');snapshot();e.w=w;graph.weighted=true;recalc();editorModal();toast('Peso actualizado.')};$('#renameApply').onclick=()=>{let id=$('#renameValue').value.trim();if(!selected)return toast('Selecciona un nodo primero.');if(!/^[A-Za-z0-9_-]{1,6}$/.test(id)||graph.nodes.some(n=>n.id===id&&n.id!==selected))return toast('Etiqueta inválida o repetida.');snapshot();let old=selected;graph.nodes.find(n=>n.id===old).id=id;graph.edges.forEach(e=>{if(e.s===old)e.s=id;if(e.t===old)e.t=id});if(algoStart===old)algoStart=id;if(algoEnd===old)algoEnd=id;selection.delete(old);selected=id;recalc();editorModal()}}
function applyLayout(mode){pause();let n=graph.nodes.length;if(!n)return;if(mode==='original'){let original=customReset||examples[currentExample];graph.nodes.forEach((u,i)=>{let src=original?.nodes.find(v=>v.id===u.id);if(src){u.x=src.x;u.y=src.y}else{u.x=400+200*Math.cos(2*Math.PI*i/n);u.y=250+195*Math.sin(2*Math.PI*i/n)}})}else if(mode==='circle'){graph.nodes.forEach((u,i)=>{u.x=400+210*Math.cos(2*Math.PI*i/n-Math.PI/2);u.y=255+200*Math.sin(2*Math.PI*i/n-Math.PI/2)})}else if(mode==='random'){graph.nodes.forEach(u=>{u.x=70+Math.random()*660;u.y=60+Math.random()*400})}else{let index=Object.fromEntries(graph.nodes.map((u,i)=>[u.id,i])),pos=graph.nodes;for(let round=0;round<180;round++){let forces=pos.map(()=>({x:0,y:0}));for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let dx=pos[i].x-pos[j].x,dy=pos[i].y-pos[j].y,ds=dx*dx+dy*dy;if(ds<.1){dx=.5;dy=.3;ds=.34}let d=Math.sqrt(ds),f=3500/(ds+40);forces[i].x+=dx/d*f;forces[i].y+=dy/d*f;forces[j].x-=dx/d*f;forces[j].y-=dy/d*f}for(let e of graph.edges){let i=index[e.s],j=index[e.t];if(i===j)continue;let dx=pos[j].x-pos[i].x,dy=pos[j].y-pos[i].y,d=Math.hypot(dx,dy)||1,f=(d-95)*.009;forces[i].x+=dx/d*f;forces[i].y+=dy/d*f;forces[j].x-=dx/d*f;forces[j].y-=dy/d*f}pos.forEach((p,i)=>{let fx=forces[i].x+(400-p.x)*.002,fy=forces[i].y+(260-p.y)*.002;p.x=Math.max(45,Math.min(755,p.x+Math.max(-12,Math.min(12,fx))));p.y=Math.max(45,Math.min(465,p.y+Math.max(-12,Math.min(12,fy))))})}}view={x:0,y:0,w:800,h:520};renderGraph()}
function zoom(factor,cx=400,cy=260){let w=Math.max(150,Math.min(2400,view.w*factor)),h=w*520/800;view.x=cx-(cx-view.x)*(w/view.w);view.y=cy-(cy-view.y)*(h/view.h);view.w=w;view.h=h;$('#graph').setAttribute('viewBox',`${view.x} ${view.y} ${w} ${h}`)}

function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function modelModal(){modal('Explora modelos de redes',`<p>Compara tres mecanismos de generación con muestras pequeñas. Cada red se genera con una semilla para que puedas reproducirla.</p><label for="modelType">Modelo</label><select id="modelType"><option value="er">Erdős–Rényi G(n,p)</option><option value="ws">Watts–Strogatz</option><option value="ba">Barabási–Albert</option></select><div class="modelrow"><label for="modelN">Nodos n</label><input id="modelN" type="range" min="8" max="80" value="30"><output id="modelNVal">30</output></div><div class="modelrow" id="pRow"><label for="modelP">Probabilidad p</label><input id="modelP" type="range" min="0" max="1" step="0.01" value="0.12"><output id="modelPVal">0.12</output></div><div class="modelrow hidden" id="kRow"><label for="modelK">Vecinos k (par)</label><input id="modelK" type="range" min="2" max="6" step="2" value="4"><output id="modelKVal">4</output></div><div class="modelrow hidden" id="betaRow"><label for="modelBeta">Reconexion β</label><input id="modelBeta" type="range" min="0" max="1" step="0.01" value="0.15"><output id="modelBetaVal">0.15</output></div><div class="modelrow hidden" id="mRow"><label for="modelM">Enlaces nuevos m</label><input id="modelM" type="range" min="1" max="3" step="1" value="2"><output id="modelMVal">2</output></div><label for="modelSeed">Semilla entera</label><input id="modelSeed" type="number" value="42" min="0" max="2147483647"><button id="randomSeed" class="small">Otra semilla</button><div class="callout" id="modelExplanation"></div><button id="generateModel" class="primary">Generar red</button><p class="subtle" style="margin-top:10px">Para mantener la lectura y animación, el laboratorio admite 80 nodos y 300 aristas. Si ER produce más de 300 aristas, se solicita reducir parámetros; no se recortan silenciosamente.</p>`);let update=()=>{let type=$('#modelType').value;['p','k','beta','m'].forEach(v=>$('#'+v+'Row').classList.toggle('hidden',type==='er'?v!=='p':type==='ws'?!['k','beta'].includes(v):v!=='m'));$('#modelExplanation').textContent=type==='er'?'ER: cada par distinto se conecta de manera independiente con probabilidad p. No se garantiza conectividad.':type==='ws'?'WS: comienza con un anillo k-regular y reconecta cada arista con probabilidad β, sin lazos ni duplicados. Mantiene la cantidad de aristas.':'BA: inicia con K(m+1). Cada nuevo nodo elige m vecinos distintos mediante conexión preferencial proporcional a su grado.';['N','P','K','Beta','M'].forEach(v=>$('#model'+v+'Val').value=$('#model'+v).value)};$('#modelType').onchange=update;['N','P','K','Beta','M'].forEach(v=>$('#model'+v).oninput=update);$('#randomSeed').onclick=()=>$('#modelSeed').value=Math.floor(Math.random()*2147483647);$('#generateModel').onclick=()=>{let n=+$('#modelN').value,p=+$('#modelP').value,k=+$('#modelK').value,beta=+$('#modelBeta').value,m=+$('#modelM').value,seed=+$('#modelSeed').value,type=$('#modelType').value;if(!Number.isInteger(seed)||seed<0||seed>2147483647)return toast('Usa una semilla entera entre 0 y 2147483647.');let random=rng(seed),es=[];if(type==='er'){for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(random()<p)es.push([i,j])}else if(type==='ws'){let set=new Set();for(let i=0;i<n;i++)for(let d=1;d<=k/2;d++){let j=(i+d)%n;es.push([i,j]);set.add(pairKey(i,j))}for(let e of es){let [u,v]=e;if(random()<beta){let candidates=Array.from({length:n},(_,i)=>i).filter(t=>t!==u&&!set.has(pairKey(u,t)));if(candidates.length){set.delete(pairKey(u,v));let t=candidates[Math.floor(random()*candidates.length)];e[1]=t;set.add(pairKey(u,t))}}}}else{es=completeEdges(m+1);let degree=Array(n).fill(0);es.forEach(([u,v])=>{degree[u]++;degree[v]++});for(let u=m+1;u<n;u++){let chosen=new Set();while(chosen.size<m){let sum=0;for(let v=0;v<u;v++)if(!chosen.has(v))sum+=degree[v];let r=random()*sum,v=0;for(;v<u;v++)if(!chosen.has(v)){r-=degree[v];if(r<0)break}chosen.add(Math.min(v,u-1))}chosen.forEach(v=>{es.push([u,v]);degree[u]++;degree[v]++})}}if(es.length>300)return toast('Esta muestra tiene '+es.length+' aristas. Reduce n o p (máximo 300).');let model=makeGraph(`${type.toUpperCase()} · n=${n} · semilla ${seed}`,n,[]);model.nodes.forEach((u,i)=>u.id=i<26?String.fromCharCode(65+i):'N'+(i+1));model.edges=es.map(([u,v],i)=>({id:'e'+i,s:model.nodes[u].id,t:model.nodes[v].id,w:1}));graph=model;customReset=clone(model);editHistory=[];resetState();recalc();$('#colorMode').value='degree';applyLayout(type==='ws'?'circle':'force');activeTab='summary';renderTabs();closeModal()};update()}
function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function validateGraph(raw){if(!raw||!Array.isArray(raw.nodes)||!Array.isArray(raw.edges)||raw.nodes.length>80||raw.edges.length>300)throw Error('Formato inválido o supera 80 nodos / 300 aristas.');let seen=new Set(),ns=raw.nodes.map((n,i)=>{let id=String(n.id);if(!/^[A-Za-z0-9_-]{1,6}$/.test(id)||seen.has(id))throw Error('Etiquetas de nodos inválidas o repetidas.');seen.add(id);return {id,x:Number.isFinite(n.x)?Math.max(-1000,Math.min(1800,n.x)):400+200*Math.cos(2*Math.PI*i/raw.nodes.length),y:Number.isFinite(n.y)?Math.max(-800,Math.min(1400,n.y)):255+180*Math.sin(2*Math.PI*i/raw.nodes.length),group:0}}),es=raw.edges.map((e,i)=>{let s=String(e.s),t=String(e.t),w=e.w===undefined?1:Number(e.w);if(!seen.has(s)||!seen.has(t)||!Number.isFinite(w)||w<0||w>100000)throw Error('Arista con extremos inexistentes o peso inválido.');return {id:'e'+i,s,t,w}});return {name:String(raw.name||'Grafo importado').slice(0,90),nodes:ns,edges:es,directed:raw.directed===true,weighted:raw.weighted===true}}
function exportSVG(){let svg=$('#graph').cloneNode(true),css=getComputedStyle(document.body),vars=['panel','ink','muted','accent','orange','edge','node','red'];svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('width','1200');svg.setAttribute('height','780');let style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=`svg{background:${css.getPropertyValue('--panel')}}.edge{fill:none;stroke:${css.getPropertyValue('--edge')};stroke-width:2.4}.edge.hit{stroke:${css.getPropertyValue('--orange')};stroke-width:5}.edge.blue{stroke:${css.getPropertyValue('--accent')};stroke-width:4}.n circle{stroke:${css.getPropertyValue('--panel')};stroke-width:3}.n.selected circle{stroke:${css.getPropertyValue('--orange')};stroke-width:5}.n text{fill:white;text-anchor:middle;font-size:14px;font-family:Arial;font-weight:600}.n .nvalue,.weight{fill:${css.getPropertyValue('--ink')};stroke:${css.getPropertyValue('--panel')};stroke-width:4;paint-order:stroke;font-family:Arial;text-anchor:middle;font-size:11px}`;svg.prepend(style);let xml=new XMLSerializer().serializeToString(svg);vars.forEach(v=>xml=xml.replaceAll(`var(--${v})`,css.getPropertyValue('--'+v).trim()));download('Mi_Grafo.svg',xml,'image/svg+xml')}
function filesModal(){modal('Guardar, cargar y compartir',`<div class="cols"><div><h3>Exportar</h3><p class="subtle">JSON guarda nodos, aristas, dirección, pesos y posiciones. SVG guarda el dibujo actual como imagen vectorial.</p><div class="row"><button id="saveJson">Descargar JSON</button><button id="saveSvg">Descargar SVG</button><button id="saveCsv">Aristas CSV</button></div><h3>Sesión de práctica</h3><button id="saveSession">Guardar sesión JSON</button><p class="subtle">Incluye grafo, lección activa y progreso de ejercicios. No incluye los estados intermedios de una animación.</p></div><div><h3>Cargar JSON</h3><input type="file" id="importFile" accept=".json,application/json"><p class="subtle">Admite los grafos y sesiones exportados por esta app.</p><label for="jsonText">O pega un grafo JSON:</label><textarea id="jsonText" placeholder='{"nodes":[{"id":"A"},{"id":"B"}],"edges":[{"s":"A","t":"B","w":1}],"directed":false}'></textarea><button id="importText">Cargar texto</button></div></div>`);$('#saveJson').onclick=()=>download('Mi_Grafo.json',JSON.stringify(graph,null,2),'application/json');$('#saveSvg').onclick=exportSVG;$('#saveCsv').onclick=()=>download('Aristas_Grafo.csv','origen,destino,peso\n'+graph.edges.map(e=>e.s+','+e.t+','+e.w).join('\n'),'text/csv;charset=utf-8');$('#saveSession').onclick=()=>download('Sesion_Teoria_Grafos.json',JSON.stringify({format:'grafos-session-v1',lesson:currentLesson,graph,progress},null,2),'application/json');let load=text=>{try{let raw=JSON.parse(text),g=validateGraph(raw.graph||raw);if(raw.format==='grafos-session-v1'){if(Number.isInteger(raw.lesson)&&raw.lesson>=0&&raw.lesson<lessons.length)openLesson(raw.lesson);if(raw.progress&&Array.isArray(raw.progress.done)&&raw.progress.answers){progress={done:raw.progress.done.filter(i=>Number.isInteger(i)&&i>=0&&i<lessons.length),answers:{}};Object.entries(raw.progress.answers).forEach(([key,v])=>{if(Number.isInteger(+key)&&+key>=0&&+key<questions.length&&v&&typeof v.correct==='boolean')progress.answers[key]={correct:v.correct}});saveProgress()}}graph=g;customReset=clone(g);editHistory=[];resetState();recalc();closeModal();toast('Grafo cargado.')}catch(e){toast('No se pudo cargar: '+e.message)}};$('#importText').onclick=()=>load($('#jsonText').value);$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>1000000)return toast('El JSON debe pesar menos de 1 MB.');load(await f.text())}}
const glossary=[['Adyacencia','Dos nodos están unidos por una arista; en un digrafo se especifica la dirección.'],['Articulación','Nodo cuya eliminación aumenta el número de componentes conexas.'],['Árbol','Grafo no dirigido conectado y sin ciclos.'],['Bipartito','Los nodos pueden dividirse en dos conjuntos sin aristas internas a cada conjunto.'],['Camino simple','Recorrido sin nodos repetidos.'],['Ciclo simple','Recorrido cerrado sin repetir aristas y sin repetir nodos salvo el inicio al final.'],['Clique','Conjunto de nodos unidos entre sí por todos los pares posibles.'],['Clustering','Fracción de pares de vecinos de un nodo que están conectados.'],['Componente','Grupo máximo de nodos conectados. En digrafos: débil o fuerte.'],['Comunidad','Grupo con conexiones internas relativamente densas; su definición depende del método de análisis.'],['DAG','Grafo dirigido sin ciclos dirigidos.'],['Densidad','Fracción de enlaces posibles presentes; hay que declarar la convención para dirección y multiplicidad.'],['Diámetro','Máxima distancia entre pares de nodos.'],['Distancia','Longitud o costo del camino mínimo, según la métrica declarada.'],['Euleriano','Recorrido que usa cada arista exactamente una vez.'],['Excentricidad','Máxima distancia desde un nodo hacia los demás.'],['Grado','Número de aristas incidentes; un lazo no dirigido aporta dos.'],['Hamiltoniano','Camino que visita cada nodo exactamente una vez; un ciclo vuelve al inicio.'],['Incidencia','Relación entre una arista y sus extremos.'],['Isomorfismo','Correspondencia de nodos que preserva la estructura de adyacencia.'],['Lazo','Arista que une un nodo consigo mismo.'],['Multigrafo','Grafo que puede tener aristas paralelas; la admisión de lazos depende de la convención.'],['Puente','Arista cuya eliminación aumenta el número de componentes.'],['Radio','Mínima excentricidad de los nodos.'],['Recorrido','Sucesión válida de nodos y aristas; puede repetir ambos.'],['Sendero','Recorrido que no repite aristas.'],['Subgrafo inducido','Conserva todos los enlaces originales entre un conjunto seleccionado de nodos.'],['Transitividad','Tres veces el número de triángulos dividido por las ternas centradas de vecinos.'],['Vecindario','Conjunto de vecinos distintos de un nodo.'],['Peso','Valor asociado a una arista cuyo significado depende del modelo.']];
function glossModal(){modal('Glosario de fundamentos',`<input id="glossSearch" type="text" placeholder="Buscar concepto…" style="width:100%;margin-bottom:12px"><div class="glossary" id="glossContent"></div>`);let render=()=>{let term=$('#glossSearch').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');$('#glossContent').innerHTML=glossary.filter(([t,d])=>(t+' '+d).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(term)).map(([t,d])=>`<div><b>${t}</b>${d}</div>`).join('')};$('#glossSearch').oninput=render;render()}
function guideModal(){modal('Una ruta para aprender haciendo',`<p><b>20 lecciones, 24 ejemplos y 32 preguntas</b> para preparar un curso de Network Science. Puedes seguir el orden del menú o usar el laboratorio libremente.</p><ol><li><b>Lee y predice.</b> Cada lección tiene una idea, una fórmula y un reto.</li><li><b>Explora.</b> Selecciona un nodo, compara medidas y cambia el ejemplo.</li><li><b>Construye.</b> En Editor agrega nodos y enlaces, cambia dirección o modifica pesos.</li><li><b>Observa los procesos.</b> En Algoritmos sigue una cola, pila, relajación o selección de aristas.</li><li><b>Practica.</b> En Ejercicios responde y lee la explicación; marca cada lección comprendida cuando puedas explicarla.</li></ol><h3>Controles del grafo</h3><p>Arrastra un nodo para moverlo. Arrastra el fondo para desplazar la vista. La rueda hace zoom centrado en el puntero. ⌂ centra la vista. Mayús + clic selecciona varios nodos para un subgrafo inducido. ⛶ amplía la zona del laboratorio.</p><h3>Para una clase</h3><p>Primera sesión: lecciones 1–5 (lenguaje y representaciones). Segunda: 6–10 (estructura). Tercera: 11–15 (caminos y conectividad). Cuarta: 16–20 (algoritmos y puente a redes). Pide una predicción antes de cada edición y una explicación después.</p><h3>Alcance</h3><p>Los ejemplos son sintéticos; no representan datos empíricos. La app no verifica planaridad general, no prueba isomorfismo y no calcula el número cromático mínimo. Hamilton está limitado a 12 nodos y un presupuesto de búsqueda; cuando se agota informa “indeterminado”.</p><p>Todo funciona dentro de este archivo sin conexión. Lecturas externas son opcionales. Usa Guardar / cargar para transferir grafos y progreso entre equipos.</p>`)}
function sourcesModal(){modal('Lecturas y convenciones',`<p>Las explicaciones y ejercicios fueron redactados para este laboratorio. Estas lecturas amplían los conceptos:</p><ul><li><a href="https://networksciencebook.com/chapter/2" target="_blank" rel="noopener">Albert-László Barabási · Network Science, capítulo 2: Graph Theory</a></li><li><a href="https://www.cs.cornell.edu/home/kleinber/networks-book/networks-book-ch02.pdf" target="_blank" rel="noopener">David Easley y Jon Kleinberg · Networks, Crowds, and Markets, capítulo 2: Graphs</a></li><li><a href="https://www.cs.cornell.edu/home/kleinber/networks-book/" target="_blank" rel="noopener">Easley y Kleinberg · Libro y capítulos</a></li></ul><h3>Una precaución terminológica</h3><p>Los términos camino, recorrido y sendero no se usan igual en todos los textos. En esta app: recorrido = walk, sendero = trail, camino simple = path sin nodos repetidos. Circuito = sendero cerrado no vacío.</p><h3>Distancias y pesos</h3><p>El panel Explorar calcula distancias en saltos sobre el soporte que conserva la dirección. Dijkstra usa los pesos como costos no negativos. No mezcles fuerza del vínculo con costo sin definir su significado.</p><h3>Proyecciones y medidas</h3><p>Clustering y triángulos se calculan sobre la proyección simple no dirigida. Densidad ignora lazos y multiplicidad, pero conserva la dirección. Intermediación usa caminos mínimos en saltos del soporte simple. Se informa ∞ para distancias globales con pares inalcanzables; el promedio identifica los pares alcanzables.</p><h3>Planaridad</h3><p>Para grafos planares simples no dirigidos con n≥3, m≤3n−6 es necesaria, no suficiente. K₅ y K₃,₃ son ejemplos no planares. Los cruces visibles de un layout no son un test de planaridad.</p>`)}
