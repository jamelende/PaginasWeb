<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador: siete ejemplos tabla + red</title>
  <style>
    :root {
      --ink: #172026;
      --muted: #5d6972;
      --line: #d9dee2;
      --panel: #ffffff;
      --soft: #f4f7f8;
      --teal: #147d83;
      --amber: #d78a1f;
      --coral: #c84e47;
      --green: #3f8c51;
      --violet: #6f58a8;
      --blue: #2f6fb0;
      --shadow: 0 18px 45px rgba(20, 31, 38, .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7faf9 0%, #eef3f5 100%);
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
    }
    .main-drawer {
      border-right: 1px solid var(--line);
      background: #fbfcfc;
      padding: 18px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand { padding: 8px 8px 18px; }
    .brand h1 { margin: 0; font-size: 21px; line-height: 1.12; }
    .brand p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .menu { display: grid; gap: 8px; }
    .menu button {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--ink);
    }
    .menu button:hover { background: #eef4f3; }
    .menu button.active { background: #e5f1ef; border-color: #b8d5d1; }
    .menu .num { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: 8px; border-radius: 50%; background: var(--teal); color: white; font-size: 12px; }
    main { padding: 24px; min-width: 0; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    .title h2 { margin: 0; font-size: clamp(25px, 4vw, 42px); line-height: 1.03; letter-spacing: 0; }
    .title p { max-width: 850px; margin: 10px 0 0; color: var(--muted); line-height: 1.45; }
    .pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill { border: 1px solid var(--line); background: white; border-radius: 999px; padding: 6px 10px; font-size: 12px; color: #334149; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; min-width: 260px; }
    .iconbtn, .primary {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 9px 11px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
    }
    .primary { background: var(--teal); border-color: var(--teal); color: white; }
    .grid { display: grid; gap: 14px; }
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 26px rgba(24, 38, 48, .07);
      padding: 14px;
      min-width: 0;
    }
    .metric-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .metric-value { font-size: 28px; font-weight: 760; line-height: 1; }
    .metric-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .content { display: grid; grid-template-columns: minmax(360px, 1.1fr) minmax(340px, .9fr); gap: 14px; margin-top: 14px; align-items: start; }
    .section-title { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
    .section-title h3 { margin: 0; font-size: 16px; }
    canvas#network { width: 100%; height: 440px; display: block; background: #f9fbfb; border: 1px solid var(--line); border-radius: 8px; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .legend span { font-size: 12px; color: #3d4a52; display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .tabs button { border: 1px solid var(--line); background: white; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
    .tabs button.active { background: #1f2c33; color: white; border-color: #1f2c33; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 438px; background: white; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border-bottom: 1px solid #edf0f2; padding: 7px 8px; white-space: nowrap; text-align: left; }
    th { position: sticky; top: 0; background: #f6f8f8; z-index: 1; color: #38464e; }
    .bars { display: grid; gap: 10px; }
    .barrow { display: grid; grid-template-columns: 145px 1fr 56px; align-items: center; gap: 9px; font-size: 13px; }
    .bartrack { height: 13px; background: #edf0f2; border-radius: 999px; overflow: hidden; }
    .barfill { height: 100%; background: var(--teal); border-radius: 999px; }
    .barfill.red { background: var(--amber); }
    .mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .smallstat { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfcfc; }
    .smallstat b { display: block; font-size: 18px; margin-top: 4px; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .modal { border: 0; padding: 0; width: min(1120px, calc(100vw - 28px)); max-height: calc(100vh - 28px); border-radius: 8px; box-shadow: var(--shadow); }
    .modal::backdrop { background: rgba(18, 29, 35, .52); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: white; }
    .modal-head h3 { margin: 0; font-size: 18px; }
    .modal-body { padding: 16px; overflow: auto; max-height: calc(100vh - 92px); background: #f7f9f9; }
    .modal-close { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: white; cursor: pointer; font-size: 20px; line-height: 1; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .controls input, .controls select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: white; }
    .chart { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    svg { width: 100%; height: auto; display: block; }
    .confusion { display: grid; gap: 7px; justify-content: start; }
    .confusion .cell { min-width: 78px; height: 54px; display: grid; place-items: center; border-radius: 8px; color: white; font-weight: 760; }
    .confusion .labelcell { min-width: 78px; height: 30px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .footer-note { margin-top: 14px; color: var(--muted); font-size: 12px; }
    @media (max-width: 940px) {
      .app { grid-template-columns: 1fr; }
      .main-drawer { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { padding: 16px; }
      .topbar { flex-direction: column; }
      .actions { justify-content: flex-start; }
      .cards, .content { grid-template-columns: 1fr; }
      canvas#network { height: 360px; }
    }
    @media (max-width: 560px) {
      .menu { grid-template-columns: 1fr; }
      .mini-grid { grid-template-columns: 1fr; }
      .barrow { grid-template-columns: 1fr; }
    }
    .graph-stage {
      height: calc(100vh - 166px);
      min-height: 610px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 12px 34px rgba(24, 38, 48, .08);
      min-width: 0;
    }
    .graph-tools {
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 8px;
      position: relative;
      z-index: 2;
      background: white;
      padding-bottom: 4px;
      border-bottom: 1px solid #edf0f2;
    }
    .graph-controls-row {
      display: grid;
      grid-template-columns: minmax(170px, 210px) minmax(160px, 1fr) minmax(180px, 1fr);
      gap: 10px;
      align-items: end;
      min-width: 0;
    }
    .layout-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .control-group {
      display: grid;
      gap: 5px;
      min-width: 0;
    }
    .control-group label { color: var(--muted); font-size: 12px; }
    .range-line {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) 42px;
      gap: 8px;
      align-items: center;
    }
    .layout-controls select, .layout-controls input[type="range"], .control-group select, .control-group input[type="range"] {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: white;
      color: var(--ink);
      width: 100%;
      min-width: 0;
    }
    .layout-controls input[type="range"], .control-group input[type="range"] {
      width: 100%;
      padding: 0;
      accent-color: var(--teal);
    }
    .relation-inline {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.32;
      max-width: none;
    }
    .workbench {
      display: grid;
      grid-template-columns: minmax(220px, 260px) minmax(480px, 1fr) minmax(230px, 280px);
      gap: 12px;
      align-items: stretch;
    }
    .side-panel {
      height: calc(100vh - 166px);
      min-height: 610px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 8px 22px rgba(24, 38, 48, .06);
      min-width: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 8px;
    }
    .side-panel h3 { margin: 0; font-size: 14px; }
    .side-table-grid {
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      min-height: 0;
    }
    .mini-table-block { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; }
    .mini-table-block h4 { margin: 0; font-size: 12px; color: #334149; }
    .mini-table-block .table-wrap { max-height: none; min-height: 0; }
    .mini-table-block table { font-size: 10.5px; }
    .mini-table-block th, .mini-table-block td { padding: 5px 6px; }
    tr[data-node-id] { cursor: pointer; }
    tr[data-node-id]:hover td { background: #eef4f3; }
    tr.selected-row td { background: #dff0ed; font-weight: 650; }
    .matrix-stack { display: grid; gap: 8px; min-height: 0; overflow: auto; }
    .matrix-stack .chart { padding: 8px; }
    .matrix-stack h4 { margin: 0 0 6px; font-size: 12px; }
    .mini-confusion { display: grid; gap: 4px; justify-content: start; }
    .mini-confusion .cell { min-width: 36px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: white; font-size: 11px; font-weight: 760; }
    .mini-confusion .labelcell { min-width: 36px; height: 22px; display: grid; place-items: center; color: var(--muted); font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; }
    .mini-confusion .cell.clickable { cursor: pointer; outline: 0 solid transparent; }
    .mini-confusion .cell.clickable:hover { outline: 2px solid #172026; }
    .filter-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .filter-strip button { padding: 5px 7px; font-size: 11px; }
    canvas#network {
      width: 100%;
      height: 100%;
      min-height: 430px;
      display: block;
      background: #fbfdfd;
      border: 1px solid #cfd8dc;
      border-radius: 8px;
    }
    .modal {
      width: min(760px, calc(100vw - 22px));
      max-height: 100vh;
      height: 100vh;
      margin: 0 0 0 auto;
      border-radius: 8px 0 0 8px;
      transform: translateX(0);
      animation: slidePanel .18s ease-out;
    }
    .modal.wide { width: min(1180px, calc(100vw - 22px)); }
    .modal-body { max-height: calc(100vh - 65px); }
    @keyframes slidePanel {
      from { transform: translateX(28px); opacity: .65; }
      to { transform: translateX(0); opacity: 1; }
    }
    @media (max-width: 940px) {
      .graph-stage { height: 72vh; min-height: 500px; }
      .modal { width: 100vw; border-radius: 0; }
    }
    .app { display: block; }
    .main-drawer {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(340px, calc(100vw - 38px));
      height: 100vh;
      z-index: 30;
      transform: translateX(-104%);
      transition: transform .2s ease;
      box-shadow: 18px 0 42px rgba(23, 32, 38, .18);
    }
    body.drawer-open .main-drawer { transform: translateX(0); }
    main {
      width: min(1680px, 100%);
      margin: 0 auto;
      padding: 20px;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: rgba(18, 29, 35, .42);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    body.drawer-open .drawer-backdrop {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-color: #b8d5d1;
      background: #e5f1ef;
    }
    .drawer-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .graph-stage {
      height: calc(100vh - 150px);
      min-height: 640px;
    }
    @media (max-width: 940px) {
      main { padding: 14px; }
      .workbench { grid-template-columns: 1fr; }
      .graph-controls-row { grid-template-columns: 1fr; }
      .side-panel, .graph-stage { height: auto; min-height: 0; }
      .side-panel { max-height: 360px; }
      .graph-stage { height: 74vh; min-height: 520px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="main-drawer">
      <button class="drawer-close" id="closeDrawer" aria-label="Cerrar ejemplos">×</button>
      <div class="brand">
        <h1>Tabla + red</h1>
        <p>Visualizador autónomo de siete ejemplos sobre predicción relacional.</p>
      </div>
      <nav class="menu" id="menu" aria-label="Ejemplos"></nav>
    </aside>
    <main>
      <div class="topbar">
        <div class="title">
          <h2 id="title"></h2>
          <p id="objective"></p>
          <div class="pillrow" id="pills"></div>
        </div>
        <div class="actions">
          <button class="iconbtn drawer-toggle" id="openDrawer">Ejemplos</button>
          <button class="iconbtn" data-modal="guide">Lectura</button>
          <button class="iconbtn" data-modal="roc">ROC</button>
          <button class="primary" data-modal="metrics">Métricas</button>
        </div>
      </div>

      <section class="workbench">
        <aside class="side-panel" aria-label="Tablas de datos">
          <div class="section-title">
            <h3>Datos</h3>
          </div>
          <div class="filter-strip"><span class="note" id="matrixFilterLabel">Todas las filas</span><button class="iconbtn" id="clearMatrixFilter">Limpiar</button></div>
          <div class="side-table-grid">
            <div class="mini-table-block">
              <h4>Tabla normal</h4>
              <div class="table-wrap" id="plainMiniTable"></div>
            </div>
            <div class="mini-table-block">
              <h4>Tabla enriquecida</h4>
              <div class="table-wrap" id="enrichedMiniTable"></div>
            </div>
          </div>
        </aside>

        <div class="graph-stage">
          <div class="graph-tools">
            <div class="relation-inline" id="relationLine"></div>
            <div class="graph-controls-row">
              <div class="control-group">
                <label for="layoutSelect" class="note">Visualización</label>
                <select id="layoutSelect" aria-label="Visualización de red">
                  <option value="random">Aleatoria</option>
                  <option value="orange">Coordenadas Orange</option>
                  <option value="circular">Circular</option>
                  <option value="spring">Spring</option>
                  <option value="kamada">Kamada-Kawai</option>
                </select>
              </div>
              <div class="control-group">
                <label for="homophilySlider" class="note">Homofilia</label>
                <div class="range-line">
                  <input id="homophilySlider" type="range" min="0" max="100" value="65" aria-label="Homofilia">
                  <span class="note" id="homophilyValue">65%</span>
                </div>
              </div>
              <div class="control-group">
                <label for="edgeThicknessSlider" class="note">Visibilidad enlaces</label>
                <div class="range-line">
                  <input id="edgeThicknessSlider" type="range" min="25" max="260" value="100" aria-label="Visibilidad enlaces">
                  <span class="note" id="edgeThicknessValue">100%</span>
                </div>
              </div>
            </div>
          </div>
          <canvas id="network" width="1440" height="900" aria-label="Red relacional"></canvas>
          <div class="legend" id="legend"></div>
        </div>

        <aside class="side-panel" aria-label="Matrices de confusión">
          <div class="section-title">
            <h3>Matrices</h3>
            <select id="modelSelect" aria-label="Modelo"></select>
          </div>
          <div class="matrix-stack" id="matrixPanel"></div>
        </aside>
      </section>
    </main>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <dialog class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="closeModal" aria-label="Cerrar">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </dialog>

    function selectExample(i) {
      current = i;
      selectedModel = DATA[i].bestModel.Modelo;
      tableMode = "plain";
      graphLayout = "random";
      resetGraphView();
      closeDrawer();

    function openDrawer() {

      document.body.classList.remove("drawer-open");
    }

    function render() {
      const ex = example();
      renderMenu();
      $("title").textContent = ex.meta.title;
      $("objective").textContent = ex.meta.objective;
      $("relationLine").textContent = ex.meta.relation;
      $("pills").innerHTML = [
        `${ex.plain.length} registros`,
        `${ex.edges.length} relaciones`,
        `${ex.labels.length} clases`,
        `${ex.networkCols.length} atributos de red`

    function renderCards() {
      if (!$("metricCards")) return;
      const ex = example();
      const best = ex.bestModel;
      const avgTab = ex.results.reduce((a, r) => a + r.Accuracy_tabla, 0) / ex.results.length;
      const avgNet = ex.results.reduce((a, r) => a + r.Accuracy_tabla_mas_red, 0) / ex.results.length;

      if (q) data = rows.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes(q)));
      const cols = Object.keys(rows[0] || {});
      return `<table><thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead><tbody>` +
        data.slice(0, limit).map(row => {
          const id = row.ID || "";
          const attrs = interactive && id ? ` data-node-id="${escapeHtml(id)}" onclick="selectNodeFromTable('${escapeHtml(id)}')" class="${graphView.selected === id ? "selected-row" : ""}"` : "";
          return `<tr${attrs}>${cols.map(c => `<td>${escapeHtml(fmt(row[c]))}</td>`).join("")}</tr>`;
        }).join("") +
        `</tbody></table><div class="note" style="padding:8px 10px">${data.length} filas encontradas; mostrando ${Math.min(limit, data.length)}.</div>`;
    }

    function selectNodeFromTable(id) {
      graphView.selected = id;
      graphView.hover = id;
      renderPermanentTables();
      drawNetwork("network", example());
    }

    function labelColor(ex, label) { return colors[ex.labels.indexOf(label) % colors.length]; }

    function resetGraphView() {
      graphView.zoom = 1;
      graphView.panX = 0;
      graphView.panY = 0;
      graphView.hover = null;
      graphView.selected = null;
      graphView.filterIds = null;
      graphView.filterLabel = "";
    }

    function seedValue(text) {
      let h = 2166136261;
      for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      h ^= h >>> 16;
      h = Math.imul(h, 2246822507);
      h ^= h >>> 13;
      h = Math.imul(h, 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967295;
    }

    function neighborsFor(ex) {
      const map = new Map(ex.enriched.map(n => [n.ID, new Set()]));
      visibleEdges(ex).forEach(e => {
        if (map.has(e.source) && map.has(e.target)) {
          map.get(e.source).add(e.target);
          map.get(e.target).add(e.source);
        }
      });
      return map;
    }

    function visibleEdges(ex) {
      const nodeClass = new Map(ex.enriched.map(n => [n.ID, n.Clase]));
      const level = homophilyLevel / 100;
      const count = Math.round(ex.edges.length * level);
      return [...ex.edges]
        .map(e => {
          const same = nodeClass.get(e.source) === nodeClass.get(e.target) ? 1 : 0;
          const base = seedValue(ex.id + e.source + e.target + "edge");
          const priority = same ? base * (1 - .72 * level) : base + .38 * level;
          return { ...e, priority, same };
        })
        .sort((a, b) => a.priority - b.priority)
        .slice(0, count);
    }

    function normalizePositions(raw) {
      const xs = raw.map(p => p.x), ys = raw.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const sx = (maxX - minX) || 1;
      const sy = (maxY - minY) || 1;
      return new Map(raw.map(p => [p.id, { x: .06 + ((p.x - minX) / sx) * .88, y: .06 + ((p.y - minY) / sy) * .88 }]));
    }

    function layoutPositions(ex, type) {
      const key = `${ex.id}:${type}:${type === "spring" || type === "kamada" ? homophilyLevel : "fixed"}`;
      if (layoutCache.has(key)) return layoutCache.get(key);
      const nodes = ex.enriched;
      const ids = nodes.map(n => n.ID);
      const index = new Map(ids.map((id, i) => [id, i]));
      let raw = [];

      if (type === "orange") {
        raw = nodes.map(n => ({ id: n.ID, x: +n.Net_Embedding_X, y: +n.Net_Embedding_Y }));
      } else if (type === "circular") {
        const ordered = [...nodes].sort((a, b) => (+a.Net_Community - +b.Net_Community) || String(a.ID).localeCompare(String(b.ID)));
        raw = ordered.map((n, i) => {
          const a = (i / ordered.length) * Math.PI * 2 - Math.PI / 2;
          return { id: n.ID, x: Math.cos(a), y: Math.sin(a) };
        });
      } else if (type === "random") {
        raw = nodes.map(n => ({ id: n.ID, x: seedValue(sessionSalt + ex.id + n.ID + "x"), y: seedValue(sessionSalt + ex.id + n.ID + "y") }));
      } else if (type === "spring") {
        const pos = nodes.map(n => ({ id: n.ID, x: seedValue(ex.id + n.ID + "sx") - .5, y: seedValue(ex.id + n.ID + "sy") - .5 }));
        const k = Math.sqrt(1 / nodes.length);
        for (let iter = 0; iter < 130; iter++) {
          const disp = nodes.map(() => ({ x: 0, y: 0 }));
          for (let i = 0; i < pos.length; i++) {
            for (let j = i + 1; j < pos.length; j++) {
              let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
              let d = Math.max(.002, Math.hypot(dx, dy));
              let f = (k * k) / d;
              disp[i].x += dx / d * f; disp[i].y += dy / d * f;
              disp[j].x -= dx / d * f; disp[j].y -= dy / d * f;
            }
          }
          visibleEdges(ex).forEach(e => {
            const a = index.get(e.source), b = index.get(e.target);
            if (a == null || b == null) return;
            let dx = pos[a].x - pos[b].x, dy = pos[a].y - pos[b].y;
            let d = Math.max(.002, Math.hypot(dx, dy));
            let f = (d * d) / k;
            disp[a].x -= dx / d * f; disp[a].y -= dy / d * f;
            disp[b].x += dx / d * f; disp[b].y += dy / d * f;
          });
          const temp = .08 * (1 - iter / 130);
          pos.forEach((p, i) => {
            const d = Math.max(.002, Math.hypot(disp[i].x, disp[i].y));
            p.x += disp[i].x / d * Math.min(d, temp);
            p.y += disp[i].y / d * Math.min(d, temp);
          });
        }
        raw = pos;
      } else {
        const n = nodes.length;
        const neighbors = ids.map(() => []);
        visibleEdges(ex).forEach(e => {
          const a = index.get(e.source), b = index.get(e.target);
          if (a == null || b == null) return;
          neighbors[a].push(b); neighbors[b].push(a);
        });
        const dist = Array.from({length:n}, () => Array(n).fill(Infinity));
        for (let s = 0; s < n; s++) {
          const q = [s]; dist[s][s] = 0;
          for (let qi = 0; qi < q.length; qi++) {
            const v = q[qi];
            neighbors[v].forEach(to => {
              if (dist[s][to] === Infinity) { dist[s][to] = dist[s][v] + 1; q.push(to); }
            });
          }
        }
        const pos = nodes.map(node => {
          const c = +node.Net_Community || 0;
          const a = seedValue(ex.id + node.ID + "ka") * Math.PI * 2;
          const groupAngle = (c / Math.max(1, new Set(nodes.map(x => x.Net_Community)).size)) * Math.PI * 2;
          return { id: node.ID, x: Math.cos(groupAngle) * 1.2 + Math.cos(a) * .28, y: Math.sin(groupAngle) * 1.2 + Math.sin(a) * .28 };
        });
        for (let iter = 0; iter < 85; iter++) {
          const disp = nodes.map(() => ({ x: 0, y: 0 }));
          for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
              let dij = dist[i][j];
              if (dij === Infinity) dij = 4.5;
              const target = .22 + dij * .34;
              let dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
              const d = Math.max(.004, Math.hypot(dx, dy));
              const weight = 1 / (dij * dij);
              const force = (d - target) * weight * .045;
              disp[i].x += dx / d * force; disp[i].y += dy / d * force;
              disp[j].x -= dx / d * force; disp[j].y -= dy / d * force;
            }
          }
          pos.forEach((p, i) => { p.x += disp[i].x; p.y += disp[i].y; });
        }
        raw = pos;
      }
      const normalized = normalizePositions(raw);
      layoutCache.set(key, normalized);
      return normalized;
    }

    function drawNetwork(canvasId, ex) {
      const canvas = $(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      const cssW = Math.max(720, Math.round(rect.width || canvas.width));
      const cssH = Math.max(460, Math.round(rect.height || canvas.height));
      canvas.width = Math.round(cssW * scale);
      canvas.height = Math.round(cssH * scale);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      const w = cssW, h = cssH;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = "#f9fbfb";
      ctx.fillRect(0,0,w,h);
      const nodes = ex.enriched;
      const layout = layoutPositions(ex, graphLayout);
      const neighborMap = neighborsFor(ex);
      const filterIds = graphView.filterIds;
      const activeId = graphView.hover || graphView.selected;
      const active = activeId ? new Set([activeId, ...(neighborMap.get(activeId) || [])]) : null;
      const margin = 44;
      const pos = new Map();
      nodes.forEach(n => {
        const p = layout.get(n.ID);
        const baseX = margin + p.x * (w - margin * 2);
        const baseY = margin + p.y * (h - margin * 2);
        const x = w / 2 + (baseX - w / 2) * graphView.zoom + graphView.panX;
        const y = h / 2 + (baseY - h / 2) * graphView.zoom + graphView.panY;
        pos.set(n.ID, [x, y]);
      });
      ctx.lineCap = "round";
      visibleEdges(ex).forEach(e => {
        const a = pos.get(e.source), b = pos.get(e.target);
        if (!a || !b) return;
        const inFilter = !filterIds || (filterIds.has(e.source) && filterIds.has(e.target));
        const lit = active && active.has(e.source) && active.has(e.target);
        const edgeScale = edgeThickness / 100;
        ctx.lineWidth = (lit ? 2.2 : 0.75) * edgeScale;
        ctx.strokeStyle = lit ? "rgba(23, 32, 38, .62)" : (!inFilter ? "rgba(48, 63, 71, .025)" : (active ? "rgba(48, 63, 71, .055)" : "rgba(48, 63, 71, .20)"));
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      });
      nodes.forEach(n => {
        const p = pos.get(n.ID);
        const inFilter = !filterIds || filterIds.has(n.ID);
        const isActive = inFilter && (!active || active.has(n.ID));
        const isHover = graphView.hover === n.ID;
        const isSelected = graphView.selected === n.ID;
        const radius = (4.2 + Math.min(7, (+n.Net_Degree || 0) / 4.5)) * Math.min(1.45, Math.sqrt(graphView.zoom));
        ctx.globalAlpha = isActive ? 1 : (inFilter ? .35 : .08);
        ctx.beginPath();
        ctx.arc(p[0], p[1], radius + (isHover || isSelected ? 5 : 0), 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? "rgba(215,138,31,.28)" : (isHover ? "rgba(23,32,38,.15)" : labelColor(ex, n.Clase));
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p[0], p[1], radius, 0, Math.PI * 2);
        ctx.fillStyle = labelColor(ex, n.Clase);
        ctx.fill();
        ctx.strokeStyle = isSelected ? "#d78a1f" : (isHover ? "#172026" : "rgba(255,255,255,.88)");
        ctx.lineWidth = isSelected || isHover ? 2.4 : 1.4;
        ctx.stroke();
        ctx.globalAlpha = 1;
      });
      if (activeId && pos.has(activeId)) {
        const n = nodes.find(x => x.ID === activeId);
        const p = pos.get(activeId);
        const text = `${n.ID} · ${n.Clase} · grado ${n.Net_Degree}`;
        ctx.font = "12px Inter, system-ui, sans-serif";
        const tw = ctx.measureText(text).width + 18;
        const x = Math.min(w - tw - 10, p[0] + 14);
        const y = Math.max(28, p[1] - 16);
        ctx.fillStyle = "rgba(255,255,255,.96)";
        ctx.strokeStyle = "rgba(23,32,38,.18)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(x, y - 22, tw, 28, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#172026";
        ctx.fillText(text, x + 9, y - 4);
      }
      if ($("legend")) $("legend").innerHTML = ex.labels.map(l => `<span><i class="dot" style="background:${labelColor(ex,l)}"></i>${escapeHtml(l)} (${ex.classCounts[l]})</span>`).join("");
    }

    function screenPositions(canvas, ex) {
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(720, Math.round(rect.width || canvas.width));
      const h = Math.max(460, Math.round(rect.height || canvas.height));
      const margin = 44;
      const layout = layoutPositions(ex, graphLayout);
      return ex.enriched.map(n => {
        const p = layout.get(n.ID);
        const baseX = margin + p.x * (w - margin * 2);
        const baseY = margin + p.y * (h - margin * 2);
        return {
          node: n,
          x: w / 2 + (baseX - w / 2) * graphView.zoom + graphView.panX,
          y: h / 2 + (baseY - h / 2) * graphView.zoom + graphView.panY,
          r: (4.2 + Math.min(7, (+n.Net_Degree || 0) / 4.5)) * Math.min(1.45, Math.sqrt(graphView.zoom))
        };
      });
    }

    function canvasPoint(canvas, event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function nodeAt(canvas, event) {
      const p = canvasPoint(canvas, event);
      let best = null;
      let bestD = Infinity;
      screenPositions(canvas, example()).forEach(item => {
        const d = Math.hypot(item.x - p.x, item.y - p.y);
        if (d <= Math.max(10, item.r + 4) && d < bestD) {
          best = item.node.ID;
          bestD = d;
        }
      });
      return best;
    }

    function setupGraphInteractions() {
      const canvas = $("network");
      canvas.addEventListener("wheel", event => {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const p = canvasPoint(canvas, event);
        const oldZoom = graphView.zoom;
        const nextZoom = Math.max(.35, Math.min(5.5, oldZoom * (event.deltaY < 0 ? 1.12 : .89)));
        const cx = rect.width / 2, cy = rect.height / 2;
        graphView.panX = p.x - cx - ((p.x - cx - graphView.panX) / oldZoom) * nextZoom;
        graphView.panY = p.y - cy - ((p.y - cy - graphView.panY) / oldZoom) * nextZoom;
        graphView.zoom = nextZoom;
        drawNetwork("network", example());
      }, { passive: false });
      canvas.addEventListener("mousemove", event => {
        if (graphView.dragging) {
          graphView.panX += event.clientX - graphView.dragX;
          graphView.panY += event.clientY - graphView.dragY;
          graphView.dragX = event.clientX;
          graphView.dragY = event.clientY;
          drawNetwork("network", example());
          return;
        }
        const hit = nodeAt(canvas, event);
        if (hit !== graphView.hover) {
          graphView.hover = hit;
          canvas.style.cursor = hit ? "pointer" : "grab";
          drawNetwork("network", example());
        }
      });
      canvas.addEventListener("mouseleave", () => {
        graphView.dragging = false;
        graphView.hover = null;
        canvas.style.cursor = "default";
        drawNetwork("network", example());
      });
      canvas.addEventListener("mousedown", event => {
        graphView.dragging = true;
        graphView.dragX = event.clientX;
        graphView.dragY = event.clientY;
        canvas.style.cursor = "grabbing";
      });
      window.addEventListener("mouseup", () => {
        graphView.dragging = false;
        if (canvas) canvas.style.cursor = graphView.hover ? "pointer" : "grab";
      });
    }

    function confusionMatrix(ex, acc) {
      const labels = ex.labels;
      const total = ex.plain.length;
      let targetCorrect = Math.round(acc * total);
      const matrix = labels.map(() => labels.map(() => 0));
      const counts = labels.map(l => ex.classCounts[l]);
      const ideal = counts.map(c => Math.floor(c * targetCorrect / total));
      let assigned = ideal.reduce((a,b) => a+b, 0);
      for (let i=0; assigned < targetCorrect; i=(i+1)%labels.length) {
        if (ideal[i] < counts[i]) { ideal[i]++; assigned++; }
      }
      labels.forEach((_, i) => {
        matrix[i][i] = ideal[i];
        let errors = counts[i] - ideal[i];
        let j = 1;
        while (errors > 0) {
          matrix[i][(i+j) % labels.length]++;
          errors--; j++;
        }
      });
      return matrix;
    }

    function confusionAssignments(ex, acc) {
      const labels = ex.labels;
      const matrix = confusionMatrix(ex, acc);
      const rowsByClass = new Map(labels.map(label => [
        label,
        ex.plain.filter(row => row.Clase === label).sort((a, b) => String(a.ID).localeCompare(String(b.ID)))
      ]));
      const assignments = [];
      labels.forEach((actual, i) => {
        let cursor = 0;
        labels.forEach((pred, j) => {
          const count = matrix[i][j];
          const rows = rowsByClass.get(actual).slice(cursor, cursor + count);
          rows.forEach(row => assignments.push({ id: row.ID, actual, pred, actualIndex: i, predIndex: j }));
          cursor += count;
        });
      });
      return assignments;
    }

    function idsForMatrixCell(ex, acc, actualIndex, predIndex) {
      return new Set(confusionAssignments(ex, acc)
        .filter(item => item.actualIndex === actualIndex && item.predIndex === predIndex)
        .map(item => item.id));
    }

    function selectMatrixCell(mode, actualIndex, predIndex) {
      const ex = example();
      const r = chosenResult();
      const acc = mode === "plain" ? r.Accuracy_tabla : dynamicEnrichedAccuracy(ex, r);
      const labels = ex.labels;
      graphView.filterIds = idsForMatrixCell(ex, acc, actualIndex, predIndex);
      graphView.filterLabel = `${mode === "plain" ? "Datos" : "Datos enriquecidos"}: real ${labels[actualIndex]} / pred. ${labels[predIndex]}`;
      graphView.selected = null;
      graphView.hover = null;
      renderPermanentTables();
      renderPermanentMatrices();
      drawNetwork("network", ex);
    }

    function clearMatrixFilter() {
      graphView.filterIds = null;
      graphView.filterLabel = "";
      graphView.selected = null;
      graphView.hover = null;
      renderPermanentTables();
      renderPermanentMatrices();
      drawNetwork("network", example());
    }

    function networkEffectiveness(ex) {
      const total = ex.edges.length || 1;
      const visible = visibleEdges(ex);
      if (!visible.length) return 0;
      const nodeClass = new Map(ex.enriched.map(n => [n.ID, n.Clase]));
      const originalSame = ex.edges.filter(e => nodeClass.get(e.source) === nodeClass.get(e.target)).length / total;
      const visibleSame = visible.filter(e => nodeClass.get(e.source) === nodeClass.get(e.target)).length / visible.length;
      const density = visible.length / total;
      const homophilyGain = Math.min(1.25, visibleSame / Math.max(.01, originalSame));
      return Math.max(0, Math.min(1, density * (.55 + .45 * Math.min(1, homophilyGain))));
    }

    function dynamicEnrichedAccuracy(ex, result) {
      const q = networkEffectiveness(ex);
      return result.Accuracy_tabla + (result.Accuracy_tabla_mas_red - result.Accuracy_tabla) * q;
    }

    function matrixHtml(ex, acc, title) {
      const labels = ex.labels;
      const m = confusionMatrix(ex, acc);
      const max = Math.max(...m.flat());
      let cells = `<div class="labelcell"></div>${labels.map(l => `<div class="labelcell">Pred. ${escapeHtml(l)}</div>`).join("")}`;
      m.forEach((row, i) => {
        cells += `<div class="labelcell">Real ${escapeHtml(labels[i])}</div>`;
        row.forEach((v, j) => {
          const alpha = .35 + .65 * (v / max);
          const bg = i === j ? `rgba(20,125,131,${alpha})` : `rgba(200,78,71,${alpha})`;
          cells += `<div class="cell" style="background:${bg}">${v}</div>`;
        });
      });
      return `<div class="chart"><h4>${escapeHtml(title)}</h4><div class="confusion" style="grid-template-columns: repeat(${labels.length + 1}, minmax(78px, auto))">${cells}</div><p class="note">Matriz reconstruida de forma didáctica a partir del accuracy agregado; el ZIP no incluye predicciones por instancia.</p></div>`;
    }

    function compactMatrixHtml(ex, acc, title, mode=null) {
      const labels = ex.labels;
      const m = confusionMatrix(ex, acc);
      const max = Math.max(...m.flat());
      const short = (label) => String(label).slice(0, 4);
      let cells = `<div class="labelcell"></div>${labels.map(l => `<div class="labelcell" title="Pred. ${escapeHtml(l)}">${escapeHtml(short(l))}</div>`).join("")}`;
      m.forEach((row, i) => {
        cells += `<div class="labelcell" title="Real ${escapeHtml(labels[i])}">${escapeHtml(short(labels[i]))}</div>`;
        row.forEach((v, j) => {
          const alpha = .35 + .65 * (v / max);
          const bg = i === j ? `rgba(20,125,131,${alpha})` : `rgba(200,78,71,${alpha})`;
          const click = mode ? ` onclick="selectMatrixCell('${mode}', ${i}, ${j})" title="Filtrar real ${escapeHtml(labels[i])} / pred. ${escapeHtml(labels[j])}"` : "";
          cells += `<div class="cell ${mode ? "clickable" : ""}" style="background:${bg}"${click}>${v}</div>`;
        });
      });
      const source = chosenResult().Fuente === "Orange" ? "Orange" : "estimado";
      return `<div class="chart"><h4>${escapeHtml(title)}</h4><div class="mini-confusion" style="grid-template-columns: repeat(${labels.length + 1}, minmax(32px, auto))">${cells}</div><p class="note">${fmtPct(acc)} accuracy · ${source}</p></div>`;
    }

    function renderPermanentMatrices() {
      if (!$("matrixPanel")) return;
      const ex = example();
      const r = chosenResult();
      const dynamicAcc = dynamicEnrichedAccuracy(ex, r);
      $("matrixPanel").innerHTML =
        compactMatrixHtml(ex, r.Accuracy_tabla, "Datos", "plain") +
        compactMatrixHtml(ex, dynamicAcc, "Datos enriquecidos", "enriched") +
        `<p class="note">La matriz enriquecida cambia con la red efectiva. Con homofilia al 100% usa todas las aristas originales y vuelve al accuracy de referencia de Orange: ${fmtPct(r.Accuracy_tabla_mas_red)}.</p>`;
    }

    function rocSvg(accA, accB) {
      function path(power) {
        let d = "";
        for (let i=0; i<=40; i++) {
          const x = i / 40;
          const y = 1 - Math.pow(1 - x, power);
          d += (i ? "L" : "M") + (54 + x * 420).toFixed(1) + "," + (350 - y * 292).toFixed(1);
        }
        return d;
      }
      const pA = 1 + accA * 2.1, pB = 1 + accB * 3.3;
      return `<div class="chart"><svg viewBox="0 0 520 390" role="img" aria-label="Curva ROC didáctica">
        <line x1="54" y1="350" x2="474" y2="350" stroke="#6b767d"/><line x1="54" y1="350" x2="54" y2="58" stroke="#6b767d"/>
        <path d="M54,350 L474,58" stroke="#b6bec4" stroke-dasharray="6 6" fill="none"/>
        <path d="${path(pA)}" stroke="#d78a1f" stroke-width="4" fill="none"/>
        <path d="${path(pB)}" stroke="#147d83" stroke-width="4" fill="none"/>
        <text x="54" y="374" font-size="12" fill="#5d6972">0 FPR</text><text x="420" y="374" font-size="12" fill="#5d6972">1 FPR</text>
        <text x="8" y="66" font-size="12" fill="#5d6972">TPR 1</text><text x="14" y="350" font-size="12" fill="#5d6972">0</text>
        <circle cx="330" cy="105" r="5" fill="#147d83"/><text x="342" y="109" font-size="13" fill="#172026">Tabla + red</text>
        <circle cx="330" cy="130" r="5" fill="#d78a1f"/><text x="342" y="134" font-size="13" fill="#172026">Tabla normal</text>
      </svg><p class="note">Curva ROC didáctica generada desde los accuracies agregados para comparar la separación esperada de ambos enfoques.</p></div>`;
    }

    function accuracyChart(ex) {
      const rows = ex.results.map(r => `
        <div class="barrow"><b>${escapeHtml(r.Modelo)}</b><div class="bartrack"><div class="barfill red" style="width:${r.Accuracy_tabla*100}%"></div></div><span>${fmtPct(r.Accuracy_tabla)}</span></div>
        <div class="barrow"><span class="note">${r.Fuente === "Orange" ? "Orange" : "estimado"}</span><div class="bartrack"><div class="barfill" style="width:${r.Accuracy_tabla_mas_red*100}%"></div></div><span>${fmtPct(r.Accuracy_tabla_mas_red)}</span></div>`).join("");
      return `<div class="chart"><div class="bars">${rows}</div><p class="note">Naranja: tabla normal. Verde: tabla con atributos de red. Solo Regresion logistica, Random Forest y Arbol vienen directamente del paquete Orange; los demás son estimaciones didácticas.</p></div>`;
    }

    function openModal(kind) {
      const ex = example();
      const r = chosenResult();
      let title = "";
      let body = "";
      $("modal").classList.toggle("wide", kind === "metrics" || kind === "network" || kind === "roc");
      if (kind === "plain" || kind === "enriched") {
        const rows = ex[kind];
        title = kind === "plain" ? "Tabla normal" : "Tabla con atributos de red";
        body = `<div class="controls"><input id="searchRows" placeholder="Buscar en la tabla"><span class="note">${rows.length} filas</span></div><div class="table-wrap" id="modalTable"></div>`;
        $("modalTitle").textContent = title;
        $("modalBody").innerHTML = body;
        $("modal").showModal();
        const paint = () => $("modalTable").innerHTML = makeTable(rows, rows.length, $("searchRows").value);
        $("searchRows").oninput = paint; paint();
        return;
      }
      if (kind === "guide") {
        title = "Lectura del ejemplo";
        const best = ex.bestModel;
        body = `
          <div class="grid cards" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px">
            <div class="card"><div class="metric-label">Mejor mejora</div><div class="metric-value">+${fmtPct(best.Mejora)}</div><div class="metric-note">${escapeHtml(best.Modelo)}</div></div>
            <div class="card"><div class="metric-label">Red</div><div class="metric-value">${ex.edges.length}</div><div class="metric-note">relaciones observadas</div></div>
          </div>
          <div class="card">
            <h4>Pregunta didáctica</h4>
            <p>${escapeHtml(ex.meta.objective)}</p>
            <h4>Relación del grafo</h4>
            <p>${escapeHtml(ex.meta.relation)}</p>
            <h4>Punto clave</h4>
            <p>${escapeHtml(ex.meta.key)}</p>
            <h4>Trazabilidad de datos</h4>
            <p>Las tablas, clases, nodos, aristas y accuracies se cargan directamente desde los archivos CSV del paquete de Orange. Los layouts alternativos solo reubican visualmente los mismos nodos, y el slider de homofilia remueve aristas de la red efectiva sin crear relaciones nuevas ni alterar los archivos originales.</p>
          </div>`;
      }
      if (kind === "network") {
        title = "Red relacional";
        body = `<canvas id="modalNetwork" width="1100" height="640" style="width:100%;height:620px;display:block;background:#f9fbfb;border:1px solid var(--line);border-radius:8px"></canvas><div class="legend" id="modalLegend"></div><p class="note">${escapeHtml(ex.meta.relation)}</p>`;
      }
      if (kind === "metrics") {
        title = "Métricas de evaluación";
        body = `<div class="controls"><select id="modalModel">${ex.results.map(x => `<option value="${escapeHtml(x.Modelo)}" ${x.Modelo===selectedModel?"selected":""}>${escapeHtml(x.Modelo)}${x.Fuente === "Orange" ? "" : " · estimado"}</option>`).join("")}</select></div><div id="metricsBody"></div>`;
      }
      if (kind === "roc") {
        title = "Curvas ROC";
        const dyn = dynamicEnrichedAccuracy(ex, r);
        body = `<div class="controls"><select id="rocModel">${ex.results.map(x => `<option value="${escapeHtml(x.Modelo)}" ${x.Modelo===selectedModel?"selected":""}>${escapeHtml(x.Modelo)}${x.Fuente === "Orange" ? "" : " · estimado"}</option>`).join("")}</select><span class="note">La curva enriquecida responde a la red efectiva.</span></div><div id="rocBody"></div>`;
      }
      $("modalTitle").textContent = title;
      $("modalBody").innerHTML = body;
      $("modal").showModal();
      if (kind === "network") {
        drawNetwork("modalNetwork", ex);
        $("modalLegend").innerHTML = $("legend").innerHTML;
      }
      if (kind === "metrics") {
        const renderModalMetrics = () => {
          selectedModel = $("modalModel").value;
          const rr = chosenResult();
          $("metricsBody").innerHTML = accuracyChart(ex) + `<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px">` +
            matrixHtml(ex, rr.Accuracy_tabla, "Matriz de confusión: tabla normal") +
            matrixHtml(ex, dynamicEnrichedAccuracy(ex, rr), "Matriz de confusión: tabla + red") +
            `</div><div style="margin-top:12px">${rocSvg(rr.Accuracy_tabla, dynamicEnrichedAccuracy(ex, rr))}</div>`;
          renderMetrics();
        };
        $("modalModel").onchange = renderModalMetrics;
        renderModalMetrics();
      }
      if (kind === "roc") {
        const renderRoc = () => {
          selectedModel = $("rocModel").value;
          const rr = chosenResult();
          $("rocBody").innerHTML = rocSvg(rr.Accuracy_tabla, dynamicEnrichedAccuracy(ex, rr));
          renderPermanentMatrices();
        };
        $("rocModel").onchange = renderRoc;
        renderRoc();
      }
    }

    document.querySelectorAll("[data-modal]").forEach(btn => btn.addEventListener("click", () => openModal(btn.dataset.modal)));
    $("layoutSelect").onchange = event => {
      graphLayout = event.target.value;
      graphView.hover = null;
      drawNetwork("network", example());
    };
    $("homophilySlider").oninput = event => {
      homophilyLevel = Number(event.target.value);
      graphView.hover = null;
      graphView.filterIds = null;
      graphView.filterLabel = "";
      $("homophilyValue").textContent = homophilyLevel + "%";
      const ex = example();
      renderPermanentMatrices();
      renderPermanentTables();
      drawNetwork("network", ex);
    };
    $("edgeThicknessSlider").oninput = event => {
      edgeThickness = Number(event.target.value);
      $("edgeThicknessValue").textContent = edgeThickness + "%";
      drawNetwork("network", example());
    };
    $("openDrawer").onclick = openDrawer;
    $("closeDrawer").onclick = closeDrawer;
    $("drawerBackdrop").onclick = closeDrawer;
    $("clearMatrixFilter").onclick = clearMatrixFilter;
    $("closeModal").onclick = () => $("modal").close();
    $("modal").addEventListener("click", e => { if (e.target.id === "modal") $("modal").close(); });
    window.addEventListener("resize", () => drawNetwork("network", example()));
    setupGraphInteractions();
    selectExample(0);
  </script>
</body>
</html>
