<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Red 2×2 — Modo Seguro (layouts idénticos)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
  :root{--pri:#2563eb;--priH:#1d4ed8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  #app{display:flex;height:100vh}
  #left{width:300px;border-right:1px solid #e5e7eb;display:flex;flex-direction:column}
  #head{background:#eef2ff;color:#111;text-align:center;padding:10px 8px;font-weight:700}
  #ctrl{padding:10px;overflow:auto}
  label{font-size:12px;color:#374151}
  select,input[type="range"]{width:100%;margin:6px 0 10px}
  button{width:100%;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px;margin-top:8px;font-weight:700;cursor:pointer}
  button:hover{background:var(--priH)}
  .row{display:flex;gap:8px}
  #status{margin-top:10px;font-size:12px;color:#6b7280;white-space:pre-wrap}
  #right{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;background:#fafafa}
  .panel{position:relative;border:1px solid #e5e7eb;border-radius:8px;background:#fff;overflow:hidden}
  .title{position:absolute;left:8px;top:8px;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:2px 8px;font-size:12px}
  .leg{position:absolute;right:8px;bottom:8px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;font-size:11px}
  .cy{position:absolute;inset:0}
  .err{position:fixed;left:12px;right:12px;bottom:12px;background:#fee2e2;border:1px solid #fecaca;color:#7f1d1d;padding:8px 10px;border-radius:8px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="head">Red 2×2 — Modo Seguro</div>
    <div id="ctrl">
      <input id="file" type="file" accept=".gml,.graphml">
      <label>Layout (idéntico en las 4 vistas)</label>
      <select id="layout">
        <option value="cose">cose (recomendado)</option>
        <option value="grid">grid</option>
        <option value="circle">circle</option>
        <option value="concentric">concentric</option>
        <option value="breadthfirst">breadthfirst</option>
        <option value="random">random</option>
      </select>
      <div class="row">
        <button id="btnLayout">Aplicar layout</button>
        <button id="btnFit">Ajustar vista</button>
      </div>
      <label>Tamaño base: <span id="szLab">20</span> px</label>
      <input id="sz" type="range" min="8" max="60" value="20" step="1">
      <label>Escala: <span id="scLab">1.00×</span></label>
      <input id="sc" type="range" min="0.3" max="2" step="0.05" value="1">
      <div class="row">
        <button id="btnShow">Mostrar nombres</button>
        <button id="btnHide">Ocultar nombres</button>
      </div>
      <button id="btnValues">Alternar valores</button>
      <button id="btnReset">Reset estilo</button>
      <div id="status">Listo.</div>
    </div>
  </div>
  <div id="right">
    <div class="panel"><div class="title">Degree</div><div id="cy0" class="cy"></div><div class="leg"><span id="mm0">—</span></div></div>
    <div class="panel"><div class="title">Closeness</div><div id="cy1" class="cy"></div><div class="leg"><span id="mm1">—</span></div></div>
    <div class="panel"><div class="title">Betweenness</div><div id="cy2" class="cy"></div><div class="leg"><span id="mm2">—</span></div></div>
    <div class="panel"><div class="title">Eigenvector</div><div id="cy3" class="cy"></div><div class="leg"><span id="mm3">—</span></div></div>
  </div>
</div>
<div id="err" class="err"></div>

<script>
(function(){
const S = { base:20, scale:1, showLabels:true, showVals:false };
const P = [
  { id:'cy0', metric:'degree',    mm:'mm0', cy:null },
  { id:'cy1', metric:'closeness', mm:'mm1', cy:null },
  { id:'cy2', metric:'betweenness', mm:'mm2', cy:null },
  { id:'cy3', metric:'eigen',     mm:'mm3', cy:null },
];
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');

function log(msg){ statusEl.textContent = msg; }
function showErr(e){
  errEl.textContent = (e && e.message) ? e.message : String(e);
  errEl.style.display = 'block';
  setTimeout(()=>{ errEl.style.display='none'; }, 6000);
}

function makeCy(id){
  return cytoscape({
    container: document.getElementById(id),
    elements: [],
    style: [
      { selector:'node', style:{
        'background-color':'#93c5fd','width':20,'height':20,
        'label':'data(_lab)','font-size':10,'color':'#111'
      }},
      { selector:'edge', style:{ 'width':1, 'line-color':'#cbd5e1' } },
      { selector:'node:selected', style:{ 'border-width':2,'border-color':'#111' } },
      { selector:'.nolabel', style:{ 'label':'' } },
    ],
    layout: { name:'cose' },
    pixelRatio: 1
  });
}

P.forEach(p => p.cy = makeCy(p.id));

// Default karate network to ensure something loads
function karate(){
  const nodes=[]; for(let i=1;i<=34;i++) nodes.push({ data:{ id:String(i), label:String(i), _lab:String(i) } });
  const edges=[[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8],[1,9],[1,11],[1,12],[1,13],[1,14],[1,18],[1,20],[1,22],[1,32],
  [2,3],[2,4],[2,8],[2,14],[2,18],[2,20],[2,22],[2,31],[3,4],[3,8],[3,9],[3,10],[3,14],[3,28],[3,29],[3,33],
  [4,8],[4,13],[4,14],[5,7],[5,11],[6,7],[6,11],[6,17],[7,17],[9,31],[9,33],[9,34],[10,34],[14,34],[15,33],[15,34],
  [16,33],[16,34],[19,33],[19,34],[20,34],[21,33],[21,34],[23,33],[23,34],[24,26],[24,28],[24,30],[25,26],[25,28],[25,32],
  [26,32],[27,30],[27,34],[28,34],[29,32],[30,33],[30,34],[31,33],[31,34],[32,33],[32,34],[33,34]];
  return {
    nodes: nodes,
    edges: edges.map(([s,t],i)=>({ data:{ id:'e'+i, source:String(s), target:String(t) } }))
  };
}

function loadElementsAll(elements){
  P.forEach(p=>{ p.cy.elements().remove(); p.cy.add(elements); });
  identicalLayout();
  recalcAll();
  fitAll();
  log(`Cargada red: ${P[0].cy.nodes().length} nodos, ${P[0].cy.edges().length} enlaces.`);
}

function parseGML(text){
  const nodeR=/node\s*\[\s*([\s\S]*?)\]/g, edgeR=/edge\s*\[\s*([\s\S]*?)\]/g;
  const field=(blk,key)=>{
    const re=new RegExp('(?:^|\\s)'+key+'\\s+(\\"[^\\"]*\\"|[^\\s\\]]+)', 'i');
    const m=blk.match(re); if(!m) return;
    let v=m[1].trim(); if (v.startsWith('"') && v.endsWith('"')) v=v.slice(1,-1); return v;
  };
  const elements=[]; const seen=new Set();
  let m;
  while ((m=nodeR.exec(text))!==null){
    const b=m[1]; let id=field(b,'id'); if (id==null) id=field(b,'label')||('n'+Math.random().toString(36).slice(2,7));
    const label=field(b,'label')||String(id);
    if (seen.has(String(id))) continue; seen.add(String(id));
    elements.push({ data:{ id:String(id), label:String(label), _lab:String(label) } });
  }
  while ((m=edgeR.exec(text))!==null){
    const b=m[1]; const s=field(b,'source'); const t=field(b,'target'); if (!s||!t) continue;
    const eid='e_'+s+'_'+t+'_'+Math.random().toString(36).slice(2,6);
    elements.push({ data:{ id:eid, source:String(s), target:String(t) } });
  }
  if (!elements.length) throw new Error('GML vacío o sin nodos/aristas.');
  return elements;
}
function parseGraphML(xmlText){
  const parser=new DOMParser(); const doc=parser.parseFromString(xmlText,'application/xml');
  const graph = doc.querySelector('graph'); if (!graph) throw new Error('GraphML inválido.');
  const elements=[];
  graph.querySelectorAll('node').forEach(n=>{
    const id=n.getAttribute('id')||('n'+Math.random().toString(36).slice(2,7));
    const label=id;
    elements.push({ data:{ id, label, _lab:label } });
  });
  graph.querySelectorAll('edge').forEach((e,i)=>{
    const s=e.getAttribute('source'); const t=e.getAttribute('target');
    if (s && t) elements.push({ data:{ id:'e'+i, source:s, target:t } });
  });
  if (!elements.length) throw new Error('GraphML sin contenido.');
  return elements;
}

function availableLayout(name){
  // Only built-ins in safe mode
  const allowed = new Set(['cose','grid','circle','concentric','breadthfirst','random']);
  return allowed.has(name) ? name : 'cose';
}

/** Run layout on panel 0, copy positions to others */
function identicalLayout(){
  const name = availableLayout(document.getElementById('layout').value || 'cose');
  const ref = P[0].cy;
  const opts = { name, animate:'end', randomize:false, fit:false };
  const lay = ref.layout(opts);
  lay.on('layoutstop', ()=>{
    const pos={}; ref.nodes().forEach(n=> pos[n.id()] = n.position());
    for (let i=1;i<P.length;i++){
      const cy=P[i].cy;
      cy.batch(()=> cy.nodes().forEach(n=>{ const p=pos[n.id()]; if (p) n.position(p); }) );
    }
    fitAll();
  });
  lay.run();
}

function fitAll(){ P.forEach(p=>{ p.cy.resize(); p.cy.fit(); }); }

function colorScale(val, min, max){
  const t = (val - min) / ((max - min) || 1);
  const r = Math.round(255 * (t < 0.5 ? 0 : (t - 0.5) * 2));
  const g = Math.round(255 * (t < 0.5 ? t * 2 : 1 - (t - 0.5) * 2));
  const b = Math.round(255 * (1 - t));
  return `rgb(${r},${g},${b})`;
}

function applyMetric(cy, metric, mmId){
  const nodes = cy.nodes();
  if (!nodes.length){ document.getElementById(mmId).textContent='—'; return; }
  let val = {};
  if (metric==='degree'){
    nodes.forEach(n=> val[n.id()] = n.degree(false));
  } else if (metric==='closeness'){
    // simple normalized closeness (unweighted, undirected)
    const N = nodes.length;
    nodes.forEach(n=>{
      const d = bfsDist(cy, n);
      let sum = 0; let reachable = 0;
      d.forEach(di=>{ if (di>0 && di<Infinity){ sum+=di; reachable++; } });
      val[n.id()] = (sum>0) ? ((reachable/(sum)) * ((reachable)/(N-1))) : 0;
    });
  } else if (metric==='betweenness'){
    val = betweennessBrandes(cy);
  } else if (metric==='eigen'){
    val = eigenPower(cy);
  }
  const arr = Object.values(val); const min = Math.min(...arr), max = Math.max(...arr);
  document.getElementById(mmId).textContent = `${min.toFixed(3)} — ${max.toFixed(3)}`;
  nodes.forEach(n=>{
    const v = val[n.id()] || 0; const t = (v - min)/((max-min)||1);
    const size = S.base*S.scale*(0.5 + 1.5*t);
    n.style({'width':size,'height':size,'background-color':colorScale(v,min,max)});
    const base = n.data('label') || n.id();
    n.data('_lab', S.showLabels ? (S.showVals ? `${base} (${v.toFixed(3)})` : base) : base);
  });
  const maxNodes = nodes.filter(n => (val[n.id()] ?? -Infinity) === max);
  maxNodes.forEach(n => n.style({'border-width':3,'border-color':'#111'}));
}

function bfsDist(cy, src){
  const nodes = cy.nodes(); const idx = Object.fromEntries(nodes.map((n,i)=>[n.id(),i]));
  const N = nodes.length; const dist = Array(N).fill(Infinity);
  const s = idx[src.id()]; dist[s]=0;
  const q=[src.id()]; const seen=new Set([src.id()]);
  while(q.length){
    const u = q.shift(); const du = dist[idx[u]];
    cy.getElementById(u).connectedEdges().forEach(e=>{
      const v = e.source().id()===u ? e.target().id() : e.source().id();
      if (!seen.has(v)){ seen.add(v); dist[idx[v]] = du+1; q.push(v); }
    });
  }
  return dist;
}

function betweennessBrandes(cy){
  const nodes = cy.nodes(); const ids = nodes.map(n=>n.id());
  const idx = Object.fromEntries(ids.map((id,i)=>[id,i]));
  const N = ids.length; const adj = Array.from({length:N},()=>[]);
  cy.edges().forEach(e=>{
    const u=idx[e.source().id()], v=idx[e.target().id()];
    if (u==null||v==null) return; adj[u].push(v); adj[v].push(u);
  });
  const CB = new Array(N).fill(0);
  for (let s=0;s<N;s++){
    const S=[]; const P=Array.from({length:N},()=>[]);
    const sigma=new Array(N).fill(0); sigma[s]=1;
    const d=new Array(N).fill(-1); d[s]=0;
    const Q=[]; Q.push(s);
    while(Q.length){
      const v=Q.shift(); S.push(v);
      for (const w of adj[v]){
        if (d[w]<0){ Q.push(w); d[w]=d[v]+1; }
        if (d[w]===d[v]+1){ sigma[w]+=sigma[v]; P[w].push(v); }
      }
    }
    const delta=new Array(N).fill(0);
    while(S.length){
      const w=S.pop();
      for (const v of P[w]) delta[v]+= (sigma[v]/sigma[w])*(1+delta[w]);
      if (w!==s) CB[w]+=delta[w];
    }
  }
  const res={}; for (let i=0;i<N;i++) res[ids[i]]=CB[i]; return res;
}

function eigenPower(cy, iter=200, tol=1e-6){
  const nodes = cy.nodes(); const ids = nodes.map(n=>n.id()); const N = ids.length;
  const idx = Object.fromEntries(ids.map((id,i)=>[id,i]));
  const adj = Array.from({length:N},()=>[]);
  cy.edges().forEach(e=>{
    const u=idx[e.source().id()], v=idx[e.target().id()];
    if (u==null||v==null) return; adj[u].push(v); adj[v].push(u);
  });
  let x = Array.from({length:N}, ()=>1/Math.sqrt(N));
  for (let k=0;k<iter;k++){
    const y = new Array(N).fill(0);
    for (let i=0;i<N;i++) for (const j of adj[i]) y[i]+=x[j];
    let norm = Math.hypot(...y) || 1; for (let i=0;i<N;i++) y[i]/=norm;
    let diff=0; for (let i=0;i<N;i++) diff=Math.max(diff,Math.abs(y[i]-x[i]));
    x=y; if (diff<tol) break;
  }
  const res={}; for (let i=0;i<N;i++) res[ids[i]]=x[i]; return res;
}

function recalcAll(){
  P.forEach((p,i)=> applyMetric(p.cy, p.metric, p.mm));
  setLabels();
}
function setLabels(){
  P.forEach(p=>{
    if (S.showLabels) p.cy.nodes().removeClass('nolabel'); else p.cy.nodes().addClass('nolabel');
  });
}

document.getElementById('btnLayout').onclick = identicalLayout;
document.getElementById('btnFit').onclick = fitAll;
document.getElementById('btnShow').onclick = ()=>{ S.showLabels=true; recalcAll(); };
document.getElementById('btnHide').onclick = ()=>{ S.showLabels=false; recalcAll(); };
document.getElementById('btnValues').onclick = ()=>{ S.showVals=!S.showVals; recalcAll(); };
document.getElementById('btnReset').onclick = ()=>{
  S.showVals=false;
  P.forEach(p=>{
    p.cy.nodes().forEach(n=>{
      n.style({'width':S.base*S.scale,'height':S.base*S.scale,'background-color':'#93c5fd','border-width':0});
      n.data('_lab', n.data('label')||n.id());
    });
    document.getElementById(p.mm).textContent='—';
  });
  setLabels();
};

document.getElementById('sz').addEventListener('input', e=>{
  S.base = Number(e.target.value);
  document.getElementById('szLab').textContent = e.target.value;
  recalcAll();
});
document.getElementById('sc').addEventListener('input', e=>{
  S.scale = Number(e.target.value);
  document.getElementById('scLab').textContent = Number(e.target.value).toFixed(2)+'×';
  recalcAll();
});

document.getElementById('file').addEventListener('change', e=>{
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      let elements=[];
      const txt = ev.target.result;
      if (f.name.toLowerCase().endsWith('.gml')) elements = parseGML(txt);
      else if (f.name.toLowerCase().endsWith('.graphml')) elements = parseGraphML(txt);
      else throw new Error('Formato no soportado (usa .gml o .graphml).');
      loadElementsAll(elements);
    }catch(ex){ showErr(ex); }
  };
  reader.onerror = () => showErr('No se pudo leer el archivo.');
  reader.readAsText(f);
});

// Boot: load karate so something appears even if user doesn't upload yet
(function boot(){
  try{
    const k = karate();
    const elements = [...k.nodes, ...k.edges];
    loadElementsAll(elements);
  }catch(ex){ showErr(ex); }
})();

})();</script>
</body>
</html>
