<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presorting interactivo</title>
  <style>
    :root {
      --bg: #f5efe5;
      --ink: #22302d;
      --muted: #66736f;
      --panel: #fffaf1;
      --line: #d8d0c2;
      --blue: #2f80ed;
      --green: #2f9e44;
      --orange: #e0912f;
      --red: #d65f4a;
      --purple: #8264c9;
      --shadow: rgba(43, 34, 22, 0.14);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-weight: 740;
    }
    button { cursor: pointer; }
    button.primary, button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input { width: 100%; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 760; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: end;
      padding: 12px 14px; background: color-mix(in srgb, var(--bg) 94%, white);
      border-bottom: 1px solid var(--line); box-shadow: 0 4px 18px var(--shadow);
    }
    h1 { margin: 0 8px 4px 0; font-size: 22px; line-height: 1; letter-spacing: 0; }
    h2 { margin: 0; font-size: 16px; line-height: 1.1; }
    .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
    .inputs { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(190px, auto) auto; gap: 8px; align-items: end; }
    .stage {
      width: 100%; max-width: 1500px; margin: 0 auto; padding: 12px;
      display: grid; grid-template-columns: minmax(300px, 410px) minmax(560px, 1fr); gap: 12px;
    }
    .panel {
      min-width: 0; background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px; box-shadow: 0 10px 26px var(--shadow); padding: 12px;
    }
    .left { display: grid; gap: 10px; align-content: start; }
    .card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .card strong { display: block; margin-bottom: 5px; font-size: 14px; }
    .card p { margin: 0; color: var(--muted); line-height: 1.45; font-weight: 650; overflow-wrap: anywhere; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px; }
    .stat span { display: block; color: var(--muted); font-size: 11px; font-weight: 760; }
    .stat strong { font-size: 18px; }
    .main { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; }
    .stepper { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
    .meter { height: 8px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--line) 76%, transparent); }
    .meter span { display: block; height: 100%; width: 0; background: var(--orange); transition: width 220ms ease; }
    .arrays { display: grid; gap: 12px; }
    .array-block { display: grid; gap: 7px; }
    .array-title { color: var(--muted); font-size: 12px; font-weight: 780; }
    .cells { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 45px; }
    .cell {
      min-width: 42px; min-height: 42px; padding: 6px 9px;
      display: grid; place-items: center; border-radius: 8px;
      border: 1px solid var(--line); background: var(--panel);
      font-weight: 850; position: relative;
    }
    .cell.active { background: color-mix(in srgb, var(--orange) 18%, var(--panel)); border-color: var(--orange); }
    .cell.compare { background: color-mix(in srgb, var(--blue) 14%, var(--panel)); border-color: var(--blue); }
    .cell.match { background: color-mix(in srgb, var(--green) 16%, var(--panel)); border-color: var(--green); }
    .cell.bad { background: color-mix(in srgb, var(--red) 14%, var(--panel)); border-color: var(--red); }
    .cell.pointer::after {
      content: "▲"; position: absolute; left: 50%; bottom: -19px; transform: translateX(-50%);
      color: var(--purple); font-size: 13px;
    }
    .visual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .trace { display: grid; gap: 7px; max-height: 270px; overflow: auto; padding-right: 4px; }
    .trace-row {
      display: grid; grid-template-columns: 70px 1fr; gap: 8px;
      padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
      color: var(--muted); font-size: 12px; font-weight: 700;
    }
    .trace-row.on { color: var(--ink); border-color: var(--orange); background: color-mix(in srgb, var(--orange) 11%, var(--bg)); }
    .badge { display: inline-flex; padding: 3px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 760; }
    .big-result { font-size: 24px; font-weight: 900; color: var(--ink); }
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    @media (max-width: 1050px) {
      .topbar, .stage, .visual-grid, .inputs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Presorting</h1>
    <form class="inputs" id="dataForm">
      <label>Datos
        <input id="dataInput" value="8,3,5,3,9,1,5,3,7">
      </label>
      <label>Problema
        <select id="problemSelect">
          <option value="duplicates">Buscar duplicados</option>
          <option value="mode">Moda</option>
          <option value="unique">Verificar unicidad</option>
          <option value="median">Mediana</option>
          <option value="intersection">Interseccion de dos listas</option>
          <option value="twosum">Par con suma objetivo</option>
          <option value="searchBatch">Muchas busquedas</option>
          <option value="anagram">Anagramas</option>
        </select>
      </label>
      <button class="primary" type="submit">Construir</button>
    </form>
    <div class="row">
      <button id="prevStep" type="button">Anterior</button>
      <button id="nextStep" class="primary" type="button">Siguiente</button>
    </div>
  </header>

  <main class="stage">
    <section class="panel left">
      <div class="stepper">
        <button id="firstStep" type="button">Inicio</button>
        <div>
          <span class="badge" id="stepLabel">Paso 0</span>
          <div class="meter"><span id="progress"></span></div>
        </div>
        <button id="lastStep" type="button">Final</button>
      </div>

      <div class="stats">
        <div class="stat"><span>Sin ordenar</span><strong id="naiveCost">-</strong></div>
        <div class="stat"><span>Presorting</span><strong id="sortCost">-</strong></div>
        <div class="stat"><span>Resultado</span><strong id="resultBox">-</strong></div>
      </div>

      <div class="card">
        <strong id="ideaTitle">Idea</strong>
        <p id="ideaText">Ordenar primero agrupa elementos iguales y vuelve local un problema global.</p>
      </div>

      <div class="card">
        <strong>Transformacion</strong>
        <p id="transformText">datos desordenados → ordenar → escanear vecinos o bloques.</p>
      </div>

      <div class="row">
        <button id="playStep" type="button">Reproducir</button>
        <button id="resetStep" type="button">Reiniciar</button>
      </div>
    </section>

    <section class="panel main">
      <h2 id="problemTitle">Buscar duplicados</h2>
      <div class="arrays">
        <div class="array-block">
          <div class="array-title">Antes de ordenar</div>
          <div class="cells" id="originalCells"></div>
        </div>
        <div class="array-block">
          <div class="array-title">Despues de presorting</div>
          <div class="cells" id="sortedCells"></div>
        </div>
      </div>

      <div class="visual-grid">
        <div class="card">
          <strong>Recorrido visual</strong>
          <svg id="arrowSvg" viewBox="0 0 520 130" aria-label="Flechas del recorrido"></svg>
        </div>
        <div class="card">
          <strong>Traza</strong>
          <div class="trace" id="traceBox"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const dataInput = $("dataInput"), dataForm = $("dataForm"), problemSelect = $("problemSelect");
const prevStep = $("prevStep"), nextStep = $("nextStep"), firstStep = $("firstStep"), lastStep = $("lastStep"), playStep = $("playStep"), resetStep = $("resetStep");
const stepLabel = $("stepLabel"), progress = $("progress"), naiveCost = $("naiveCost"), sortCost = $("sortCost"), resultBox = $("resultBox");
const ideaTitle = $("ideaTitle"), ideaText = $("ideaText"), transformText = $("transformText"), problemTitle = $("problemTitle");
const originalCells = $("originalCells"), sortedCells = $("sortedCells"), traceBox = $("traceBox"), arrowSvg = $("arrowSvg");
let data = [], aux = [], sorted = [], steps = [], currentStep = 0, timer = null, problem = "duplicates";

const problemInfo = {
  duplicates: { title:"Buscar duplicados", idea:"Al ordenar, los duplicados quedan juntos. Basta comparar vecinos.", naive:"O(n²)", sorted:"O(n log n) + O(n)" },
  mode: { title:"Moda", idea:"Al ordenar, cada valor aparece como un bloque contiguo. La moda es el bloque mas largo.", naive:"O(n²)", sorted:"O(n log n) + O(n)" },
  unique: { title:"Verificar unicidad", idea:"Si algun par igual existe, aparecera como vecinos despues de ordenar.", naive:"O(n²)", sorted:"O(n log n) + O(n)" },
  median: { title:"Mediana", idea:"Ordenar coloca el elemento central en su posicion estadistica.", naive:"seleccion", sorted:"O(n log n)" },
  intersection: { title:"Interseccion de dos listas", idea:"Ordenar ambas listas permite avanzar dos punteros sin retroceder.", naive:"O(nm)", sorted:"ordenar + O(n+m)" },
  twosum: { title:"Par con suma objetivo", idea:"Ordenar permite usar dos punteros: uno bajo y uno alto.", naive:"O(n²)", sorted:"O(n log n) + O(n)" },
  searchBatch: { title:"Muchas busquedas", idea:"Ordenar una vez permite resolver muchas consultas con busqueda binaria.", naive:"O(nq)", sorted:"O(n log n) + O(q log n)" },
  anagram: { title:"Anagramas", idea:"Dos palabras son anagramas si sus letras ordenadas coinciden.", naive:"conteo", sorted:"ordenar caracteres" }
};

function parseList(text) {
  return text.split(",").map(s => s.trim()).filter(Boolean).map(v => {
    const n = Number(v);
    return Number.isFinite(n) ? n : v;
  });
}

function compare(a, b) {
  if (typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b));
}

function display(v) { return String(v); }

function rebuild() {
  stop();
  problem = problemSelect.value;
  const raw = dataInput.value.trim();
  if (problem === "anagram") {
    const parts = raw.includes("|") ? raw.split("|") : ["listen", "silent"];
    data = parts[0].trim().split("");
    aux = parts[1].trim().split("");
  } else if (problem === "intersection") {
    const parts = raw.includes("|") ? raw.split("|") : [raw, "3,4,5,8,10"];
    data = parseList(parts[0]);
    aux = parseList(parts[1]);
  } else if (problem === "searchBatch") {
    const parts = raw.includes("|") ? raw.split("|") : [raw, "1,3,10"];
    data = parseList(parts[0]);
    aux = parseList(parts[1]);
  } else if (problem === "twosum") {
    const parts = raw.includes("|") ? raw.split("|") : [raw, "10"];
    data = parseList(parts[0]).map(Number);
    aux = [Number(parts[1]) || 10];
  } else {
    data = parseList(raw);
    aux = [];
  }
  sorted = data.slice().sort(compare);
  steps = buildSteps();
  currentStep = 0;
  render();
}

function baseSteps() {
  return [
    { phase:"start", message:"Partimos de los datos originales.", activeOriginal:[] },
    { phase:"sort", message:"Aplicamos presorting: ordenamos para revelar estructura.", activeSorted:[] }
  ];
}

function buildSteps() {
  if (problem === "duplicates") return duplicateSteps(false);
  if (problem === "unique") return duplicateSteps(true);
  if (problem === "mode") return modeSteps();
  if (problem === "median") return medianSteps();
  if (problem === "intersection") return intersectionSteps();
  if (problem === "twosum") return twoSumSteps();
  if (problem === "searchBatch") return searchBatchSteps();
  if (problem === "anagram") return anagramSteps();
  return baseSteps();
}

function duplicateSteps(uniqueOnly) {
  const out = baseSteps();
  let found = null;
  for (let i = 0; i < sorted.length - 1; i++) {
    const same = sorted[i] === sorted[i + 1];
    out.push({ phase:"scan", i, j:i+1, activeSorted:[i,i+1], message:`Comparar vecinos ${display(sorted[i])} y ${display(sorted[i+1])}. ${same ? "Coinciden." : "Distintos."}` });
    if (same && found === null) found = sorted[i];
  }
  out.push({ phase:"result", result: uniqueOnly ? (found === null ? "todos unicos" : "no unico") : (found === null ? "sin duplicados" : "duplicado: " + found), message: uniqueOnly ? "La unicidad queda decidida mirando vecinos." : "Los duplicados se detectan porque quedan juntos." });
  return out;
}

function modeSteps() {
  const out = baseSteps();
  let bestVal = null, bestLen = 0, i = 0;
  while (i < sorted.length) {
    let j = i;
    while (j < sorted.length && sorted[j] === sorted[i]) j++;
    const len = j - i;
    if (len > bestLen) { bestLen = len; bestVal = sorted[i]; }
    out.push({ phase:"block", activeSorted:range(i,j), message:`Bloque de ${display(sorted[i])}: longitud ${len}. Mejor hasta ahora: ${display(bestVal)} (${bestLen}).`, block:[i,j-1] });
    i = j;
  }
  out.push({ phase:"result", result:`moda: ${display(bestVal)}`, message:`La moda es ${display(bestVal)} porque su bloque es el mas largo.` });
  return out;
}

function medianSteps() {
  const out = baseSteps();
  const mid = Math.floor(sorted.length / 2);
  const result = sorted.length % 2 ? sorted[mid] : (Number(sorted[mid-1]) + Number(sorted[mid])) / 2;
  out.push({ phase:"median", activeSorted: sorted.length % 2 ? [mid] : [mid-1, mid], message:"La mediana vive en el centro del arreglo ordenado." });
  out.push({ phase:"result", result:"mediana: " + result, message:"Ordenar transforma mediana en leer posicion central." });
  return out;
}

function intersectionSteps() {
  const a = sorted, b = aux.slice().sort(compare), out = baseSteps();
  out[1].secondary = b;
  let i = 0, j = 0, found = [];
  while (i < a.length && j < b.length) {
    const cmp = compare(a[i], b[j]);
    out.push({ phase:"two", secondary:b, i, j, activeSorted:[i], activeAux:[j], message:`Comparar ${display(a[i])} con ${display(b[j])}. ${cmp === 0 ? "Entra a la interseccion." : cmp < 0 ? "Avanza izquierda." : "Avanza derecha."}` });
    if (cmp === 0) { found.push(a[i]); i++; j++; }
    else if (cmp < 0) i++;
    else j++;
  }
  out.push({ phase:"result", secondary:b, result:"{" + found.join(", ") + "}", message:"Con dos listas ordenadas, cada puntero solo avanza." });
  return out;
}

function twoSumSteps() {
  const out = baseSteps(), target = aux[0];
  let l = 0, r = sorted.length - 1, found = null;
  while (l < r) {
    const sum = Number(sorted[l]) + Number(sorted[r]);
    out.push({ phase:"two", i:l, j:r, activeSorted:[l,r], message:`${sorted[l]} + ${sorted[r]} = ${sum}. ${sum === target ? "Objetivo encontrado." : sum < target ? "Suma baja: mover izquierda." : "Suma alta: mover derecha."}` });
    if (sum === target) { found = [sorted[l], sorted[r]]; break; }
    if (sum < target) l++; else r--;
  }
  out.push({ phase:"result", result: found ? `${found[0]} + ${found[1]} = ${target}` : "sin par", message:"Presorting permite decidir hacia donde mover los punteros." });
  return out;
}

function searchBatchSteps() {
  const out = baseSteps();
  aux.forEach(q => {
    let l = 0, r = sorted.length - 1;
    while (l <= r) {
      const m = Math.floor((l + r) / 2);
      const cmp = compare(sorted[m], q);
      out.push({ phase:"binary", activeSorted:[m], range:[l,r], message:`Buscar ${q}: mirar centro ${display(sorted[m])}. ${cmp === 0 ? "Encontrado." : cmp < 0 ? "Ir a la mitad derecha." : "Ir a la mitad izquierda."}` });
      if (cmp === 0) break;
      if (cmp < 0) l = m + 1; else r = m - 1;
    }
  });
  out.push({ phase:"result", result:`${aux.length} consultas`, message:"El costo de ordenar se amortiza cuando hay muchas busquedas." });
  return out;
}

function anagramSteps() {
  const a = data.slice().sort(compare), b = aux.slice().sort(compare);
  const out = [{ phase:"start", message:"Dos palabras: comparar letras desordenadas es dificil." }, { phase:"sort", secondary:b, message:"Ordenamos caracteres de ambas palabras." }];
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i++) {
    out.push({ phase:"two", secondary:b, activeSorted:[i], activeAux:[i], message:`Comparar posicion ${i+1}: ${a[i] || "-"} con ${b[i] || "-"}.` });
  }
  const ok = a.join("") === b.join("");
  sorted = a;
  out.push({ phase:"result", secondary:b, result: ok ? "son anagramas" : "no son", message:"Si las listas ordenadas de letras coinciden, son anagramas." });
  return out;
}

function range(a,b) { const r=[]; for(let i=a;i<b;i++) r.push(i); return r; }

function render() {
  const info = problemInfo[problem], step = steps[currentStep] || steps[0];
  problemTitle.textContent = info.title;
  ideaTitle.textContent = info.title;
  ideaText.textContent = info.idea;
  transformText.textContent = step.message;
  naiveCost.textContent = info.naive;
  sortCost.textContent = info.sorted;
  resultBox.textContent = step.result || "en proceso";
  stepLabel.textContent = "Paso " + currentStep + " de " + (steps.length - 1);
  progress.style.width = (steps.length <= 1 ? 100 : currentStep / (steps.length - 1) * 100) + "%";
  prevStep.disabled = currentStep === 0;
  firstStep.disabled = currentStep === 0;
  nextStep.disabled = currentStep >= steps.length - 1;
  lastStep.disabled = currentStep >= steps.length - 1;
  playStep.disabled = currentStep >= steps.length - 1;
  playStep.textContent = timer ? "Pausar" : "Reproducir";
  renderCells(originalCells, data, step.activeOriginal || []);
  renderCells(sortedCells, sorted, step.activeSorted || [], step);
  renderTrace();
  renderArrows(step);
}

function renderCells(container, values, active, step = {}) {
  container.innerHTML = "";
  values.forEach((v, i) => {
    const cell = document.createElement("div");
    let cls = "cell";
    if (active.includes(i)) cls += " active";
    if (step.range && i >= step.range[0] && i <= step.range[1]) cls += " compare";
    if (step.block && i >= step.block[0] && i <= step.block[1]) cls += " match";
    if (step.i === i || step.j === i) cls += " pointer";
    cell.className = cls;
    cell.textContent = display(v);
    container.appendChild(cell);
  });
  if (step.secondary) {
    const sep = document.createElement("span");
    sep.className = "badge";
    sep.textContent = "segunda lista";
    container.appendChild(sep);
    step.secondary.forEach((v, i) => {
      const cell = document.createElement("div");
      let cls = "cell";
      if ((step.activeAux || []).includes(i)) cls += " active pointer";
      cell.className = cls;
      cell.textContent = display(v);
      container.appendChild(cell);
    });
  }
}

function renderTrace() {
  traceBox.innerHTML = "";
  steps.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "trace-row" + (i === currentStep ? " on" : "");
    row.innerHTML = `<span>paso ${i}</span><span>${s.message}</span>`;
    row.addEventListener("click", () => { stop(); currentStep = i; render(); });
    traceBox.appendChild(row);
  });
}

function renderArrows(step) {
  while (arrowSvg.firstChild) arrowSvg.removeChild(arrowSvg.firstChild);
  const w = 520, y = 68;
  const active = step.activeSorted || [];
  active.forEach((idx, k) => {
    const x = 45 + idx * Math.min(42, 420 / Math.max(1, sorted.length - 1));
    const line = make("line", { x1:x, y1:20, x2:x, y2:y, stroke:"var(--purple)", "stroke-width":3, "stroke-linecap":"round" });
    arrowSvg.appendChild(line);
    arrowSvg.appendChild(make("path", { d:`M ${x-7} ${y-8} L ${x} ${y+5} L ${x+7} ${y-8}`, fill:"none", stroke:"var(--purple)", "stroke-width":3, "stroke-linecap":"round", "stroke-linejoin":"round" }));
  });
  if (step.i !== undefined && step.j !== undefined && step.i !== step.j) {
    const x1 = 45 + step.i * Math.min(42, 420 / Math.max(1, sorted.length - 1));
    const x2 = 45 + step.j * Math.min(42, 420 / Math.max(1, sorted.length - 1));
    arrowSvg.appendChild(make("path", { d:`M ${x1} 96 C ${(x1+x2)/2} 125 ${(x1+x2)/2} 125 ${x2} 96`, fill:"none", stroke:"var(--orange)", "stroke-width":4, "stroke-linecap":"round" }));
  }
  const text = make("text", { x:260, y:116, "text-anchor":"middle", fill:"var(--muted)", "font-size":13, "font-weight":800 });
  text.textContent = step.phase === "sort" ? "ordenar revela vecindad, bloques y punteros" : "observa solo lo resaltado";
  arrowSvg.appendChild(text);
}

function make(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
  return el;
}

function stop() { if (timer) { clearInterval(timer); timer = null; } }
dataForm.addEventListener("submit", e => { e.preventDefault(); rebuild(); });
problemSelect.addEventListener("change", () => {
  const presets = {
    intersection: "8,3,5,3,9,1,5,3,7|3,4,5,8,10",
    twosum: "8,3,5,3,9,1,5,3,7|10",
    searchBatch: "8,3,5,3,9,1,5,3,7|1,3,10",
    anagram: "transformar|formartrnas"
  };
  dataInput.value = presets[problemSelect.value] || "8,3,5,3,9,1,5,3,7";
  rebuild();
});
prevStep.addEventListener("click", () => { stop(); currentStep = Math.max(0, currentStep - 1); render(); });
nextStep.addEventListener("click", () => { stop(); currentStep = Math.min(steps.length - 1, currentStep + 1); render(); });
firstStep.addEventListener("click", () => { stop(); currentStep = 0; render(); });
lastStep.addEventListener("click", () => { stop(); currentStep = steps.length - 1; render(); });
resetStep.addEventListener("click", () => { stop(); currentStep = 0; render(); });
playStep.addEventListener("click", () => {
  if (timer) { stop(); render(); return; }
  timer = setInterval(() => {
    if (currentStep >= steps.length - 1) stop();
    else currentStep++;
    render();
  }, 850);
  render();
});
rebuild();
</script>
</body>
</html>
