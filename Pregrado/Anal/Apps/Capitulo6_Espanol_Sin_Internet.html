*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--text)}button,select,input,textarea{font:inherit}button,select{cursor:pointer}button{transition:background .15s,color .15s,transform .15s}button:hover:not(:disabled){filter:brightness(1.13)}button:disabled{opacity:.43;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-columns:254px minmax(500px,1fr) 310px;grid-template-rows:64px minmax(0,1fr)}.top{grid-column:1/-1;position:sticky;z-index:20;top:0;display:flex;align-items:center;gap:13px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brandmark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#1996bd,#775bd1);color:white;font-size:21px;font-weight:900}.brand b{font-size:15px;display:block;white-space:nowrap}.brand small{font-size:11px;color:var(--muted)}.topnav{display:flex;align-items:center;gap:9px;flex:1;justify-content:flex-end;min-width:0}.top select{max-width:260px}.progress-pill{font-size:12px;color:var(--muted);white-space:nowrap}.smallbtn,button,select,input[type=number],textarea{border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);padding:9px 12px}.smallbtn{padding:8px 11px}.primary{background:linear-gradient(120deg,#1d97bb,#535aca);color:#fff;border:none;font-weight:750}.secondary{background:var(--panel2)}.success{color:var(--green);border-color:var(--green)}.danger{color:var(--red)}.ghost{background:transparent}.left,.right{position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto;background:var(--panel);padding:16px 13px}.left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border)}.left-head{font-size:11px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;color:var(--muted);margin:7px 7px 14px}.find{width:100%;padding:10px 11px;background:var(--input);border: l circle{fill:var(--accent);stroke:var(--text)}.node.sel text{fill:var(--bg)}.node:hover circle{stroke-width:5}.graphic-note{margin-top:8px;color:var(--muted);font-size:11px}.pairrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pillbox{min-width:48px;text-align:center;background:var(--panel2);border:1px solid var(--border);padding:12px 10px;border-radius:9px;font-weight:800}.pillbox.changed{background:color-mix(in srgb,var(--green) 15%,var(--panel))}.pipeline{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:12px 0}.pipe{flex:1;min-width:120px;padding:14px;border-radius:11px;background:var(--panel2);border:1px solid var(--border)}.pipe.current{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.pipe.done{border-color:var(--green)}.pipe b{display:block;font-size:12px;margin-bottom:7px}.pipe span{font-size:11px;line-height:1.6;color:var(--muted)}.arrow{align-self:center;color:var(--accent);font-size:22px}.boolbtn{font-weight:750;border-radius:9px;min-width:72px}.boolbtn.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 15%,var(--panel))}.boolbtn.off{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--panel))}.clause{font-size:15px;display:inline-flex;align-items:center;gap:5px;padding:10px;margin:5px;border:1px solid var(--border);border-radius:9px;background:var(--panel2)}.clause.good{border-color:var(--green)}.clause.bad{border-color:var(--red)}.truth{width:100%;border-collapse:collapse;font-size:12px}.truth th,.truth td{text-align:center;padding:9px;border-bottom:1px solid var(--border)}.truth th{color:var(--muted);background:var(--panel2)}.bargraph{display:flex;align-items:flex-end;justify-content:space-around;height:145px;border-bottom:1px solid var(--border);gap:8px}.bargraph .bar{display:flex;align-items:flex-end;justify-content:center;flex:1;max-width:75px;min-width:20px;background:linear-gradient(to top,#298bb5,#a59aea);border-radius:5px 5px 0 0;color:#fff;font-size:11px;padding:5px}.tape{display:flex;flex-wrap:nowrap;gap:3px;overflow-x:auto;padding:15px 0}.tape-cell{position:relative;display:grid;place-items:center;flex:0 0 48px;height:49px;border:1px solid var(--border);background:var(--panel2);font-size:20px;font-family:monospace;font-weight:750;border-radius:7px}.tape-cell.head{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--panel))}.tape-cell.head:before{content:'▼';position:absolute;top:-21px;color:var(--accent);font-size:15px}.source-link{color:var(--accent);text-decoration:none}.source-link:hover{text-decoration:underline}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}.small-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.tiny-code{background:var(--input);color:var(--text);padding:14px;border-radius:10px;white-space:pre-wrap;overflow:auto;font:12px/1.65 ui-monospace,monospace}.chip{display:inline-block;padding:7px 10px;border-radius:9px;border:1px solid var(--border);margin:3px;font-size:12px;background:var(--panel2)}.clickable{cursor:pointer}.chip.sel{border-color:var(--accent);color:var(--accent)}.footer-nav{display:flex;justify-content:space-between;gap:8px;margin-top:23px}.footer-nav button{max-width:49%;font-size:12px;text-align:left}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.plotlegend{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}.plotlegend label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}.plotlegend i{height:9px;width:9px;border-radius:50%;display:inline-block}.hide-left .left{display:none}.hide-left.app{grid-template-columns:minmax(0,1fr) 310px}.full-lab .right{display:none}.full-lab.app{grid-template-columns:254px minmax(0,1fr)}.full-lab.hide-left.app{grid-template-columns:minmax(0,1fr)}.kicker{color:var(--muted);font-size:12px}.eval-items{display:grid;gap:12px}.eval-q{border:1px solid var(--border);border-radius:10px;padding:13px}.eval-q b{font-size:12px}.eval-q .option{margin:5px 0}.foot-license{font-size:11px;color:var(--muted);margin-top:25px;line-height:1.7}
@media(max-width:1220px){.app{grid-template-columns:215px minmax(400px,1fr) 265px}.full-lab.app{grid-template-columns:215px minmax(0,1fr)}.left{padding:12px 8px}.right{padding:12px}}

@media print{.top,.left,.right,.lab-controls,.lab-footer,.footer-nav,button{display:none!important}.app{display:block!important}.center{max-height:none;overflow:visible;width:100%;padding:10px}.lab,.eval-q{break-inside:avoid;box-shadow:none}.h1{font-size:27px}body{background:#fff!important;color:#111!important} .eval-q{border:1px solid #bbb}.option{border-color:#bbb} .lead,.fine{color:#333!important}}
.lectura-local{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:19px 22px;margin:20px 0}.lectura-local h2{margin:8px 0 14px;font-size:19px}.lectura-local p{font-size:14px;line-height:1.8;margin:11px 0}.lectura-local .nota-lectura{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px}</style>

<script>
'use strict';
const ROOT='https://opendsa-server.cs.vt.edu/OpenDSA/Books/CS4104/html/';
const TEXTOS_ESPANOL = {"1": ["Los límites de la computación se estudian desde distintos puntos de vista. Una limitación puede depender de los recursos necesarios para ejecutar un algoritmo, de la cantidad de información que debe procesarse o de la propia posibilidad de encontrar un procedimiento que resuelva todas las instancias.", "La diferencia entre tiempo polinómico, exponencial y factorial se hace decisiva a medida que aumenta el tamaño de entrada. Multiplicar la velocidad del computador no elimina una explosión combinatoria."], "2": ["Una reducción relaciona dos problemas mediante una transformación de sus instancias y, cuando hace falta, una transformación de sus soluciones. No basta con afirmar que los problemas se parecen: hay que justificar el procedimiento y su costo.", "La dirección de una reducción importa. Si A puede transformarse en B y contamos con un método eficiente para B, la transformación permite resolver A. Para transferir dificultad desde A hacia B se construye una reducción de A a B."], "3": ["P contiene los problemas de decisión que tienen algoritmos de tiempo polinómico. NP contiene los problemas cuyas respuestas afirmativas cuentan con certificados verificables en tiempo polinómico. Toda instancia de P está también en NP.", "Un problema NP-completo pertenece a NP y es al menos tan difícil como cualquier problema de NP mediante reducciones polinómicas. Se desconoce si P y NP coinciden."], "4": ["Una prueba de NP-completitud exige dos argumentos independientes: demostrar que el problema pertenece a NP y mostrar que es NP-difícil. Para la segunda parte se reduce un problema NP-completo ya conocido al problema candidato.", "La construcción debe realizarse en tiempo polinómico y preservar la respuesta sí o no de las instancias. Es un error frecuente invertir el sentido de la reducción."], "5": ["Circuit-SAT pregunta si hay alguna asignación booleana de las entradas de un circuito que haga verdadera su salida. El circuito se compone de puertas lógicas y puede evaluarse para una asignación concreta.", "El certificado es precisamente una asignación de las entradas. Comprobarla es sencillo: se calcula cada puerta y se observa la salida. Encontrar una asignación adecuada puede exigir explorar muchas posibilidades."], "6": ["SAT es el problema de determinar si una fórmula proposicional admite una interpretación que la haga verdadera. La forma normal conjuntiva expresa la fórmula como una conjunción de cláusulas, cada una formada por una disyunción de literales.", "Un literal es una variable o su negación. La fórmula completa solo se satisface cuando todas las cláusulas resultan verdaderas simultáneamente."], "7": ["En 3-SAT cada cláusula tiene a lo sumo tres literales, o exactamente tres en las formulaciones normalizadas. Aunque la expresión se restringe, el problema sigue siendo NP-completo.", "El objetivo de la exploración es encontrar una sola asignación que satisfaga simultáneamente todas las cláusulas o determinar que no existe ninguna."], "8": ["La transformación de SAT a 3-SAT reemplaza cláusulas extensas por varias cláusulas pequeñas, incorporando variables auxiliares. La propiedad fundamental que debe preservarse es la existencia de una asignación satisfactoria.", "Las nuevas fórmulas no necesitan ser equivalentes bajo todas las asignaciones de las variables auxiliares; basta con que exista una extensión adecuada de cada solución original y viceversa."], "9": ["Una clique es un conjunto de vértices en el que cada par distinto está unido por una arista. El problema de decisión pregunta si un grafo contiene una clique de tamaño al menos k.", "Verificar un conjunto candidato requiere revisar sus pares de vértices. Para encontrarlo, en cambio, puede ser necesario explorar numerosas selecciones."], "10": ["Un conjunto independiente es un conjunto de vértices sin aristas entre ninguno de sus miembros. El problema de decisión pregunta si existe uno con cardinalidad al menos k.", "Los conjuntos independientes se relacionan con las cliques del grafo complementario, donde se intercambian las aristas existentes por las ausentes entre vértices distintos."], "11": ["Una cubierta de vértices es un conjunto que toca todas las aristas: para cada arista, al menos uno de sus extremos pertenece a la cubierta. El problema de decisión pregunta si existe una cubierta de tamaño como máximo k.", "El complemento de una cubierta de vértices es un conjunto independiente. Esta relación produce una reducción inmediata entre sus versiones de decisión."], "12": ["Un ciclo hamiltoniano visita todos los vértices exactamente una vez y regresa al punto de partida. No debe confundirse con un ciclo euleriano, que recorre todas las aristas.", "Una secuencia propuesta se verifica comprobando su longitud, la unicidad de sus vértices y la existencia de las aristas consecutivas y la arista de cierre."], "13": ["El problema del viajante (TSP) busca una ruta que visite cada ciudad una sola vez y regrese al inicio minimizando el costo total. Su versión de decisión pregunta si existe una ruta con costo no superior a una cota B.", "Los algoritmos exactos, como la enumeración exhaustiva en instancias pequeñas, permiten determinar el óptimo. Las heurísticas pueden ofrecer rutas rápidas, aunque no siempre óptimas."], "14": ["Para pasar de un circuito booleano a una fórmula SAT se introducen variables que representan las salidas de puertas y cláusulas que obligan a respetar el comportamiento lógico de cada puerta.", "Esta traducción debe conservar la satisfacibilidad y mantener un tamaño polinómico respecto al circuito original."], "15": ["En una reducción de 3-SAT a clique se construye un grafo cuyos vértices representan opciones de literales de las cláusulas. Se conectan opciones de cláusulas diferentes cuando no son contradictorias entre sí.", "La búsqueda de una clique con un vértice por cláusula codifica una elección compatible de literales que hace satisfacible la fórmula."], "16": ["Para un grafo G con n vértices, un conjunto S es independiente si y solo si su complemento V\\S es una cubierta de vértices. Así, una instancia de conjunto independiente de tamaño k se relaciona con una cubierta de tamaño n−k.", "Esta correspondencia es exacta y se puede comprobar recorriendo todas las aristas del grafo."], "17": ["La reducción de 3-SAT a ciclo hamiltoniano emplea dispositivos o estructuras de grafo que representan decisiones de asignación y fuerzan la consistencia de las cláusulas.", "La idea de la demostración es que exista un ciclo hamiltoniano exactamente cuando la fórmula de origen sea satisfacible; la construcción completa debe incluir todas las conexiones de los dispositivos."], "18": ["Una clique de tamaño k en G es un conjunto independiente de tamaño k en el grafo complementario de G. Esta es una reducción particularmente directa entre dos problemas de decisión.", "Es necesario conservar el mismo conjunto de vértices y complementar únicamente las aristas entre pares distintos."], "19": ["A partir de un grafo para ciclo hamiltoniano, se forma una instancia completa del viajante: las aristas del grafo original reciben un costo bajo y las aristas añadidas un costo alto.", "Una cota adecuada permite que exista un recorrido de costo pequeño si y solo si el grafo inicial tenía un ciclo hamiltoniano."], "20": ["Cuando un problema es NP-completo, suele ser útil considerar soluciones aproximadas, heurísticas, restricciones a familias particulares de instancias, programación exponencial optimizada o métodos parametrizados.", "Una aproximación con garantía demuestra una relación formal con el óptimo; una heurística sin garantía puede ser eficaz en la práctica, pero debe evaluarse experimentalmente."], "21": ["Existen problemas que ningún algoritmo general puede resolver para todas las entradas. La indecidibilidad no significa simplemente que un procedimiento sea lento.", "El problema de la parada pregunta si un programa se detendrá para una entrada dada. Un razonamiento diagonal conduce a una contradicción si se supone que existe un decisor universal correcto."], "22": ["Una máquina de Turing modela una computación mediante una cinta, una cabeza lectora y escritora, un conjunto finito de estados y reglas de transición.", "Cada transición observa el estado y el símbolo, escribe otro símbolo, mueve la cabeza y cambia de estado. Las máquinas permiten definir con precisión computabilidad y reconocimiento."], "23": ["Las máquinas de Turing pueden extenderse con varias cintas, variantes de movimiento y otras comodidades sin cambiar la clase de funciones computables en el modelo clásico.", "El análisis de lenguajes decidibles y reconocibles permite diferenciar entre detenerse con una respuesta y aceptar determinadas cadenas aunque otras ejecuciones puedan continuar indefinidamente."]};
const LESSONS=[
{id:1,name:'Límites de la computación',group:'Panorama y reducciones',file:'LimComp.html',lab:'growth',lead:'La dificultad no depende solo de la velocidad del equipo: el crecimiento de la cantidad de trabajo puede hacer inviable incluso un algoritmo sencillo.',ideas:['Un algoritmo factorial examina órdenes posibles; uno exponencial explora combinaciones.','Un problema puede ser costoso, difícil de clasificar o directamente indecidible.','La longitud de la salida también impone límites inferiores.'],aim:'Distinguir crecimiento polinómico, exponencial y factorial mediante una gráfica interactiva.',q:'¿Qué cambia al duplicar la potencia del equipo para un algoritmo de costo 2ⁿ?',opts:['Permite aproximadamente un elemento más con el mismo presupuesto.','Permite duplicar n.','Convierte la complejidad en lineal.'],ans:0,why:'La igualdad 2^(n+1) = 2·2^n muestra que duplicar los recursos solo añade una unidad al tamaño admisible.'},
{id:2,name:'Reducciones',group:'Panorama y reducciones',file:'Reduction.html',lab:'pair',lead:'Reducir A a B significa transformar instancias de A en instancias de B de modo que una solución de B permita resolver A.',ideas:['Dirección A ≤ B: un algoritmo de B permite resolver A.','Para obtener cotas se deben contabilizar las transformaciones y la llamada a B.','Ordenar dos listas resuelve el emparejamiento por rangos.'],aim:'Seguir las tres etapas de una reducción entre emparejamiento y ordenación.',q:'Si A se reduce en tiempo polinómico a B y B es fácil, ¿qué conclusión se obtiene?',opts:['A también puede resolverse en tiempo polinómico.','B es necesariamente NP-completo.','A es más difícil que B.'],ans:0,why:'Con dos transformaciones polinómicas y un solucionador polinómico para B se obtiene un algoritmo polinómico para A.'},
{id:3,name:'P, NP y NP-completitud',group:'Panorama y reducciones',file:'NPComplete.html',lab:'classes',lead:'Un problema de decisión pertenece a NP cuando una respuesta afirmativa admite un certificado verificable en tiempo polinómico.',ideas:['P: problemas de decisión resolubles en tiempo polinómico.','NP-completo: está en NP y todo problema de NP se reduce a él en tiempo polinómico.','NP-difícil: al menos tan difícil como los problemas de NP; no necesita pertenecer a NP.'],aim:'Clasificar ejemplos sin confundir resolver, verificar y optimizar.',q:'¿Está demostrado que P ≠ NP?',opts:['Sí, desde el teorema de Cook–Levin.','No; sigue siendo una pregunta abierta.','Sí, porque existe TSP.'],ans:1,why:'Sabemos P ⊆ NP, pero no se ha demostrado si son iguales o distintos.'},
{id:4,name:'Cómo demostrar NP-completitud',group:'Panorama y reducciones',file:'provingNPC.html',lab:'proof',lead:'Una demostración correcta tiene dos piezas: mostrar pertenencia a NP y reducir un problema NP-completo conocido al problema nuevo.',ideas:['El sentido correcto es conocido NP-completo → candidato.','Es necesario probar equivalencia de respuestas SÍ/NO para todas las instancias.','La transformación debe ejecutarse en tiempo polinómico.'],aim:'Construir una demostración siguiendo una guía de verificación.',q:'Para demostrar que X es NP-difícil, ¿qué reducción se debe construir?',opts:['X ≤p SAT.','SAT ≤p X.','X ≤p ordenación.'],ans:1,why:'Reducir un problema ya NP-completo a X permite transferir la dificultad conocida hacia X.'},
{id:5,name:'Satisfacibilidad de circuitos',group:'SAT y lógica',file:'circuitSAT.html',lab:'circuit',lead:'En Circuit-SAT se busca una entrada booleana que haga que la salida de un circuito sea verdadera.',ideas:['Una asignación se verifica evaluando sus puertas.','Explorar todas las entradas requiere hasta 2ⁿ combinaciones.','Un circuito representa una computación lógica finita.'],aim:'Conectar entradas, puertas AND/OR/NOT y salida, y buscar una asignación que satisfaga el circuito.',q:'¿Qué constituye un certificado de tipo SÍ para Circuit-SAT?',opts:['Una asignación de las entradas que da salida 1.','Una demostración de que no existe entrada válida.','La lista completa de todos los circuitos posibles.'],ans:0,why:'Basta una asignación concreta y evaluar el circuito para comprobar su salida.'},
{id:6,name:'Satisfacibilidad de fórmulas (SAT)',group:'SAT y lógica',file:'SAT.html',lab:'sat',lead:'SAT pregunta si existe una asignación de verdad que satisfaga una fórmula booleana, representada aquí en forma normal conjuntiva.',ideas:['Una cláusula es una disyunción de literales.','La fórmula es la conjunción de todas las cláusulas.','Verificar una asignación es distinto de encontrarla.'],aim:'Cambiar valores de variables y observar en vivo cada cláusula.',q:'Una fórmula en FNC es verdadera cuando…',opts:['Al menos una cláusula resulta verdadera.','Todas las cláusulas resultan verdaderas.','Todas las variables valen 1.'],ans:1,why:'Las cláusulas se conectan por AND, de modo que ninguna puede fallar.'},
{id:7,name:'Satisfacibilidad 3-SAT',group:'SAT y lógica',file:'threeSAT.html',lab:'sat3',lead:'3-SAT restringe las fórmulas a cláusulas de tres literales; sigue siendo NP-completo.',ideas:['Cada cláusula contiene tres posiciones de literales (pueden variar las variables y negaciones).','La pregunta es si todas las cláusulas pueden ser verdaderas simultáneamente.','Los certificados se verifican evaluando cada cláusula.'],aim:'Investigar un caso con tres cláusulas e identificar un testigo satisfactorio.',q:'¿Qué ocurre al restringir SAT a 3-SAT?',opts:['El problema pasa siempre a P.','El problema sigue siendo NP-completo.','Se vuelve indecidible.'],ans:1,why:'Existe una reducción polinómica de SAT a 3-SAT; el problema sigue estando en NP.'},
{id:8,name:'Reducción de SAT a 3-SAT',group:'SAT y lógica',file:'SAT_to_threeSAT.html',lab:'satconvert',lead:'Una cláusula larga puede reemplazarse por cláusulas de tres literales usando variables auxiliares, preservando satisfacibilidad.',ideas:['Para cuatro literales: (a∨b∨c∨d) ≡∃y [(a∨b∨y)∧(¬y∨c∨d)].','La asignación de la nueva variable puede variar.','Se conserva la existencia de una solución, no necesariamente la misma función de verdad en todas las variables.'],aim:'Comprobar la equivalencia existencial para las 16 asignaciones de cuatro variables.',q:'¿Qué se conserva al convertir una cláusula de cuatro literales a 3-SAT?',opts:['Siempre el mismo número de variables.','La satisfacibilidad, permitiendo variables auxiliares.','El valor de cualquier variable auxiliar.'],ans:1,why:'Las variables añadidas dan libertad para construir una solución cuando la cláusula original es satisfacible.'},
{id:9,name:'Problema del clique',group:'Problemas en grafos',file:'clique.html',lab:'clique',lead:'Un clique de tamaño k es un conjunto de al menos k vértices donde cada pareja distinta está conectada.',ideas:['La decisión CLIQUE(G,k) pregunta si existe ese conjunto.','Se comprueba un candidato examinando sus pares de vértices.','El clique máximo es una variante de optimización.'],aim:'Seleccionar vértices, comprobar un clique y buscar uno máximo.',q:'En un clique de cuatro vértices, ¿cuántas aristas internas debe haber?',opts:['4','6','8'],ans:1,why:'En un grafo simple no dirigido se necesitan C(4,2)=6 aristas.'},
{id:10,name:'Conjunto independiente',group:'Problemas en grafos',file:'independentSet.html',lab:'independent',lead:'Un conjunto independiente contiene vértices entre los cuales no existe ninguna arista.',ideas:['Es el contraste del clique: se prohíben enlaces internos.','El tamaño máximo puede hallarse por búsqueda exhaustiva para grafos pequeños.','Un clique en G corresponde a un conjunto independiente en el complemento de G.'],aim:'Elegir nodos no adyacentes y buscar un conjunto independiente máximo.',q:'Si S es independiente en G, ¿qué puede afirmarse de S en el complemento de G?',opts:['S es un clique.','S es siempre una cubierta de vértices.','S forma un ciclo hamiltoniano.'],ans:0,why:'Todas las parejas ausentes en G se convierten en aristas en su complemento.'},
{id:11,name:'Cubierta de vértices',group:'Problemas en grafos',file:'vertexCover.html',lab:'cover',lead:'Una cubierta de vértices toca todas las aristas: al menos un extremo de cada arista pertenece al conjunto elegido.',ideas:['El complemento en los vértices de una cubierta es un conjunto independiente.','Una cubierta mínima busca usar pocos vértices.','Tomar ambos extremos de un matching maximal produce una 2-aproximación.'],aim:'Cubrir todas las aristas y comparar la selección con una solución exacta.',q:'Si C es una cubierta de G, entonces V\\C es…',opts:['Un conjunto independiente.','Siempre un clique.','Una ruta hamiltoniana.'],ans:0,why:'Si dos vértices fuera de C fueran adyacentes, su arista quedaría descubierta.'},
{id:12,name:'Ciclo hamiltoniano',group:'Problemas en grafos',file:'hamiltonianCycle.html',lab:'hamilton',lead:'Un ciclo hamiltoniano visita todos los vértices exactamente una vez antes de regresar al punto inicial.',ideas:['No es lo mismo que un ciclo euleriano, que recorre aristas.','Comprobar un ciclo propuesto es relativamente sencillo.','Buscar un ciclo en un grafo general es NP-completo en su versión de decisión.'],aim:'Construir un recorrido válido con clics sobre los vértices.',q:'Un ciclo hamiltoniano de n vértices utiliza cuántas aristas en el ciclo?',opts:['n','n−1','2n'],ans:0,why:'Incluye una arista por cada paso y otra para volver al origen: exactamente n.'},
{id:13,name:'Viajante de comercio (TSP)',group:'Problemas en grafos',file:'TSP.html',lab:'tsp',lead:'En TSP buscamos una gira de costo mínimo que visite cada ciudad una vez y retorne al origen; la versión de decisión pregunta si existe una gira de costo ≤ B.',ideas:['La variante de optimización busca la mejor gira, no solo una respuesta SÍ/NO.','Una gira propuesta y su costo se pueden verificar rápidamente.','Vecino más cercano y 2-opt ofrecen soluciones heurísticas.'],aim:'Comparar ruta manual, vecino más cercano y búsqueda exhaustiva.',q:'¿Cuál es la versión de decisión de TSP?',opts:['¿Existe una gira de costo a lo sumo B?','¿Cuál es la gira mínima exacta?','¿Cuántas ciudades tiene el mapa?'],ans:0,why:'La pregunta SÍ/NO con un umbral es la formulación habitual para NP-completitud.'},
{id:14,name:'De Circuit-SAT a SAT',group:'Reducciones NP-completas',file:'circuitSAT_to_SAT.html',lab:'tseitin',lead:'Representamos las puertas del circuito mediante variables intermedias y cláusulas que fuerzan su comportamiento correcto.',ideas:['Cada puerta se codifica mediante restricciones locales.','La variable de salida debe ser verdadera.','La transformación conserva la satisfacibilidad con tamaño polinómico.'],aim:'Ver las restricciones lógicas de un circuito y comprobar las variables internas.',q:'¿Para qué sirven las variables auxiliares al convertir un circuito a FNC?',opts:['Para representar salidas de puertas intermedias.','Para eliminar todas las cláusulas.','Para garantizar que la fórmula sea falsa.'],ans:0,why:'Una variable auxiliar representa la salida de cada subcircuito y las cláusulas imponen las equivalencias necesarias.'},
{id:15,name:'De 3-SAT a Clique',group:'Reducciones NP-completas',file:'threeSAT_to_clique.html',lab:'satclique',lead:'Creamos un vértice por literal de cada cláusula y conectamos literales compatibles de cláusulas diferentes.',ideas:['Las aristas unen cláusulas distintas y evitan contradicciones como x y ¬x.','Un clique de tamaño m elige un literal consistente por cada una de las m cláusulas.','Así se relaciona la satisfacibilidad de 3-SAT con CLIQUE.'],aim:'Explorar un grafo de nueve literales y construir un clique de tamaño tres.',q:'En la reducción estándar 3-SAT → CLIQUE, k es igual a…',opts:['Número de variables.','Número de cláusulas.','Número de aristas.'],ans:1,why:'Se selecciona un literal compatible por cada cláusula, así que k=m.'},
{id:16,name:'De conjunto independiente a cubierta',group:'Reducciones NP-completas',file:'independentSet_to_vertexCover.html',lab:'duality',lead:'En un mismo grafo, S es independiente si y solo si V\\S es una cubierta de vértices.',ideas:['Se conservan los mismos vértices y aristas.','El umbral cambia de k a n−k.','La equivalencia se demuestra examinando qué ocurriría con una arista descubierta.'],aim:'Observar simultáneamente un conjunto S y su complemento V\\S.',q:'Si hay n vértices e independiente de tamaño k, ¿qué tamaño tiene su cubierta complementaria?',opts:['n+k','n−k','k²'],ans:1,why:'Los dos conjuntos particionan los n vértices.'},
{id:17,name:'De 3-SAT a ciclo hamiltoniano',group:'Reducciones NP-completas',file:'threeSAT_to_hamiltonianCycle.html',lab:'reductionHC',lead:'Los gadgets de una reducción deben obligar a recorrer elecciones de variables y a satisfacer cada cláusula para completar un ciclo.',ideas:['Un gadget es una estructura que fuerza comportamientos del recorrido.','Una construcción correcta debe funcionar para todas las instancias, no solo para un ejemplo.','Se visualiza aquí la arquitectura conceptual, no un gadget formal completo.'],aim:'Recorrer un esquema explicativo de gadgets y sus obligaciones lógicas.',q:'En una reducción mediante gadgets, lo imprescindible es que…',opts:['La imagen se vea simétrica.','La instancia transformada sea SÍ si y solo si la original es SÍ.','Los dos grafos tengan idéntico tamaño.'],ans:1,why:'La condición de ida y vuelta, más el costo polinómico, es lo que hace válida la reducción.'},
{id:18,name:'De Clique a conjunto independiente',group:'Reducciones NP-completas',file:'clique_to_independentSet.html',lab:'complement',lead:'Al complementar un grafo, cada arista se convierte en ausencia de arista y cada no-arista en arista (sin lazos).',ideas:['Un clique de tamaño k en G es un conjunto independiente de tamaño k en Ḡ.','El complemento del grafo se construye en tiempo polinómico.','La reducción preserva el parámetro k.'],aim:'Comparar dos grafos sincronizados y examinar un mismo conjunto de vértices.',q:'Para transformar CLIQUE(G,k) a INDEPENDIENTE, se utiliza…',opts:['El mismo grafo y el mismo k.','El grafo complemento y el mismo k.','El grafo transpuesto y k−1.'],ans:1,why:'Complementar intercambia aristas/no-aristas entre vértices distintos.'},
{id:19,name:'De ciclo hamiltoniano a TSP',group:'Reducciones NP-completas',file:'hamiltonianCycle_to_TSP.html',lab:'hctsp',lead:'A partir de un grafo sin pesos se construye un grafo completo: costo 1 en las aristas originales y costo 2 donde faltaban.',ideas:['El umbral para una gira de n vértices se establece en B=n.','Si existe ciclo hamiltoniano, hay gira de costo exactamente n.','Si existe gira de costo ≤n, todas sus aristas deben costar 1.'],aim:'Examinar la matriz de pesos 1/2 y comprobar el umbral de la reducción.',q:'En HC → TSP con pesos 1 y 2, ¿cuál es el umbral de decisión?',opts:['2n','n','n²'],ans:1,why:'Toda gira tiene exactamente n aristas y cada una cuesta al menos 1.'},
{id:20,name:'Cómo afrontar problemas NP-completos',group:'Aplicación y computabilidad',file:'NPCoping.html',lab:'strategies',lead:'Reconocer una dificultad estructural permite elegir un enfoque pragmático: casos pequeños, restricciones, poda, programación dinámica o aproximación.',ideas:['Backtracking y branch-and-bound pueden podar sin perder exactitud.','Las heurísticas aceleran la búsqueda, pero no necesariamente garantizan optimalidad.','Algunas aproximaciones ofrecen cotas demostradas, como factor 2 para cubierta de vértices.'],aim:'Comparar empaquetado de contenedores con primer ajuste y primer ajuste decreciente.',q:'¿Cuál afirmación sobre una heurística es correcta?',opts:['Siempre produce el óptimo.','Puede ser útil sin garantizar optimalidad.','Convierte cualquier problema NP-completo a P.'],ans:1,why:'Una heurística ofrece soluciones prácticas, pero sus resultados no son necesariamente óptimos ni vienen con garantía.'},
{id:21,name:'Problemas indecidibles',group:'Aplicación y computabilidad',file:'Impossible.html',lab:'halting',lead:'Existen preguntas perfectamente definidas para las cuales ningún algoritmo general decide correctamente todas las entradas.',ideas:['La indecidibilidad del problema de la parada se prueba por contradicción autorreferencial.','Ejecutar un programa durante muchos pasos sin detenerse no demuestra que nunca se detendrá.','El argumento diagonal distingue funciones de programas computables.'],aim:'Explorar Collatz con límite de pasos y reconstruir la paradoja de la parada.',q:'Si un programa lleva un millón de pasos sin detenerse, ¿qué se puede concluir en general?',opts:['Que nunca se detendrá.','Que aún no se ha detenido; no basta para decidirlo.','Que pertenece a NP-completo.'],ans:1,why:'Un tiempo de ejecución observado no decide universalmente la parada de programas arbitrarios.'},
{id:22,name:'Introducción a máquinas de Turing',group:'Aplicación y computabilidad',file:'TuringMachines.html',lab:'turing',lead:'La máquina de Turing modela cómputo con una cinta, una cabeza lectora/escritora, estados y reglas de transición.',ideas:['Cada paso lee un símbolo, escribe otro, mueve la cabeza y cambia de estado.','Una máquina puede detenerse aceptando, rechazando o continuar ejecutándose.','Sirve para distinguir lenguajes decidibles de meramente reconocibles.'],aim:'Simular una máquina que incrementa un número binario o agrega un 1 unario.',q:'¿Qué describe una transición de máquina de Turing?',opts:['Solo la duración en segundos.','Estado actual y símbolo leído → símbolo escrito, movimiento y nuevo estado.','Una lista completa de programas posibles.'],ans:1,why:'Una regla especifica escritura, desplazamiento y cambio de estado a partir del estado y símbolo.'},
{id:23,name:'Máquinas de Turing: temas avanzados',group:'Aplicación y computabilidad',file:'TuringMachinesAdv.html',lab:'advanced',lead:'Distintas variantes de máquinas de Turing permiten organizar mejor los algoritmos sin cambiar la clase de funciones computables.',ideas:['Se pueden diseñar subrutinas y máquinas con varias cintas.','Una máquina universal interpreta la descripción de otra máquina.','La tesis de Church–Turing relaciona el concepto informal de algoritmo con modelos formales de cómputo.'],aim:'Simular transiciones, estudiar estados y distinguir reconocimiento frente a decisión.',q:'¿Una máquina de Turing con varias cintas calcula funciones imposibles para la máquina estándar?',opts:['Sí, siempre.','No: las variantes convencionales tienen el mismo poder de computabilidad.','Solo si la cinta es infinita.'],ans:1,why:'Las máquinas multicinta pueden ser más cómodas o eficientes, pero pueden simularse con máquinas de una cinta.'}

const OPENQ=[{q:'Explica cómo demostrarías que un problema X es NP-completo. ¿En qué sentido debe ir la reducción?',guide:'Demostrar X∈NP por un verificador polinómico; elegir un problema A conocido NP-completo y construir A≤pX; probar equivalencia en ambas direcciones y costo polinómico.'},{q:'Justifica con una demostración breve por qué un clique de tamaño k en G produce un conjunto independiente de tamaño k en su complemento.',guide:'Para cada pareja de vértices del clique existe arista en G; por definición del complemento no existe esa arista en Ḡ. Por tanto no hay aristas entre los vértices escogidos en Ḡ.'},{q:'¿Por qué un programa que ejecuta otro durante 10⁹ pasos sin parar no resuelve el problema de la parada?',guide:'Que no se detenga dentro de un límite finito no significa que nunca se vaya a detener. No hay una cota computable universal para la parada de todos los programas arbitrarios.'}];
function renderExam(){drawNav();let q=ST.examQs,answers=ST.examAnswers,done=ST.examDone,correct=q.filter(id=>answers[id]===LESSONS[id-1].ans).length,total=q.length;$('main').innerHTML=`<div class="eyebrow">EVALUACIÓN INTEGRADORA · CAPÍTULO 6</div><h1 class="h1">Prueba interactiva: límites computacionales</h1><p class="lead">${total} preguntas de selección múltiple y ${OPENQ.length} preguntas abiertas. Primero responde; después comprueba tus respuestas con explicaciones. Las preguntas abiertas se autoevalúan con una pauta orientativa, no con calificación automática.</p><div class="cards"><div class="data-card"><small>Selección múltiple</small><strong>${total}</strong></div><div class="data-card"><small>Preguntas abiertas</small><strong>${OPENQ.length}</strong></div><div class="data-card"><small>${done?'Respuestas correctas':'Preguntas respondidas'}</small><strong>${done?correct:Object.keys(answers).filter(k=>!String(k).startsWith('open')).length} / ${total}</strong></div></div><div class="section-row"><h2>Parte A · Selección múltiple</h2></div><div class="eval-items">${q.map((id,index)=>{let x=LESSONS[id-1],sel=answers[id];return `<div class="eval-q"><div class="small-label">${index+1}. Tema 6.${id} · ${E(x.name)}</div><p class="question">${E(x.q)}</p>${x.opts.map((o,i)=>`<button data-act="evalpick" data-id="${id}" data-v="${i}" ${done?'disabled':''} class="option ${sel===i?'chosen':''} ${done&&i===x.ans?'answer':''} ${done&&sel===i&&i!==x.ans?'wrong':''}">${'ABC'[i]}. ${E(o)}</button>`).join('')}${done?`<div class="feedback ${sel===x.ans?'ok':'bad'}">${sel===x.ans?'✓ Correcta':'✗ Respuesta correcta: '+ 'ABC'[x.ans]}. ${E(x.why)}</div>`:''}</div>`}).join('')}</div><div class="section-row"><h2>Parte B · Preguntas abiertas</h2></div><div class="eval-items">${OPENQ.map((a,i)=>`<div class="eval-q"><b>${i+1}. ${E(a.q)}</b><textarea data-open="${i}" ${done?'readonly':''} style="margin-top:10px;width:100%;min-height:100px;resize:vertical" placeholder="Escribe aquí tu argumentación…">${E(answers['open'+i]||'')}</textarea>${done?`<div class="notice" style="margin-top:10px"><b>Pauta de revisión:</b> ${E(a.guide)}</div>`:''}</div>`).join('')}</div><div class="footer-nav">${btn('Volver a las unidades','backlesson')} ${done?btn('↺ Nueva evaluación','examreset','primary'):btn('✓ Calificar selección múltiple','examsubmit','primary')}</div>`;
$('right').innerHTML=`<div class="eyebrow">EVALUACIÓN FORMATIVA</div><h2>${done?'Resultados y revisión':'Indicaciones'}</h2><div class="qcard">${done?`<div class="data-card"><small>Selección múltiple</small><strong>${correct} / ${total}</strong><p>${Math.round(100*correct/total)}% de respuestas correctas. Revisa las explicaciones junto a cada pregunta.</p></div>`:`<p>Elige una alternativa por pregunta. Puedes dejar preguntas sin responder: se considerarán incorrectas al calificar.</p><p>Las preguntas abiertas quedan almacenadas en la página durante esta sesión.</p>`}</div><div class="sidebar-divider"></div>${btn('↓ Exportar resultados','exportexam')} ${btn('Imprimir / PDF','print','secondary')}<p class="fine">La evaluación se ejecuta completamente en tu navegador. No se envían respuestas a ningún servidor.</p>`}
function exportProgress(){let data={fecha:new Date().toLocaleString('es-CO'),unidadesExploradas:[...ST.visited].sort((a,b)=>a-b),aciertos:[...ST.mastered].sort((a,b)=>a-b),respuestas:ST.answers,nota:'Aciertos de predicción conceptual por unidad. No constituye calificación formal.'};download('progreso_limites_computacion.json',JSON.stringify(data,null,2),'application/json')}
function exportExam(){let Q=ST.examQs,done=ST.examDone,correct=Q.filter(id=>ST.examAnswers[id]===LESSONS[id-1].ans).length;let out=`EVALUACIÓN CAPÍTULO 6 · LÍMITES COMPUTACIONALES\nFecha: ${new Date().toLocaleString('es-CO')}\n${done?'Puntaje de selección múltiple: '+correct+'/'+Q.length:'Evaluación sin calificar'}\n\n`;Q.forEach((id,i)=>{let x=LESSONS[id-1],sel=ST.examAnswers[id];out+=`${i+1}. [6.${id}] ${x.q}\nRespuesta: ${sel===undefined?'Sin responder':'ABC'[sel]}${done?' · Correcta: '+'ABC'[x.ans]:''}\n${done?x.why+'\n':''}\n`});OPENQ.forEach((x,i)=>{out+=`ABIERTA ${i+1}: ${x.q}\n${ST.examAnswers['open'+i]||'Sin responder'}\n${done?'Pauta: '+x.guide+'\n':''}\n`});download('evaluacion_limites_computacion.txt',out,'text/plain')}
function download(name,contents,type){let blob=new Blob([contents],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function click(e){let el=e.target.closest('[data-act]');if(!el)return;let a=el.dataset.act,id=+(el.dataset.id||0);if(a==='nav')return navigate(id);if(a==='pick'){if(ST.answers[ST.current]!==undefined)return;ST.picked=id;renderRight();return}if(a==='check'){if(ST.picked===null)return;ST.answers[ST.current]=ST.picked;if(ST.picked===l().ans)ST.mastered.add(ST.current);persist();renderRight();drawNav();$('top-progress').textContent=`${ST.visited.size}/23 exploradas · ${ST.mastered.size}/23 predicciones correctas`;return}if(a==='retry'){delete ST.answers[ST.current];ST.picked=null;ST.hint=false;persist();renderRight();return}if(a==='hint'){ST.hint=!ST.hint;renderRight();return}if(a==='setn'){ST.lab.n=+el.dataset.n;return renderLab()}if(a==='resetstep'){ST.lab.step=0;return renderLab()}if(a==='prevstep'){ST.lab.step=Math.max(0,(ST.lab.step||0)-1);return renderLab()}if(a==='nextstep'){let max=l().lab==='classes'?5:l().lab==='pair'||l().lab==='proof'||l().lab==='reductionHC'?4:99;ST.lab.step=Math.min(max,(ST.lab.step||0)+1);return renderLab()}if(a==='var'){let k=el.dataset.var;ST.lab.vals[k]=1-ST.lab.vals[k];ST.lab.status='Asignación actualizada. Observa los resultados.';return renderLab()}if(a==='randomassign'){['a','b','c','d'].forEach(k=>ST.lab.vals[k]=Math.round(Math.random()));ST.lab.status='Asignación aleatoria propuesta; comprueba las cláusulas.';return renderLab()}if(a==='findsat'){if(!unlocked())return lockNotice();let clauses=ST.current===7?SAT3:SAT,hit=null;for(let i=0;i<8;i++){let v={x1:!!(i&1),x2:!!(i&2),x3:!!(i&4)},valid=evalClauses(clauses,v).every(Boolean);if(valid){hit=v;break}}if(ST.current===5||ST.current===14){ST.lab.vals={a:0,b:0,c:0,d:0};ST.lab.status='Testigo encontrado: a=0, b=0, c=0; salida de la puerta OR = 1.'}else if(hit){ST.lab.vals.a=+hit.x1;ST.lab.vals.b=+hit.x2;ST.lab.vals.c=+hit.x3;ST.lab.status='Testigo encontrado enumerando hasta ocho asignaciones posibles.'}else ST.lab.status='Fórmula insatisfacible.';return renderLab()}
if(a==='findy'){if(!unlocked())return lockNotice();let v=ST.lab.vals,z=[v.a,v.b,v.c,v.d];let y=[0,1].filter(q=>(z[0]||z[1]||q)&&(!q||z[2]||z[3]));return feedback(y.length?`Valores válidos de y: ${y.join(', ')}.`:'Sin testigo auxiliar: la cláusula original también es falsa.')}
if(a==='graphnode')return graphClick(id);
if(a==='newgraph'){ST.lab.seed++;ST.g=makeGraph(+ST.lab.cn,+ST.lab.seed,+ST.lab.cp);ST.lab.selected=[];ST.lab.order=[];ST.lab.status='Nuevo grafo generado. Prueba el mismo criterio.';return renderLab()}
if(a==='cleargraph'){ST.lab.selected=[];ST.lab.order=[];ST.lab.cnt=0;ST.lab.status='Selección reiniciada.';return renderLab()}
if(a==='editmode'){ST.lab.graphMode=ST.lab.graphMode==='edit'?'select':'edit';delete ST.lab.editFrom;ST.lab.status=ST.lab.graphMode==='edit'?'Edición de aristas: selecciona dos vértices para agregar o eliminar su enlace.':'Modo de selección activado.';return renderLab()}
if(a==='examineset')return examineSet();if(a==='solvegraph')return solveGraph();if(a==='approxcover')return solveGraph('approx');if(a==='nearest')return solveHeuristic('near');if(a==='twoopt')return solveHeuristic('opt');
if(a==='satcliquenode'){let s=chosen();ST.lab.selected=s.includes(id)?s.filter(i=>i!==id):[...s,id];return renderLab()}if(a==='solvesatclique')return solvesatclique();
if(a==='shufflepacking'){ST.lab.items.sort(()=>Math.random()-.5);ST.lab.status='Elementos reordenados: prueba la sensibilidad de primer ajuste al orden.';return renderLab()}
if(a==='difficultpacking'){ST.lab.items=[.51,.51,.51,.34,.34,.34,.16,.16,.16,.49,.49,.49];ST.lab.status='Caso de comparación: observa si la ordenación influye en el número de contenedores.';return renderLab()}
if(a==='resetpacking'){ST.lab.items=[.42,.29,.61,.24,.74,.35,.45,.21];ST.lab.status='Ejemplo inicial restaurado.';return renderLab()}
if(a==='collatzreset'){ST.lab.step=0;return renderLab()}if(a==='collatzstep'){ST.lab.step=Math.min((ST.lab.step||0)+1,300);return renderLab()}if(a==='collatzfull'){ST.lab.step=ST.lab.collatzLimit;return renderLab()}if(a==='haltnext'){ST.lab.haltPhase=((ST.lab.haltPhase||0)+1)%6;return renderLab()}
if(a==='tmreset'){initTM();return renderLab()}if(a==='tmstep'){tmStep();return renderLab()}if(a==='tmprev'){let t=ST.tape,prev=t.history.pop();if(prev){t.symbols=prev.symbols;t.head=prev.head;t.state=prev.state;t.steps=prev.steps;t.halt=prev.halt;t.logs.pop();ST.lab.status='Se restauró una transición anterior.'}return renderLab()}if(a==='tmrun'){for(let i=0;i<200&&!ST.tape.halt;i++)tmStep();ST.lab.status=ST.tape.halt?'La ejecución se detuvo.':'Límite de 200 transiciones alcanzado. No se concluye que la máquina nunca se detendrá.';return renderLab()}
if(a==='evalpick'){if(ST.examDone)return;ST.examAnswers[id]=+el.dataset.v;return renderExam()}if(a==='examsubmit'){ST.examDone=true;return renderExam()}if(a==='examreset')return showExam();if(a==='backlesson')return navigate(ST.current);if(a==='exportexam')return exportExam();if(a==='print')return window.print();}
function change(e){let k=e.target.dataset.range;if(k){ST.lab[k]=+e.target.value;if(k==='cn'){ST.lab.k=Math.min(ST.lab.k,ST.lab.cn);ST.g=makeGraph(ST.lab.cn,ST.lab.seed,ST.lab.cp);ST.lab.selected=[];ST.lab.order=[]}if(k==='cp'){ST.g=makeGraph(ST.lab.cn,ST.lab.seed,ST.lab.cp);ST.lab.selected=[];ST.lab.order=[]}return renderLab()}if(e.target.dataset.sel==='pairMode'){ST.lab.pairMode=e.target.value;ST.lab.step=0;ST.lab.status='';return renderLab()}if(e.target.dataset.sel==='tmPreset'){ST.lab.tmPreset=e.target.value;ST.lab.tmInput=TMS[ST.lab.tmPreset].input;initTM();return renderLab()}if(e.target.dataset.tmInput!==undefined){let v=e.target.value.trim();let expect=ST.lab.tmPreset==='unary'?/^[1]{0,14}$/:/^[01]{0,14}$/;if(!expect.test(v)){ST.lab.status='Entrada no válida: utiliza solo los símbolos apropiados (0/1 o únicamente 1 en unario).';return renderLab()}ST.lab.tmInput=v;initTM();return renderLab()}if(['mulX','mulY'].includes(e.target.dataset.num)){let k=e.target.dataset.num;ST.lab[k]=Math.max(-999,Math.min(999,Math.floor(+e.target.value||0)));return renderLab()}if(e.target.dataset.num==='collatzN'){ST.lab.collatzN=Math.min(9999,Math.max(1,Math.floor(+e.target.value||1)));ST.lab.step=0;return renderLab()}}
function input(e){let k=e.target.dataset.range;if(k){let label=e.target.closest('label');if(label){let b=label.querySelector('b');if(b)b.textContent=e.target.value}}let t=e.target.dataset.open;if(t!==undefined)ST.examAnswers['open'+t]=e.target.value}
init();
</script>
</body>
