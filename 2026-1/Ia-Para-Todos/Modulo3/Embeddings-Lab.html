<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Embeddings Lab · Laboratorio interactivo</title>
<style>
:root{
  --bg:#f4f6fb;--panel:#fff;--panel2:#f8f9fd;--text:#182033;--muted:#697386;--line:#dde3ed;
  --accent:#645cff;--accent2:#14b8a6;--good:#10b981;--warn:#f59e0b;--bad:#ef4444;
  --shadow:0 16px 46px rgba(35,48,78,.11);--radius:20px;
}
body.dark{--bg:#0e1320;--panel:#161d2b;--panel2:#111826;--text:#eef3ff;--muted:#a5afc1;--line:#2b3549;--accent:#8b83ff;--accent2:#2dd4bf;--shadow:0 18px 48px rgba(0,0,0,.34)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;transition:background .2s,color .2s}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.topbar-inner{height:62px;display:flex;align-items:center;gap:10px;padding:0 14px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;white-space:nowrap}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;font-weight:900}.top-actions{display:flex;gap:7px;margin-left:auto}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:8px 11px;font-weight:800}
.progress-track{height:4px;background:var(--line);position:relative}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.25s}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 66px)}.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.sidebar{border-right:1px solid var(--line);padding:14px 12px;background:var(--panel);position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto;transition:.25s;z-index:20}.app.collapsed .sidebar{transform:translateX(-100%);opacity:0;pointer-events:none}.side-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900;padding:5px 8px 9px}.navbtn{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;border-radius:12px;padding:9px 10px;display:flex;gap:9px;align-items:flex-start;margin:1px 0}.navbtn b{color:inherit;min-width:27px}.navbtn span{font-size:13px;line-height:1.25}.navbtn:hover,.navbtn.active{background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--text)}.navbtn.lab{margin-top:9px;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));font-weight:800}
.content{padding:18px;min-width:0}.module{display:none;animation:appear .25s ease}.module.active{display:block}@keyframes appear{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
.module-inner{max-width:1440px;margin:0 auto}.module-inner.wide{max-width:none}.hero{background:radial-gradient(circle at 92% 18%,color-mix(in srgb,var(--accent2) 18%,transparent),transparent 26%),radial-gradient(circle at 6% 0,color-mix(in srgb,var(--accent) 14%,transparent),transparent 29%),var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px 24px;margin-bottom:14px;box-shadow:var(--shadow)}.hero.compact{padding:15px 20px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--accent);font-weight:900}.hero h1{margin:5px 0 7px;font-size:clamp(27px,3vw,42px);line-height:1.08}.hero.compact h1{font-size:clamp(25px,2.5vw,36px)}.hero p{max-width:900px;margin:0;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span9{grid-column:span 9}.span12{grid-column:span 12}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 9px}.card p{color:var(--muted);line-height:1.52}.small{font-size:13px;color:var(--muted)}.kpi{font-size:30px;font-weight:900}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}.btn.good{background:var(--accent2)}.btn.tiny{padding:7px 9px;font-size:12px}.search{width:100%;padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--muted);background:var(--panel)}
.footer-nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0 4px}.bigword{font-size:clamp(23px,3vw,38px);font-weight:900;padding:18px 20px;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:var(--shadow)}.word-row{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.transform{font-size:clamp(22px,3.5vw,43px);font-weight:900;text-align:center;border:1px dashed var(--line);border-radius:18px;padding:28px;background:var(--panel2)}.vector{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent)}
.pipeline{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px}.pipebox{padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-weight:850;text-align:center}.arrow{font-size:24px;color:var(--accent)}.metric{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.bar{height:13px;background:color-mix(in srgb,var(--accent) 12%,var(--line));border-radius:999px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}.math{display:none;background:color-mix(in srgb,var(--accent) 7%,var(--panel));border-left:4px solid var(--accent);padding:12px;border-radius:12px;margin-top:11px}
/* immersive modules */
.immersive-wrap{position:relative}.viz-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative}.viz-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 95%,var(--bg));min-height:50px}.viz-stage{position:relative;width:100%;height:clamp(610px,72vh,840px);background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--accent) 4%,var(--panel)),var(--panel));overflow:hidden}.viz-stage.map-stage{height:clamp(650px,78vh,900px)}.viz-stage svg{width:100%;height:100%;display:block;touch-action:none}.viz-overlay{position:absolute;right:14px;top:14px;width:min(310px,34vw);max-height:calc(100% - 28px);overflow:auto;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 12px 30px rgba(20,30,50,.15)}.viz-overlay h3{margin:0 0 8px}.viz-overlay p{margin:7px 0;color:var(--muted)}.stage-hint{position:absolute;left:14px;bottom:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(9px);border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}.viz-card:fullscreen{background:var(--panel);padding:8px}.viz-card:fullscreen .viz-stage{height:calc(100vh - 72px)}
.tooltip{position:fixed;z-index:120;display:none;pointer-events:none;background:#101827;color:white;padding:8px 10px;border-radius:10px;font-size:12px;max-width:260px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.legend{display:flex;gap:6px;flex-wrap:wrap}.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}.cluster-label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.plot-regular{height:540px;border:1px solid var(--line);border-radius:17px;background:var(--panel2);overflow:hidden}.plot-regular svg{width:100%;height:100%;display:block}.canvas-box{height:540px;position:relative;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--panel2)}.dragword{position:absolute;cursor:grab;user-select:none;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:0 7px 18px rgba(0,0,0,.12);font-weight:750}.dragword:active{cursor:grabbing}
.dim-stage{height:360px;display:grid;place-items:center;perspective:750px}.cube{width:180px;height:180px;position:relative;transform-style:preserve-3d;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}.cube div{position:absolute;width:180px;height:180px;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}.cube .f{transform:translateZ(90px)}.cube .b{transform:rotateY(180deg) translateZ(90px)}.cube .r{transform:rotateY(90deg) translateZ(90px)}.cube .l{transform:rotateY(-90deg) translateZ(90px)}.cube .t{transform:rotateX(90deg) translateZ(90px)}.cube .d{transform:rotateX(-90deg) translateZ(90px)}
.sentence{font-size:clamp(20px,2.5vw,32px);line-height:1.55;font-weight:780}.token{display:inline-block;padding:5px 7px;margin:2px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}.token.hot{background:var(--accent);color:white}.quiz-option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 13px;margin:7px 0}.quiz-option.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--panel))}.quiz-option.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
@media(max-width:1100px){.app{grid-template-columns:0 minmax(0,1fr)}.sidebar{transform:translateX(-100%);opacity:0;pointer-events:none;position:fixed;left:0;top:66px;width:260px}.app.mobile-open .sidebar{transform:none;opacity:1;pointer-events:auto}.span3,.span4,.span5,.span6,.span7,.span8,.span9{grid-column:span 12}.viz-overlay{width:280px;max-width:42vw}.content{padding:12px}}
@media(max-width:720px){.brand span{display:none}.hero{padding:16px}.content{padding:8px}.viz-stage,.viz-stage.map-stage{height:64vh;min-height:480px}.viz-overlay{position:absolute;left:10px;right:10px;top:auto;bottom:48px;width:auto;max-width:none;max-height:180px}.viz-toolbar .search{min-width:150px;flex:1}.plot-regular,.canvas-box{height:480px}.footer-nav{position:sticky;bottom:4px;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:6px;border-radius:14px}}
</style>
</head>
<body>
<div id="tooltip" class="tooltip"></div>
<header class="topbar"><div class="topbar-inner">
  <button class="iconbtn" id="menuBtn" title="Mostrar/ocultar navegación">☰</button>
  <div class="brand"><div class="logo">E</div><span>Embeddings Lab</span></div>
  <div class="top-actions"><button class="iconbtn" id="homeBtn" title="Ir al inicio">⌂</button><button class="iconbtn" id="themeBtn" title="Modo claro/oscuro">☾</button></div>
</div><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div></header>
<div class="app" id="app"><aside class="sidebar" id="sidebar"><div class="side-title">Ruta de aprendizaje</div><div id="nav"></div></aside><main class="content" id="content"></main></div>

<script>
const modules=[
 ['numbers','1','Números'],['vectors','2','Vectores'],['space','3','Espacio'],['distance','4','Distancia'],['map','5','Mapa'],['neighbors','6','Vecinos'],['analogies','7','Analogías'],['dimensions','8','Dimensiones'],['reduction','9','2D'],['build','10','Construye'],['learn','11','Aprende'],['context','12','Contexto'],['beyond','13','Más allá'],['transformers','14','Transformers'],['quiz','15','Quiz'],['lab','🧪','Laboratorio']
];
const colors={animals:'#8b5cf6',fruits:'#10b981',transport:'#f59e0b',jobs:'#3b82f6',tech:'#ef4444',cities:'#ec4899',emotions:'#06b6d4',sports:'#84cc16'};
const labels={animals:'Animales',fruits:'Frutas / comida',transport:'Transporte',jobs:'Profesiones',tech:'Tecnología',cities:'Ciudades / países',emotions:'Emociones',sports:'Deportes'};
const centers={animals:[180,175],fruits:[505,150],transport:[835,165],jobs:[175,530],tech:[520,535],cities:[880,515],emotions:[340,340],sports:[705,350]};
const words={
 animals:['perro','gato','caballo','tigre','león','elefante','conejo','lobo'],
 fruits:['manzana','pera','naranja','banana','mango','uva','fresa','piña'],
 transport:['automóvil','camión','bus','bicicleta','motocicleta','tren','avión','barco'],
 jobs:['médico','enfermero','profesor','ingeniero','abogado','arquitecto','periodista','científico'],
 tech:['computador','software','IA','robot','algoritmo','datos','internet','programación'],
 cities:['París','Bogotá','Roma','Francia','Colombia','Italia','Madrid','Londres'],
 emotions:['alegría','feliz','tristeza','miedo','amor','enojo','calma','sorpresa'],
 sports:['fútbol','balón','gol','jugador','estadio','equipo','tenis','ciclismo']
};
const points=[];Object.entries(words).forEach(([c,arr])=>{const [cx,cy]=centers[c];arr.forEach((w,i)=>{const a=i*Math.PI*2/arr.length+(c.length*.13),r=35+(i%3)*22;points.push({w,c,x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r})})});
// Adjust a few pedagogically important relations
function setp(w,x,y){const p=points.find(q=>q.w===w);if(p){p.x=x;p.y=y}}
setp('perro',145,155);setp('gato',195,150);setp('caballo',130,215);setp('tigre',230,205);setp('león',270,175);
setp('manzana',480,120);setp('pera',535,140);setp('naranja',505,195);setp('banana',575,190);setp('mango',600,130);
setp('automóvil',805,120);setp('camión',850,155);setp('bus',890,190);setp('bicicleta',770,205);setp('motocicleta',825,230);
setp('médico',140,500);setp('enfermero',195,525);setp('profesor',110,575);setp('ingeniero',245,505);setp('abogado',235,575);
setp('fútbol',680,315);setp('balón',720,295);setp('gol',735,350);setp('jugador',670,375);setp('estadio',770,385);setp('equipo',625,345);

const nearWords=['perro','gato','caballo','tigre','león','manzana','pera','naranja','banana','mango','automóvil','camión','bus','bicicleta','motocicleta','médico','enfermero','profesor','ingeniero','abogado'];
const nearPoints=nearWords.map(w=>points.find(p=>p.w===w));
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(p,n=5,pool=points){return pool.filter(q=>q!==p).sort((a,b)=>distance(p,a)-distance(p,b)).slice(0,n)}
function sim(a,b){return Math.max(0,1-distance(a,b)/950)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(title,body,span='span12'){return `<section class="card ${span}"><h3>${title}</h3>${body}</section>`}
function shell(id,kicker,title,lead,body,{wide=false,compact=false}={}){return `<section class="module" id="m-${id}"><div class="module-inner ${wide?'wide':''}"><div class="hero ${compact?'compact':''}"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${lead}</p></div>${body}<div class="footer-nav"><button class="btn secondary" onclick="move(-1)">← Anterior</button><button class="btn" onclick="move(1)">Siguiente →</button></div></div></section>`}

function render(){
 const content=document.getElementById('content');
 content.innerHTML=
 shell('numbers','Módulo 1','¿Qué significa “perro” para una computadora?','Primero descubre por qué necesitamos números antes de hablar de significado.',`<div class="grid">${card('Tres conceptos para empezar',`<div class="word-row"><div class="bigword">🍎 MANZANA</div><div class="bigword">🐶 PERRO</div><div class="bigword">🚗 AUTOMÓVIL</div></div>`)}${card('Transformación',`<div class="transform" id="transformWord">PERRO</div><div class="row" style="margin-top:12px"><button class="btn" onclick="convertWord()">Convertir palabra en números</button><button class="btn secondary" onclick="resetConvert()">Reiniciar</button></div>`,'span8')}${card('Descubrimiento',`<p><b>La computadora no “ve” significado directamente.</b></p><p>Necesita una representación numérica con la que pueda calcular, comparar y aprender.</p>`,'span4')}</div>`) +
 shell('vectors','Módulo 2','De palabra a vector','Un vector es una lista ordenada de números. Un embedding es un vector aprendido que sirve para representar relaciones útiles.',`<div class="grid">${card('Selecciona una palabra',`<select class="search" id="vecSel" onchange="showVector()"><option>perro</option><option>gato</option><option>automóvil</option></select><div id="vectorBars" style="margin-top:14px"></div>`,'span6')}${card('Palabra → Vector → Embedding',`<div class="pipeline"><div class="pipebox" id="vw">PERRO</div><div class="arrow">→</div><div class="pipebox vector" id="vv">[0.8, 0.2, 0.9]</div><div class="arrow">→</div><div class="pipebox">EMBEDDING</div></div><p class="small">En modelos reales puede haber cientos o miles de dimensiones. Aquí usamos pocas para poder visualizarlas.</p>`,'span6')}</div>`) +
 shell('space','Módulo 3 · experiencia central','Palabras similares quedan cerca','Este módulo ahora usa casi toda la pantalla. Selecciona una palabra y observa cómo aparecen sus vecinos semánticos.',`<div class="immersive-wrap"><section class="viz-card" id="spaceCard"><div class="viz-toolbar"><button class="btn tiny" onclick="spacePreset('clusters')">Ver clusters</button><button class="btn secondary tiny" onclick="spacePreset('scatter')">Mezclar puntos</button><button class="btn secondary tiny" onclick="spacePreset('clusters')">Restaurar</button><span class="pill">clic = seleccionar</span><span class="pill">hover = coordenadas</span><button class="btn secondary tiny" style="margin-left:auto" onclick="toggleFullscreen('spaceCard')">⛶ Pantalla completa</button></div><div class="viz-stage" id="spaceStage"><svg id="spaceSvg" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet"></svg><aside class="viz-overlay" id="spaceInfo"><h3>Explora el espacio</h3><p>Haz clic en <b>perro</b>, <b>manzana</b> o cualquier punto.</p><p class="small">Las líneas mostrarán sus 3 vecinos más próximos.</p></aside><div class="stage-hint">La posición importa: cerca ≈ relación</div></div></section></div>`,{wide:true,compact:true}) +
 shell('distance','Módulo 4','¿Qué significa “cerca”?','Compara dos palabras y observa su distancia y una medida de similitud.',`<div class="grid">${card('Comparador',`<div class="row"><select id="aSel" class="search" style="flex:1"></select><select id="bSel" class="search" style="flex:1"></select></div><div id="compareViz" class="plot-regular" style="height:360px;margin-top:12px"></div>`,'span8')}${card('Similitud',`<div class="kpi" id="simVal">—</div><div class="bar"><i id="simBar" style="width:0"></i></div><p>Cuanto más parecidas sean las representaciones, mayor suele ser la similitud semántica.</p><button class="btn secondary" onclick="toggleMath()">Ver matemática</button><div class="math" id="mathBox"><b>Similitud coseno</b><p class="vector">cos(θ) = (A · B) / (||A|| ||B||)</p><p class="small">Compara principalmente la dirección de dos vectores.</p></div>`,'span4')}</div>`) +
 shell('map','Módulo 5 · mapa ampliado','Mapa del significado','Explora un mapa semántico más grande, con 64 conceptos, filtros, búsqueda, zoom, pan, clusters y pantalla completa.',`<div class="immersive-wrap"><section class="viz-card" id="mapCard"><div class="viz-toolbar"><input id="mapSearch" class="search" style="max-width:220px" placeholder="Buscar palabra…" oninput="searchMap()"><select id="catFilter" class="search" style="max-width:180px" onchange="drawMap()"><option value="all">Todas las categorías</option>${Object.keys(labels).map(c=>`<option value="${c}">${labels[c]}</option>`).join('')}</select><label class="pill"><input type="checkbox" id="mapLabels" checked onchange="drawMap()"> etiquetas</label><label class="pill"><input type="checkbox" id="mapClusters" checked onchange="drawMap()"> clusters</label><button class="btn secondary tiny" onclick="mapZoom(-.15)">−</button><input id="zoomRange" type="range" min="0.75" max="2.2" step="0.05" value="1" oninput="mapState.scale=+this.value;drawMap()" style="width:110px"><button class="btn secondary tiny" onclick="mapZoom(.15)">+</button><button class="btn secondary tiny" onclick="resetMap()">Centrar</button><button class="btn secondary tiny" style="margin-left:auto" onclick="toggleFullscreen('mapCard')">⛶ Pantalla completa</button></div><div class="viz-stage map-stage" id="mapStage"><svg id="mapSvg" viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet"></svg><aside class="viz-overlay" id="mapInfo"><h3>MAPA DEL SIGNIFICADO</h3><p>Busca una palabra o arrastra el mapa para desplazarte.</p><p><b>Prueba:</b> fútbol, perro, software, París, alegría.</p><div class="legend">${Object.keys(labels).map(c=>`<span class="pill"><i class="legend-dot" style="background:${colors[c]}"></i>${labels[c]}</span>`).join('')}</div></aside><div class="stage-hint">Arrastra para mover · rueda o slider para zoom</div></div></section></div>`,{wide:true,compact:true}) +
 shell('neighbors','Módulo 6','¿Qué palabras viven cerca?','Elige una palabra y observa su vecindario semántico como una pequeña red.',`<div class="grid">${card('Red de vecinos',`<select id="neighborSel" class="search" onchange="drawNeighbors()"></select><div id="neighborNet" class="plot-regular" style="margin-top:12px"></div>`,'span8')}${card('Vecinos más cercanos',`<div id="neighborList"></div>`,'span4')}</div>`) +

function showTip(e,p,pool){const n=nearest(p,3,pool);const t=document.getElementById('tooltip');t.innerHTML=`<b>${esc(p.w)}</b><br>coordenadas: (${p.x.toFixed(0)}, ${p.y.toFixed(0)})<br><span style="opacity:.7">vecinos:</span><br>${n.map(q=>`${esc(q.w)} · ${distance(p,q).toFixed(0)}`).join('<br>')}`;t.style.display='block';t.style.left=(e.clientX+13)+'px';t.style.top=(e.clientY+13)+'px'}function hideTip(){document.getElementById('tooltip').style.display='none'}

function drawMap(){const svg=document.getElementById('mapSvg');if(!svg)return;const cat=document.getElementById('catFilter')?.value||'all',showLabels=document.getElementById('mapLabels')?.checked!==false,showClusters=document.getElementById('mapClusters')?.checked!==false;const ps=cat==='all'?points:points.filter(p=>p.c===cat);let inside='';if(showClusters){Object.entries(centers).filter(([c])=>cat==='all'||c===cat).forEach(([c,[cx,cy]])=>inside+=`<ellipse cx="${cx}" cy="${cy}" rx="135" ry="110" fill="${colors[c]}" opacity=".055" stroke="${colors[c]}" stroke-width="2" stroke-dasharray="8 8"/><text x="${cx}" y="${cy-122}" text-anchor="middle" fill="${colors[c]}" class="cluster-label">${labels[c]}</text>`)}
 if(mapState.selected){const p=points.find(q=>q.w===mapState.selected);if(p&&ps.includes(p))nearest(p,5,ps).forEach(q=>inside+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="var(--accent)" stroke-width="2.5" opacity=".8"/>`)}
 ps.forEach(p=>inside+=`<g class="map-point" data-w="${esc(p.w)}"><circle cx="${p.x}" cy="${p.y}" r="${mapState.selected===p.w?14:8}" fill="${colors[p.c]}" stroke="var(--panel)" stroke-width="3"/>${showLabels?`<text x="${p.x+11}" y="${p.y-10}" fill="currentColor" font-size="13.5" font-weight="720">${esc(p.w)}</text>`:''}</g>`);svg.innerHTML=`<g id="mapWorld" transform="translate(${mapState.tx} ${mapState.ty}) scale(${mapState.scale})">${inside}</g>`;bindMapPoints(ps);bindMapPan()}
function bindMapPoints(ps){document.querySelectorAll('#mapSvg .map-point').forEach(g=>{const p=ps.find(q=>q.w===g.dataset.w);g.style.cursor='pointer';g.onmousemove=e=>showTip(e,p,ps);g.onmouseleave=hideTip;g.onclick=e=>{e.stopPropagation();mapState.selected=p.w;document.getElementById('mapSearch').value=p.w;drawMap();showMapInfo(p,ps)}})}

function bindMapPan(){const svg=document.getElementById('mapSvg');svg.onpointerdown=e=>{if(e.target.closest('.map-point'))return;mapState.drag=true;mapState.lastX=e.clientX;mapState.lastY=e.clientY;svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!mapState.drag)return;const dx=(e.clientX-mapState.lastX)*1100/svg.clientWidth/mapState.scale,dy=(e.clientY-mapState.lastY)*700/svg.clientHeight/mapState.scale;mapState.tx+=dx;mapState.ty+=dy;mapState.lastX=e.clientX;mapState.lastY=e.clientY;drawMap()};svg.onpointerup=()=>mapState.drag=false;svg.onwheel=e=>{e.preventDefault();mapState.scale=Math.max(.75,Math.min(2.2,mapState.scale+(e.deltaY<0?.08:-.08)));document.getElementById('zoomRange').value=mapState.scale;drawMap()}}

function drawAnalogy(){const t=document.getElementById('anaSel').value,d=t==='king'?['HOMBRE','MUJER','REY','REINA']:t==='cities'?['FRANCIA','ITALIA','PARÍS','ROMA']:['HOSPITAL','ESCUELA','MÉDICO','PROFESOR'];document.getElementById('anaViz').innerHTML=`<svg viewBox="0 0 760 520"><defs><marker id="aa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--accent)"/></marker></defs><circle cx="160" cy="360" r="12" fill="var(--accent2)"/><text x="110" y="395" fill="currentColor" font-weight="800">${d[0]}</text><circle cx="325" cy="250" r="12" fill="var(--accent2)"/><text x="285" y="225" fill="currentColor" font-weight="800">${d[1]}</text><circle cx="420" cy="360" r="12" fill="var(--accent)"/><text x="390" y="395" fill="currentColor" font-weight="800">${d[2]}</text><circle cx="585" cy="250" r="12" fill="var(--accent)"/><text x="550" y="225" fill="currentColor" font-weight="800">${d[3]}</text><line x1="175" y1="352" x2="312" y2="258" stroke="var(--accent)" stroke-width="5" marker-end="url(#aa)"/><line x1="435" y1="352" x2="572" y2="258" stroke="var(--accent)" stroke-width="5" marker-end="url(#aa)"/></svg>`}
function showDim(){const v=+document.getElementById('dimRange').value,t=document.getElementById('dimText'),s=document.getElementById('dimStage');if(v===1){t.innerHTML='<h3>1 dimensión</h3><p class="vector">[0.7]</p>';s.innerHTML='<svg viewBox="0 0 700 250"><line x1="100" y1="130" x2="600" y2="130" stroke="var(--line)" stroke-width="4"/><circle cx="450" cy="130" r="13" fill="var(--accent)"/></svg>'}else if(v===2){t.innerHTML='<h3>2 dimensiones</h3><p class="vector">[0.7, 0.4]</p>';s.innerHTML='<svg viewBox="0 0 700 300"><line x1="100" y1="240" x2="600" y2="240" stroke="var(--line)" stroke-width="3"/><line x1="100" y1="240" x2="100" y2="45" stroke="var(--line)" stroke-width="3"/><circle cx="450" cy="120" r="13" fill="var(--accent)"/></svg>'}else if(v===3){t.innerHTML='<h3>3 dimensiones</h3><p class="vector">[0.7, 0.4, 0.9]</p>';s.innerHTML='<div class="cube"><div class="f"></div><div class="b"></div><div class="r"></div><div class="l"></div><div class="t"></div><div class="d"></div></div>'}else{t.innerHTML='<h3>Embedding real</h3><p class="vector">[0.12, −0.78, 0.44, 0.91, …, 0.26]</p><p><b>300 dimensiones</b></p>';s.innerHTML=`<div style="display:flex;gap:4px;align-items:flex-end;justify-content:center;flex-wrap:wrap;max-width:720px">${Array.from({length:140},(_,i)=>`<i style="display:block;width:7px;height:${12+(i*19)%78}px;background:var(--accent);opacity:${.2+(i%7)/10};border-radius:4px"></i>`).join('')}</div>`}}
function projection(type){return points.map((p,i)=>{if(type==='PCA')return {...p,x:p.x*.78+70,y:p.y*.72+55};if(type==='t-SNE'){const [cx,cy]=centers[p.c];return {...p,x:cx+(p.x-cx)*1.25,y:cy+(p.y-cy)*1.25}}return {...p,x:p.x+Math.sin(i*1.7)*18,y:p.y+Math.cos(i*1.3)*16}})}
function simplePlot(ps,view='0 0 1100 700'){return `<svg viewBox="${view}">${ps.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="7" fill="${colors[p.c]}"/><text x="${p.x+10}" y="${p.y-8}" fill="currentColor" font-size="11">${esc(p.w)}</text>`).join('')}</svg>`}
function reduce(type){document.getElementById('reductionPlot').innerHTML=simplePlot(projection(type));document.getElementById('redInfo').innerHTML=type==='PCA'?'<b>PCA</b><p>Proyección lineal: prioriza direcciones de alta variación.</p>':type==='t-SNE'?'<b>t-SNE</b><p>Favorece vecindades locales y puede separar visualmente clusters.</p>':'<b>UMAP</b><p>Busca preservar estructura local manteniendo parte de la organización global.</p>'}
const dragWords=['perro','manzana','camión','gato','pera','automóvil','león','naranja','bicicleta','tigre','banana','bus'];function initDrag(){const a=document.getElementById('dragArea');a.innerHTML='';dragWords.forEach((w,i)=>{const e=document.createElement('div');e.className='dragword';e.textContent=w;e.style.left=(20+(i*83)%640)+'px';e.style.top=(25+Math.floor(i/5)*125+(i*19)%50)+'px';a.appendChild(e);let ox=0,oy=0;e.onpointerdown=ev=>{e.setPointerCapture(ev.pointerId);ox=ev.offsetX;oy=ev.offsetY};e.onpointermove=ev=>{if(!e.hasPointerCapture(ev.pointerId))return;const r=a.getBoundingClientRect();e.style.left=Math.max(0,Math.min(r.width-e.offsetWidth,ev.clientX-r.left-ox))+'px';e.style.top=Math.max(0,Math.min(r.height-e.offsetHeight,ev.clientY-r.top-oy))+'px'}});document.getElementById('dragScore').textContent='—'}
function compareDrag(){const es=[...document.querySelectorAll('#dragArea .dragword')],pos={};es.forEach(e=>pos[e.textContent]={x:e.offsetLeft,y:e.offsetTop});const gs=[['perro','gato','león','tigre'],['manzana','pera','naranja','banana'],['camión','automóvil','bicicleta','bus']];let total=0,n=0;gs.forEach((g,gi)=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){total+=Math.hypot(pos[g[i]].x-pos[g[j]].x,pos[g[i]].y-pos[g[j]].y);n++}g.forEach(w=>{es.find(e=>e.textContent===w).style.borderColor=[colors.animals,colors.fruits,colors.transport][gi]})});document.getElementById('dragScore').textContent=Math.max(0,100-Math.round((total/n)/3))+' / 100'}
let trainPts=[];function resetTraining(){trainPts=nearPoints.slice(0,15).map((p,i)=>({...p,x:70+(i*211)%850,y:70+(i*127)%500}));document.getElementById('trainPlot').innerHTML=simplePlot(trainPts,'0 0 1000 650');document.getElementById('trainSentence').textContent='Pulsa “Entrenar”.'}async function trainEmbeddings(){const s=['El perro juega con el gato.','El tigre y el león son animales.','La manzana y la pera son frutas.','El automóvil circula con el camión.','Muchos ejemplos después…'];for(let k=0;k<42;k++){trainPts=trainPts.map(tp=>{const t=nearPoints.find(p=>p.w===tp.w);return {...tp,x:tp.x+(t.x-tp.x)*.075,y:tp.y+(t.y-tp.y)*.075}});document.getElementById('trainPlot').innerHTML=simplePlot(trainPts,'0 0 1000 650');document.getElementById('trainSentence').textContent=s[Math.min(4,Math.floor(k/9))];await new Promise(r=>setTimeout(r,42))}}
function drawBank(){document.getElementById('bankViz').innerHTML='<svg viewBox="0 0 700 320"><circle cx="190" cy="165" r="17" fill="var(--accent2)"/><text x="110" y="125" fill="currentColor" font-weight="800">BANCO (asiento)</text><circle cx="510" cy="165" r="17" fill="var(--accent)"/><text x="425" y="125" fill="currentColor" font-weight="800">BANCO (finanzas)</text><line x1="215" y1="165" x2="485" y2="165" stroke="var(--line)" stroke-width="5" stroke-dasharray="10 9"/></svg>'}
function showBeyond(i){const d=[['“perro feliz”','[0.79, −0.15, …]'],['foto de perro','[0.82, −0.12, …]'],['ladrido','[0.76, −0.08, …]'],['usuario / producto','[0.41, 0.63, …]']][i];document.getElementById('beyond'+i).innerHTML=`<div class="pipeline"><div class="pipebox">${d[0]}</div><div class="arrow">→</div><div class="pipebox">MODELO</div><div class="arrow">→</div><div class="pipebox vector">${d[1]}</div></div>`}
async function animateTokens(){const ws=['El','gato','duerme','en','la','cama'],b=document.getElementById('tokens');b.innerHTML=ws.map(w=>`<span class="token">${w}</span>`).join('');for(const e of b.children){e.classList.add('hot');await new Promise(r=>setTimeout(r,220));e.textContent+=' → v';e.classList.remove('hot')}}
const quiz=[
 {q:'¿Qué es un embedding?',o:['Una palabra guardada en una base de datos','Una representación vectorial aprendida','Una regla gramatical','Un algoritmo de búsqueda'],a:1},
 {q:'Si dos palabras tienen embeddings cercanos, normalmente…',o:['Tienen las mismas letras','Presentan alguna similitud semántica','Tienen igual longitud','Son necesariamente sinónimos perfectos'],a:1},
 {q:'¿Para qué sirven PCA, t-SNE o UMAP aquí?',o:['Para tokenizar','Para visualizar aproximadamente espacios de alta dimensión','Para traducir','Para corregir ortografía'],a:1},
 {q:'En un Transformer, el embedding de una palabra…',o:['Puede cambiar con el contexto','Siempre es idéntico','Solo contiene su frecuencia','No es numérico'],a:0},
 {q:'Una dirección del espacio puede representar…',o:['Una posible relación conceptual','Una letra','Un archivo','Una regla gramatical fija'],a:0},
 {q:'¿Qué idea resume mejor un embedding?',o:['Un diccionario comprimido','Una geometría numérica donde posición y distancia pueden reflejar relaciones','Una lista alfabética','Una tabla de frecuencias'],a:1}
];
function renderQuiz(){document.getElementById('quizBox').innerHTML=quiz.map((q,qi)=>`<div style="margin-bottom:18px"><h3>${qi+1}. ${q.q}</h3>${q.o.map((o,oi)=>`<button class="quiz-option" onclick="answerQ(${qi},${oi},this)">${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}</div>`).join('')}function answerQ(qi,oi,e){const bs=[...e.parentElement.querySelectorAll('.quiz-option')];bs.forEach((b,i)=>{b.disabled=true;if(i===quiz[qi].a)b.classList.add('correct')});if(oi!==quiz[qi].a)e.classList.add('wrong')}
function updateLab(){const a=points.find(p=>p.w===document.getElementById('labA').value),b=points.find(p=>p.w===document.getElementById('labB').value),ns=nearest(a,4);document.getElementById('labPlot').innerHTML=`<svg viewBox="0 0 1100 700">${ns.map(q=>`<line x1="${a.x}" y1="${a.y}" x2="${q.x}" y2="${q.y}" stroke="var(--accent)" stroke-width="3" opacity=".7"/>`).join('')}<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--bad)" stroke-width="4" stroke-dasharray="8 7"/>${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${p.w===a.w?14:p.w===b.w?12:7}" fill="${colors[p.c]}"/><text x="${p.x+10}" y="${p.y-9}" fill="currentColor" font-size="12">${esc(p.w)}</text>`).join('')}</svg>`;document.getElementById('labMetrics').innerHTML=`<div class="metric"><span>Distancia</span><b>${distance(a,b).toFixed(1)}</b></div><div class="metric"><span>Similitud</span><b>${sim(a,b).toFixed(2)}</b></div><h3 style="margin-top:14px">Vecinos de ${esc(a.w)}</h3>${ns.map(q=>`<span class="pill">${esc(q.w)}</span>`).join(' ')}`}
function initAll(){showVector();drawSpace();fillSelect('aSel','perro');fillSelect('bSel','gato');document.getElementById('aSel').onchange=compare;document.getElementById('bSel').onchange=compare;compare();drawMap();fillSelect('neighborSel','perro');drawNeighbors();drawAnalogy();showDim();reduce('PCA');initDrag();resetTraining();drawBank();renderQuiz();fillSelect('labA','perro');fillSelect('labB','gato');updateLab()}

document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀':'☾';localStorage.setItem('emb-theme-v2',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('emb-theme-v2')==='dark')document.body.classList.add('dark');
document.getElementById('menuBtn').onclick=()=>{const app=document.getElementById('app');if(innerWidth<=1100)app.classList.toggle('mobile-open');else app.classList.toggle('collapsed')};document.getElementById('homeBtn').onclick=()=>go('numbers');
render();
</script>
